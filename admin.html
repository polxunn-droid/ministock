<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>모의주식 관리자</title>
<style>
:root{--ink:#191f28;--muted:#8b95a1;--sub:#f2f4f6;--blue:#3182f6;--red:#f04452;--line:#edf0f3;--green:#20a36a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f6f8fa;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0}
input,textarea{font-family:inherit;font-size:15px;width:100%;padding:13px 14px;border:1px solid #dfe3e8;border-radius:12px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid #3182f633;border-color:var(--blue)}
textarea{resize:vertical;min-height:92px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 80px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{margin:0;font-size:19px;letter-spacing:-.4px}
.top .who{font-size:12px;color:var(--muted)}
.primary{background:var(--blue);color:#fff;border-radius:13px;padding:13px 18px;font-weight:750;font-size:15px}
.primary:disabled{background:#c7d6ea;cursor:not-allowed}
.ghost{background:var(--sub);color:var(--ink);border-radius:13px;padding:13px 18px;font-weight:700;font-size:15px}
.danger{background:#fff1f2;color:var(--red)}
.mini{padding:7px 11px;font-size:12px;border-radius:9px;font-weight:700;background:var(--sub);color:var(--ink)}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 1px 2px #0000000a;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:15px}
.card .desc{margin:0 0 16px;font-size:12.5px;color:var(--muted);line-height:1.55}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}
.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.quick button{background:var(--sub);color:var(--ink);border-radius:9px;padding:8px 11px;font-size:12px;font-weight:700}
.rows{border:1px solid var(--line);border-radius:14px;overflow:hidden;max-height:60vh;overflow-y:auto}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:11px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.on{background:#f4f9ff}
.row input[type=checkbox]{width:17px;height:17px;padding:0;accent-color:var(--blue)}
.row b{display:block;font-size:14px}
.row small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.row .val{text-align:right;font-size:13px;font-weight:750}
.gain{color:var(--red)}.down{color:var(--blue)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:11px;flex-wrap:wrap}
.bar .count{font-size:12px;color:var(--muted);margin-left:auto}
.actions{display:flex;gap:9px;margin-top:6px}
.actions .primary,.actions .ghost{flex:1}
.empty{text-align:center;color:var(--muted);padding:34px 0;font-size:13px}
.hist{border-bottom:1px solid var(--line);padding:13px 2px}
.hist:last-child{border-bottom:0}
.hist-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hist-head b{font-size:14px}
.hist small{color:var(--muted);font-size:11.5px;display:block;margin-top:4px}
.hist .msg{margin-top:7px;font-size:13px;background:var(--sub);border-radius:10px;padding:10px 12px;white-space:pre-wrap;line-height:1.55}
.hist .tools{display:flex;gap:7px;margin-top:9px}
.claims{margin-top:9px;font-size:12px;color:var(--muted);line-height:1.75}
.tag{display:inline-block;font-size:10.5px;font-weight:750;padding:4px 8px;border-radius:999px;background:#e8f1ff;color:var(--blue)}
.tag.all{background:#eafaf1;color:var(--green)}
.login{max-width:360px;margin:16vh auto;padding:0 18px}
.login .card{padding:26px 22px}
.login h1{margin:0 0 6px;font-size:20px}
.err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#191f28;color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;z-index:50}
.hide{display:none!important}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="card">
    <h1>관리자 로그인</h1>
    <p class="desc">지정된 관리자 계정만 접속할 수 있어요.</p>
    <div class="field"><label>이메일</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com"></div>
    <div class="field"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="primary" id="signin" style="width:100%">로그인</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<div id="console" class="wrap hide">
  <div class="top">
    <div>
      <h1>모의주식 관리자 콘솔</h1>
      <div class="who" id="who"></div>
    </div>
    <button class="mini" id="signout">로그아웃</button>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>참여자 목록</h2>
        <p class="desc">닉네임을 등록한 참여자만 표시돼요. 체크한 사람에게만 지급하거나, 전체에게 한 번에 지급할 수 있어요.</p>
        <div class="bar">
          <input id="search" placeholder="닉네임 검색" style="flex:1;min-width:150px;padding:10px 12px;font-size:14px">
          <button class="mini" id="select-all">전체선택</button>
          <button class="mini" id="select-none">선택해제</button>
          <span class="count" id="count"></span>
        </div>
        <div class="rows" id="people"><div class="empty">불러오는 중…</div></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>원화 지급</h2>
        <p class="desc">금액과 지급 멘트를 입력하고 보내면, 접속 중인 사람에게는 즉시 팝업이 뜨고 접속하지 않은 사람은 다음 접속 때 뜹니다. 예수금과 거래내역에도 자동 반영돼요.</p>
        <div class="field">
          <label>지급 금액 (원) · 음수를 넣으면 차감</label>
          <input id="amount" type="number" inputmode="numeric" placeholder="예: 500000">
          <div class="quick">
            <button data-add="100000">+10만</button>
            <button data-add="500000">+50만</button>
            <button data-add="1000000">+100만</button>
            <button data-add="5000000">+500만</button>
            <button data-add="clear">지우기</button>
          </div>
        </div>
        <div class="field"><label>제목 (선택)</label><input id="title" maxlength="40" placeholder="예: 320기 이벤트 상금"></div>
        <div class="field"><label>지급 멘트</label><textarea id="message" maxlength="400" placeholder="예: 이번 주 수익률 1위 축하합니다! 상금 50만원을 지급합니다."></textarea></div>
        <div class="actions">
          <button class="ghost" id="send-selected">선택 지급</button>
          <button class="primary" id="send-all">전체 지급</button>
        </div>
        <div class="err" id="send-err"></div>
      </div>

      <div class="card">
        <h2>지급 내역</h2>
        <p class="desc">수령 현황을 눌러 실제로 받은 사람을 확인할 수 있어요.</p>
        <div id="history"><div class="empty">불러오는 중…</div></div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyD5fQcqEpUY_ChwUdT5KlMLAzI9hzHPvEs",authDomain:"mini-stock-1c189.firebaseapp.com",projectId:"mini-stock-1c189",storageBucket:"mini-stock-1c189.firebasestorage.app",messagingSenderId:"680510173510",appId:"1:680510173510:web:15319b15831f9543c03547"};
const ADMIN_UID='7Rp29EsVDkcgDCz5T9VYn7L5AeB2';

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=ms=>ms?new Date(ms).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-';
function toast(text){const el=document.createElement('div');el.className='toast';el.textContent=text;document.body.append(el);setTimeout(()=>el.remove(),2200)}

let people=[],selected=new Set(),search='',unsubPeople=null,unsubHistory=null;

/* ---------- 로그인 ---------- */
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

$('#signin').onclick=async()=>{
  const email=$('#email').value.trim(),password=$('#password').value;
  $('#login-err').textContent='';
  if(!email||!password)return $('#login-err').textContent='이메일과 비밀번호를 입력해주세요.';
  $('#signin').disabled=true;
  try{
    const cred=await auth.signInWithEmailAndPassword(email,password);
    if(cred.user.uid!==ADMIN_UID){
      await auth.signOut();
      $('#login-err').textContent='관리자 계정이 아니에요. (UID 불일치)';
    }
  }catch(error){
    const code=error?.code||'';
    $('#login-err').textContent=
      code.includes('invalid-credential')||code.includes('wrong-password')||code.includes('user-not-found')?'이메일 또는 비밀번호가 올바르지 않아요.':
      code.includes('too-many-requests')?'시도가 너무 많아요. 잠시 후 다시 시도해주세요.':
      code.includes('operation-not-allowed')?'Firebase 콘솔에서 이메일/비밀번호 로그인을 켜주세요.':
      '로그인 실패: '+(error?.message||code);
  }finally{$('#signin').disabled=false}
};
$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')$('#signin').click()});
$('#signout').onclick=()=>auth.signOut();

auth.onAuthStateChanged(user=>{
  const ok=user&&user.uid===ADMIN_UID;
  $('#login').classList.toggle('hide',!!ok);
  $('#console').classList.toggle('hide',!ok);
  if(ok){
    $('#who').textContent=`${user.email||'관리자'} · ${user.uid.slice(0,10)}…`;
    watchPeople();watchHistory();
  }else{
    unsubPeople?.();unsubHistory?.();unsubPeople=unsubHistory=null;
    people=[];selected=new Set();
  }
});

/* ---------- 참여자 ---------- */
function watchPeople(){
  if(unsubPeople)return;
  unsubPeople=db.collection('ranking').orderBy('totalValue','desc').limit(300).onSnapshot(snap=>{
    people=snap.docs.map(d=>({uid:d.id,...d.data()})).filter(p=>typeof p.nickname==='string'&&p.nickname.trim());
    renderPeople();
  },error=>{
    $('#people').innerHTML=`<div class="empty">목록을 불러오지 못했어요.<br>${esc(error?.code||error?.message||'')}</div>`;
  });
}

function visible(){
  const q=search.trim().toLowerCase();
  return q?people.filter(p=>p.nickname.toLowerCase().includes(q)):people;
}

function renderPeople(){
  const list=visible();
  $('#count').textContent=`선택 ${selected.size} / 전체 ${people.length}명`;
  $('#people').innerHTML=list.length?list.map(p=>{
    const rate=Number.isFinite(+p.pnlRate)?+p.pnlRate:0;
    return `<label class="row ${selected.has(p.uid)?'on':''}">
      <input type="checkbox" data-uid="${esc(p.uid)}" ${selected.has(p.uid)?'checked':''}>
      <span><b>${esc(p.nickname)}</b><small>최근 활동 ${when(p.updatedAt?.toMillis?.())}</small></span>
      <span class="val">${fmt(+p.totalValue||0)}원<small class="${rate>=0?'gain':'down'}">${rate>=0?'+':''}${rate.toFixed(2)}%</small></span>
    </label>`;
  }).join(''):'<div class="empty">아직 참여자가 없어요.</div>';
}

$('#people').addEventListener('change',e=>{
  const uid=e.target.dataset?.uid;
  if(!uid)return;
  e.target.checked?selected.add(uid):selected.delete(uid);
  e.target.closest('.row')?.classList.toggle('on',e.target.checked);
  $('#count').textContent=`선택 ${selected.size} / 전체 ${people.length}명`;
});
$('#search').addEventListener('input',e=>{search=e.target.value;renderPeople()});
$('#select-all').onclick=()=>{visible().forEach(p=>selected.add(p.uid));renderPeople()};
$('#select-none').onclick=()=>{selected=new Set();renderPeople()};

/* ---------- 지급 ---------- */
document.querySelectorAll('.quick button').forEach(button=>{
  button.onclick=()=>{
    const add=button.dataset.add;
    if(add==='clear')return void($('#amount').value='');
    $('#amount').value=(+$('#amount').value||0)+ +add;
  };
});

async function send(targets){
  const amount=Math.round(+$('#amount').value||0),
        title=$('#title').value.trim(),
        message=$('#message').value.trim();
  $('#send-err').textContent='';
  if(!amount)return $('#send-err').textContent='금액을 입력해주세요.';
  if(Math.abs(amount)>1000000000)return $('#send-err').textContent='금액이 너무 커요. (10억 이하)';
  if(!message)return $('#send-err').textContent='지급 멘트를 입력해주세요.';
  const all=targets==='all',
        names=all?'전체 참여자':`선택한 ${targets.length}명`;
  if(!confirm(`${names}에게 ${amount>=0?'+':''}${fmt(amount)}원을 지급할까요?\n\n"${message}"`))return;
  $('#send-all').disabled=$('#send-selected').disabled=true;
  try{
    await db.collection('grants').add({
      amount,title,message,targets:all?'all':targets,
      targetCount:all?null:targets.length,
      createdBy:auth.currentUser.uid,
      createdAtMs:Date.now(),
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    $('#amount').value='';$('#title').value='';$('#message').value='';
    selected=new Set();renderPeople();
    toast('지급을 보냈어요');
  }catch(error){
    $('#send-err').textContent='전송 실패: '+(error?.code||error?.message||'');
  }finally{
    $('#send-all').disabled=$('#send-selected').disabled=false;
  }
}
$('#send-all').onclick=()=>send('all');
$('#send-selected').onclick=()=>{
  if(!selected.size)return $('#send-err').textContent='먼저 참여자를 선택해주세요.';
  send([...selected]);
};

/* ---------- 지급 내역 ---------- */
function watchHistory(){
  if(unsubHistory)return;
  unsubHistory=db.collection('grants').orderBy('createdAtMs','desc').limit(50).onSnapshot(snap=>{
    const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
    $('#history').innerHTML=rows.length?rows.map(g=>{
      const all=g.targets==='all',amount=+g.amount||0;
      return `<div class="hist" data-id="${esc(g.id)}">
        <div class="hist-head">
          <b>${esc(g.title||'원화 지급')}</b>
          <b class="${amount>=0?'gain':'down'}">${amount>=0?'+':''}${fmt(amount)}원</b>
        </div>
        <small>${when(+g.createdAtMs)} · <span class="tag ${all?'all':''}">${all?'전체 지급':`선택 ${g.targetCount||(g.targets||[]).length}명`}</span></small>
        <div class="msg">${esc(g.message||'')}</div>
        <div class="tools">
          <button class="mini" data-claims="${esc(g.id)}">수령 현황</button>
          <button class="mini danger" data-del="${esc(g.id)}">삭제</button>
        </div>
        <div class="claims hide" data-claimbox="${esc(g.id)}"></div>
      </div>`;
    }).join(''):'<div class="empty">아직 지급 내역이 없어요.</div>';
  },error=>{
    $('#history').innerHTML=`<div class="empty">내역을 불러오지 못했어요.<br>${esc(error?.code||error?.message||'')}</div>`;
  });
}

$('#history').addEventListener('click',async e=>{
  const claimId=e.target.dataset?.claims,delId=e.target.dataset?.del;
  if(claimId){
    const box=document.querySelector(`[data-claimbox="${claimId}"]`);
    if(!box.classList.contains('hide'))return box.classList.add('hide');
    box.classList.remove('hide');
    box.textContent='불러오는 중…';
    try{
      const snap=await db.collection('grants').doc(claimId).collection('claims').get();
      const list=snap.docs.map(d=>d.data());
      box.innerHTML=list.length
        ?`받은 사람 ${list.length}명 · ${list.map(c=>esc(c.nickname||c.uid.slice(0,6))).join(', ')}`
        :'아직 받은 사람이 없어요.';
    }catch(error){box.textContent='조회 실패: '+(error?.code||error?.message||'')}
  }
  if(delId){
    if(!confirm('이 지급 기록을 삭제할까요?\n\n이미 받은 사람의 예수금은 그대로 유지되고,\n아직 받지 못한 사람은 앞으로도 받지 못하게 됩니다.'))return;
    try{await db.collection('grants').doc(delId).delete();toast('삭제했어요')}
    catch(error){toast('삭제 실패: '+(error?.code||error?.message||''))}
  }
});
</script>
</body>
</html>
