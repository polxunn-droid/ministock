const normalizeStateBase=normalizeState;normalizeState=function(v){if(v?.marketVersion!==2){const legacy={005930:['005930',71800,105000],012450:['005380',184000,285000],105560:['105560',68400,122000],035720:['035420',45200,258000],068270:['068270',173500,189000],047810:['012450',59200,940000],950130:['326030',12800,132000],352820:['352820',86400,318000],010950:['010950',28400,89000],001230:['034020',3720,78000]},holdings={},watch=[];for(const [old,h] of Object.entries(v?.holdings||{})){const m=legacy[old];if(m&&h?.qty>0)holdings[m[0]]={qty:h.qty,avg:(+h.avg||m[1])*m[2]/m[1]}}for(const old of v?.watch||[]){const code=legacy[old]?.[0];if(code&&!watch.includes(code))watch.push(code)}v={...v,holdings,watch,tradeLog:[]}}const out=normalizeStateBase(v);out.marketVersion=2;return out};
