/* ============ V26 — 보유 ETF 긴 종목명 레이아웃 잘림 수정 ============
   긴 ETF 명칭이 가운데 열의 최소 폭을 밀어 우측 평가금액이 화면 밖으로 나가던 문제를 수정.
   종목명은 한 줄 말줄임 처리하고 평가금액 영역은 모바일에서도 항상 확보한다. */
.holding{grid-template-columns:44px minmax(0,1fr) 128px!important}
.holding>div:nth-child(2){min-width:0;overflow:hidden}
.holding .name{display:block;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.holding .sub{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.holding .price{width:128px;min-width:128px;max-width:128px;overflow:visible;text-align:right;white-space:nowrap;font-size:15px}
.holding .price small{font-size:12px;white-space:nowrap}
.portfolio-list .holding{grid-template-columns:44px minmax(0,1fr) 128px!important}
@media(max-width:359px){
  .holding,.portfolio-list .holding{grid-template-columns:40px minmax(0,1fr) 112px!important;gap:9px}
  .holding .price{width:112px;min-width:112px;max-width:112px;font-size:14px}
  .holding .price small{font-size:11px}
}

/* 4) 지급 알림 팝업 */
function grantPopup(g){
  return new Promise(resolve=>{
    const plus=g.amount>=0;
    const el=document.createElement('div');
    el.className='grant-pop';
    el.innerHTML=`<div class="grant-card">
      <span class="grant-badge">${plus?'원화 지급':'원화 차감'}</span>
      <p class="grant-title">${escHtml(g.title||(plus?'관리자 지급금이 도착했어요':'관리자 정산 안내'))}</p>
      <p class="grant-amount ${plus?'':'minus'}">${plus?'+':'-'}${fmt(Math.abs(g.amount))}원</p>
      ${g.message?`<div class="grant-msg">${escHtml(g.message)}</div>`:''}
      <p class="grant-meta">${new Date(g.at).toLocaleString('ko-KR')} · 예수금에 자동 반영되었어요</p>
      <button class="primary" data-grant-ok>확인했어요</button>
    </div>`;
    el.addEventListener('click',e=>{
      if(!e.target.closest('[data-grant-ok]'))return;
      e.stopPropagation();
      el.remove();
      resolve();
    });
    document.body.append(el);
  });
}

/* 5) 지급 수신 */
const GrantWatch={
  started:false,showing:false,unsub:null,
  start(){
    if(this.started||!Store.online||!Store.db||!Store.uid||!state)return;
    this.started=true;
    if(!Number.isFinite(+state.grantCutoff)||+state.grantCutoff<=0){
      state.grantCutoff=(state.tradeLog?.length||state.nickname)?1:Date.now();
      Store.saveMe(userId,state);
    }
    this.unsub=Store.db.collection('grants').orderBy('createdAtMs','desc').limit(80)
      .onSnapshot(snap=>{
        const list=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(+a.createdAtMs||0)-(+b.createdAtMs||0));
        this.apply(list);
      },error=>console.warn('지급 수신 실패',error?.code||error?.message));
  },
  async apply(list){
    if(!state)return;
    let changed=false;
    for(const g of list){
      const amount=Math.round(+g.amount||0);
      if(!Number.isFinite(amount)||!amount)continue;
      const all=g.targets==='all',mine=all||(Array.isArray(g.targets)&&g.targets.includes(Store.uid));
      if(!mine)continue;
      if((state.grants||[]).some(x=>x.id===g.id)){this.ensureClaim(g.id,amount);continue}
      const at=Number.isFinite(+g.createdAtMs)?+g.createdAtMs:Date.now();
      if(all&&at<(+state.grantCutoff||0))continue;
      const reserved=await this.reserve(g.id,amount);
      if(!reserved)continue;
      state.cash=Math.max(0,Math.round((+state.cash||0)+amount));
      state.grants=[...(state.grants||[]),{id:g.id,amount,title:String(g.title||''),message:String(g.message||''),at,acked:false}].slice(-200);
      changed=true;
    }
    if(changed){
      await Store.saveMe(userId,state);
      Store.pushMyScore(true);
      if(!selected&&!document.querySelector('.overlay'))render();
    }
    this.flush();
  },
  async reserve(id,amount){
    if(!Store.online||!Store.db||!Store.uid)return;
    try{
      const ref=Store.db.collection('grants').doc(id).collection('claims').doc(Store.uid);
      return await Store.db.runTransaction(async tx=>{
        const snap=await tx.get(ref);
        if(snap.exists)return false;
        tx.set(ref,{uid:Store.uid,nickname:state?.nickname||'',amount,claimedAt:firebase.firestore.FieldValue.serverTimestamp()});
        return true;
      });
    }catch(error){console.warn('지급 중복 확인 실패',error?.code||error?.message);return false}
  },
  async ensureClaim(id,amount){
    if(!Store.online||!Store.db||!Store.uid)return;
    try{
      const ref=Store.db.collection('grants').doc(id).collection('claims').doc(Store.uid);
      await Store.db.runTransaction(async tx=>{
        const snap=await tx.get(ref);
        if(!snap.exists)tx.set(ref,{uid:Store.uid,nickname:state?.nickname||'',amount,claimedAt:firebase.firestore.FieldValue.serverTimestamp()});
      });
    }catch(error){console.warn('기존 지급 기록 확인 실패',error?.code||error?.message)}
  },
  async flush(){
    if(this.showing||!state)return;
    const pending=(state.grants||[]).filter(g=>!g.acked);
    if(!pending.length)return;
    if(document.querySelector('.overlay')){setTimeout(()=>this.flush(),1500);return}
    this.showing=true;
    for(const g of pending){
      await grantPopup(g);
      g.acked=true;
      await Store.saveMe(userId,state);
    }
    this.showing=false;
    if(!selected&&!document.querySelector('.overlay'))render();
  }
};
(function waitGrantReady(){
  if(state&&Store.online&&Store.db&&Store.uid){GrantWatch.start();return}
  setTimeout(waitGrantReady,700);
})();


/* ============ 시장 엔진 V11 — Activity·거래량·급등락 후속경로 (2026-08-26) ============
   패치 목표
   1) 화면가/체결가/평가가 단일화  2) 초단기 노이즈 축소  3) 등급별 고정 변동성 의존 최소화

   7) 상승/횡보/하락 국면  8) 이동형 중심가격  9) 급락 후 침체·횡보

const MARKET_V9_SPEED=15; // 게임 진행속도 상향: 기존 12 → 15

function v9Unit(...xs){return rnd(hash('v9',...xs))()}

function v9Regime(s,day,minute){
  // 장기 국면은 종목마다 55~110틱 유지. 종목 등급보다 현재 국면의 영향이 더 크다.

}
function v9Momentum(s,day,minute){
  // 10~20틱 관성. 방향은 매 블록 독립 결정하며 반대 움직임도 충분히 허용한다.
  const probe=10+Math.floor(v9Unit(s.code,day,Math.floor(minute/10),'mom-len')*11),block=Math.floor(minute/probe),u=v9Unit(s.code,day,block,'mom');

}
function v9Volatility(s,day,minute){
  // 저/보통/고변동 국면이 지속된다. tier 차이는 8% 이내의 약한 성향만 남긴다.
  const block=Math.floor(minute/35),u=v9Unit(s.code,day,block,'vol'),state=u<.30?.62:u<.82?1:1.55;
  const weakTier={blue:.96,growth:1,theme:1.04,junk:1.08}[s.tier]||1;
  const personality=.88+v9Unit(s.code,'personality')*.24;
  return state*weakTier*personality;
}
function v11Activity(s,day,minute){
  // 숨은 활동성: 화면에는 표시하지 않는다. 18~52틱(약 9~26분) 동안 한 상태가 이어진다.
  const seedBlock=Math.floor(minute/35),len=18+Math.floor(v9Unit(s.code,day,seedBlock,'act-len')*35),block=Math.floor(minute/len),u=v9Unit(s.code,day,block,'activity');
  const tierBias={blue:-.035,growth:0,theme:.025,junk:.045}[s.tier]||0; // 성격은 확률에만 약하게 영향
  const x=Math.max(0,Math.min(.999,u+tierBias));

}
function v11ExtremeDrive(s,day,minute){
  // 별도 '주도주' 선정은 하지 않는다. Regime/Momentum/Activity가 겹친 경우에만 희귀 가속이 붙는다.
  const act=v11Activity(s,day,minute),reg=v9Regime(s,day,minute),mom=v9Momentum(s,day,minute);
  if(act.name!=='hot'||!mom)return 0;
  const aligned=(reg.bias>0&&mom>0)||(reg.bias<0&&mom<0);if(!aligned)return 0;
  const tierChance={blue:.055,growth:.09,theme:.14,junk:.19}[s.tier]||.08;
  const block=Math.floor(minute/12),u=v9Unit(s.code,day,block,'extreme');if(u>tierChance)return 0;

function v11PostMove(s,day,minute,changeRate){
  // 급등/급락 뒤 경로는 화면에 표시하지 않는 내부 상태다.
  const abs=Math.abs(changeRate);if(abs<.14)return 0;
  const block=Math.floor(minute/18),u=v9Unit(s.code,day,block,'post-path'),dir=Math.sign(changeRate);
  if(dir>0){
    // 급등: 추가상승 / 큰 조정 후 재상승 / 상승종료. +25% 이상일수록 조정 가능성 증가.
    const heat=Math.min(1,(abs-.14)/.45),phase=minute%18;
    if(u<.30-heat*.06)return .00075; // 추가상승
    if(u<.68){return phase<8?-(.00135+heat*.00115):(.00065+heat*.00045)} // 큰 조정 뒤 재상승
    return -(.00055+heat*.00115); // 상승 종료
  }
  // 급락: 반등 / 횡보 / 추가하락. 기본 30/40/30, 기존 하락추세면 추가하락 확률을 높인다.
  const reg=v9Regime(s,day,minute),downTrend=reg.bias<0?.10:0,upTrend=reg.bias>0?.08:0;
  const rebound=.30+upTrend-downTrend*.35,side=.40,fall=1-rebound-side;
  if(u<rebound)return .00085;

}
function v9SectorImpulse(s,day,minute){
  const block=Math.floor(minute/24);return v9Normal(s.sector,day,block,'sector')*.000045;
}
function v9MarketImpulse(day,minute){
  // 코스피(=전종목 가중평균)에서 유일하게 살아남는 "공통 성분"이 이 함수다.
  // 종목별 idiosyncratic noise는 100여 종목 평균을 내면서 서로 상쇄되지만,
  // 이 시장 공통 충격만은 전 종목에 같은 방향으로 실려서 지수에 그대로 드러난다.
  // 그래서 "코스피가 2900~3000대에서만 머무른다"는 체감을 줄이려면 개별 종목
  // 변동성보다 이 값을 살짝 키우는 쪽이 종목 체감은 거의 안 건드리면서 지수만 더 움직이게 하는 방법이다.
  // (기존 .000035 → .00006, 약 1.7배. 종목 하나에 대한 기여도는 여전히 미미함)
  const block=Math.floor(minute/30);return v9Normal(day,block,'market')*.00006;
}
function v9Shock(s,day,minute){
  // 희귀 단발 이벤트. 우량주는 대형 이벤트 확률이 낮지만 0은 아니다.
  if(minute%24!==0)return {ret:0,slump:false};
  const block=Math.floor(minute/24),r=rnd(hash('v11-shock',s.code,day,block));
  const chance={blue:.010,growth:.015,theme:.022,junk:.030}[s.tier]||.015;
  if(r()>chance)return {ret:0,slump:false};
  const down=r()<.51,rare=r(),mag=rare<.82?.018+r()*.035:rare<.97?.055+r()*.065:.12+r()*.10;

}
function v9DayOpen(s,day){
  const key=s.code+'|'+day;if(v9OpenCache.has(key))return v9OpenCache.get(key);
  // 장기 중심가격: 상승/횡보/하락 일자가 모두 존재. 과거 기준점과의 연결을 위해 최대 365일만 재생한다.
  let p=s.base,start=Math.max(0,day-365);
  for(let d=start;d<day;d++){
    const sector=v9Normal(s.sector,d,'daily-sector')*.0032,market=v9Normal(d,'daily-market')*.0024,idio=v9Normal(s.code,d,'daily-idio')*.0048;
    const cycle=v9Unit(s.code,Math.floor(d/6),'daily-cycle');
    const trend=cycle<.18?-.0022:cycle<.38?-.0007:cycle<.67?0:cycle<.90?.0008:.0020;
    let ret=trend+market*.35+sector*.30+idio*.35;
    // 드문 악재는 중심가격을 영구적으로 한 단계 낮춘다. 자동 복구 보정은 하지 않는다.

}
function v9RawPriceAt(s,t=marketTick()){
  const key=s.code+':'+t;if(v9PriceCache.has(key))return v9PriceCache.get(key);
  const day=Math.floor(t/390),minute=((t%390)+390)%390,open=v9DayOpen(s,day);let p=open,slumpUntil=-1,center=open;
  for(let i=0;i<=minute;i++){

}

  // V59 테스트 ETF: 별도 랜덤/뉴스/업종 효과 없이 게임 속 삼성전자 가격만 ±2배 추종
  {...etfDef('SAMS2L','삼성전자 레버리지 2X',20000,'레버리지',[['005930',1]]), linkedCode:'005930', leverage:2},
  {...etfDef('SAMS2I','삼성전자 인버스 2X',20000,'레버리지',[['005930',1]]), linkedCode:'005930', leverage:-2}
];
for(const e of ETF_STOCKS)if(!STOCKS.some(s=>s.code===e.code))STOCKS.push(e);

function etfNormalizedComponents(s){
  const available=(s.components||[]).map(([code,w])=>[STOCKS.find(x=>x.code===code&&!x.isETF),w]).filter(([x,w])=>x&&w>0);
  const target=Math.max(0,1-(s.bondWeight||0)),sum=available.reduce((a,[,w])=>a+w,0)||1;
  return available.map(([x,w])=>[x,w/sum*target]);
}
function etfBondRatio(s,t){
  const dd=(t-ETF_REFERENCE_TICK)/390;
  // 채권 50% 부분: 연환산 몇 % 수준의 완만한 흐름 + 아주 작은 결정론적 흔들림.
  const drift=dd*.000085, wave=Math.sin((t-ETF_REFERENCE_TICK)/52+hash('bond',s.code)%31)*.00065;
  const anchorWave=Math.sin(hash('bond',s.code)%31)*.00065;
  return Math.exp(drift+wave-anchorWave);
}
const v10StockDisplayedAt=v9DisplayedAt,v10StockCanonicalPriceAtMs=v9CanonicalPriceAtMs;
function etfRatioAtTick(s,t){
  // V59 삼성전자 2X 테스트 ETF는 오직 삼성전자 시장가 변화만 사용한다.
  // 기준시점 대비 삼성전자 수익률 × (+2 / -2)를 ETF 기준가 20,000원에 그대로 반영한다.
  if(s?.linkedCode&&Number.isFinite(+s.leverage)){
    const u=STOCKS.find(x=>x.code===s.linkedCode&&!x.isETF);
    if(u){
      const a=Math.max(1,v10StockDisplayedAt(u,ETF_REFERENCE_TICK).price),b=Math.max(1,v10StockDisplayedAt(u,t).price);
      return Math.max(.05,1+(b/a-1)*(+s.leverage));
    }
  }
  let ratio=0;
  for(const [u,w] of etfNormalizedComponents(s)){
    const a=Math.max(1,v10StockDisplayedAt(u,ETF_REFERENCE_TICK).price),b=Math.max(1,v10StockDisplayedAt(u,t).price);
    ratio+=w*(b/a);
  }
  if(s.bondWeight)ratio+=s.bondWeight*etfBondRatio(s,t);
  return Math.max(.05,ratio||1);
}
function etfDisplayedAt(s,t=marketTick()){
  const day=Math.floor(t/390),minute=((t%390)+390)%390,dayTick=day*390;
  const price=Math.max(10,Math.round(s.base*etfRatioAtTick(s,t)/5)*5),open=Math.max(10,Math.round(s.base*etfRatioAtTick(s,dayTick)/5)*5);
  return {price,open,day,minute};
}
function etfCanonicalPriceAtMs(s,ms=Date.now()){
  const gms=acceleratedMs(ms),d=new Date(gms),start=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),f=(gms-start)/DAY_MS*DAY_STEPS,t=marketTickAt(gms),a=etfDisplayedAt(s,t),b=etfDisplayedAt(s,t+1),phase=f-Math.floor(f),x=phase*phase*(3-2*phase);
  return Math.max(10,Math.round((a.price+(b.price-a.price)*x)/5)*5);
}

// ETF는 자체 랜덤가격을 만들지 않고 게임 속 편입주식의 움직임을 NAV처럼 합성한다.

quote=function(s){

const v10StockSeries=series,v10StockLongChartSeries=longChartSeries;
// ETF 일봉 차트는 구성주식으로 계산된 시가/현재가를 양 끝점으로 고정하고 결정론적 브리지로 연결한다.
// 매 프레임마다 모든 편입종목의 과거 120틱을 다시 재생하지 않아 모바일에서도 즉시 열린다.
series=function(s,count=120){
  if(!s?.isETF)return v10StockSeries(s,count);
  const q=quote(s),used=Math.max(2,Math.min(count,Math.floor(q.minute/390*(count-1))+1)),r=rnd(hash('etf-day-series',s.code,q.day)),walk=[0];
  for(let i=1;i<used;i++)walk.push(walk[i-1]+normal(r));
  const end=walk[used-1],logMove=Math.log(Math.max(1,q.price)/Math.max(1,q.open)),out=[];
  for(let i=0;i<used;i++){const u=i/Math.max(1,used-1),bridge=(walk[i]-end*u)*.00055*Math.sin(Math.PI*u),v=q.open*Math.exp(logMove*u+bridge);out.push(Math.max(10,Math.round(v/5)*5))}
  out[0]=q.open;out[out.length-1]=q.price;return out;
};
longChartSeries=function(s,range){
  if(!s?.isETF)return v10StockLongChartSeries(s,range);
  const cfg=CHART_RANGES[range]||CHART_RANGES.week,comps=etfNormalizedComponents(s),sets=comps.map(([u,w])=>[v10StockLongChartSeries(u,range),w]),n=cfg.count,current=quote(s).price,out=[];
  for(let i=0;i<n;i++){
    let ratio=0;
    for(const [a,w] of sets){const last=Math.max(1,a[a.length-1]);ratio+=w*(a[Math.min(i,a.length-1)]/last)}
    if(s.bondWeight){const u=i/Math.max(1,n-1);ratio+=s.bondWeight*Math.exp((u-1)*.000085*(cfg.days||7))}
    out.push(Math.max(10,Math.round(current*Math.max(.05,ratio)/5)*5));
  }
  out[out.length-1]=current;return out;
};

function effectiveMarketRealMs(ms=Date.now()){
  const d=new Date(ms),mins=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;

v9Momentum=function(s,day,minute){

  const reg=v9Regime(s,day,minute),act=v11Activity(s,day,minute),aligned=(reg.bias>0&&m>0)||(reg.bias<0&&m<0);

  }

};

// 2) 섹터 활동성 순환: 정답 표시는 없고, 일정 시간 특정 업종이 조금 더 활발해질 확률만 높인다.

  const a=v12ActivityBase(s,day,minute);if(s?.isETF)return a;
  const sectors=[...new Set(STOCKS.filter(x=>!x.isETF).map(x=>x.sector))];
  const rotBlock=Math.floor(minute/42),hot=sectors[hash('v12-sector-rotation',day,rotBlock)%Math.max(1,sectors.length)];
  if(s.sector!==hot)return a;
  const boost=(a.name==='quiet'?1.12:a.name==='normal'?1.28:1.18);
  return {...a,mult:a.mult*boost,flow:a.flow*(1+(boost-1)*1.35)};
};

// 3) 30초 메인 틱 사이 2초 안팎의 미세 실시간 움직임. 표시/체결/평가가 모두 같은 가격을 사용한다.
function v12MicroFactor(s,ms){
  if(!marketSessionInfo(ms).open||s?.isETF)return 1;
  const t=sessionTick(ms),day=Math.floor(t/390),minute=((t%390)+390)%390,act=v11Activity(s,day,minute),reg=v9Regime(s,day,minute),mom=v9Momentum(s,day,minute);

  const ampBase={blue:.00022,growth:.00028,theme:.00034,junk:.00042}[s.tier]||.00028;
  const amp=ampBase*Math.min(1.55,.70+act.mult*.18);
  const n0=v9Normal('micro',s.code,slot),n1=v9Normal('micro',s.code,slot+1),noise=(n0+(n1-n0)*x)*amp;

/* ============ V13 — 긴장감·잭팟 튜닝 + 거래량 NaN 수정 ============ */
// 목표: 대부분 종목은 읽을 수 있는 흐름을 유지하되, 짧은 플레이에서도 일부 종목은 강하게 치고 나가도록 한다.
// Activity/과열 여부는 UI에 노출하지 않으며 ETF는 잭팟 가속에서 제외한다.

const v13ActivityBase=v11Activity;
v11Activity=function(s,day,minute){
  const a=v13ActivityBase(s,day,minute); if(s?.isETF) return a;
  // 전체 체감 활동성을 소폭 상향. 조용한 종목도 완전히 죽지 않게 하되 hot을 남발하지 않는다.
  const bump={quiet:1.18,normal:1.24,active:1.34,hot:1.48}[a?.name]||1.2;
  const flowBump={quiet:1.10,normal:1.18,active:1.30,hot:1.42}[a?.name]||1.15;
  return {name:a?.name||'normal',mult:Math.max(.48,(Number(a?.mult)||1)*bump),flow:Math.max(.60,(Number(a?.flow)||1)*flowBump)};
};

// 강한 조건이 겹친 종목의 가속. 우량주도 매우 드물게 잭팟이 가능하지만 테마/고위험보다 빈도는 낮다.
v11ExtremeDrive=function(s,day,minute){
  if(s?.isETF)return 0;
  const act=v11Activity(s,day,minute),reg=v9Regime(s,day,minute),mom=v9Momentum(s,day,minute);
  if(!mom || (act.name!=='active'&&act.name!=='hot'))return 0;
  const aligned=(reg.bias>0&&mom>0)||(reg.bias<0&&mom<0); if(!aligned)return 0;
  const block=Math.floor(minute/9),u=v9Unit(s.code,day,block,'v13-burst');
  const chance={blue:.075,growth:.115,theme:.165,junk:.215}[s.tier]||.10;
  if(u>chance)return 0;
  // active는 짧은 가속, hot은 강한 가속. blue도 조건이 겹치면 상단이 열린다.
  const hot=act.name==='hot',mag=(hot ? .00135 : .00075)+v9Unit(s.code,day,block,'v13-burst-mag')*(hot ? .00245 : .00125);
  return Math.sign(mom)*mag;
};

// 희귀 단발 급등락을 조금 더 자주 체감하도록 조정. 우량주는 낮은 확률을 유지하되 0이 아니다.
v9Shock=function(s,day,minute){
  if(s?.isETF || minute%18!==0)return {ret:0,slump:false};
  const block=Math.floor(minute/18),r=rnd(hash('v13-shock',s.code,day,block));
  const chance={blue:.014,growth:.021,theme:.031,junk:.041}[s.tier]||.02;
  if(r()>chance)return {ret:0,slump:false};
  const down=r()<.51,rare=r();
  const mag=rare<.72?.020+r()*.040:rare<.94?.060+r()*.080:.14+r()*.16;

/* ============ V16 FIX — 짧은 플레이 활발성 실제 반영 (2026-08-26) ============
   - Activity 지속시간 3~10분으로 단축

   - 최대 +120% / -90% 안전장치 적용

const v16ActivityPrevious=v11Activity;
v11Activity=function(s,day,minute){
  if(s?.isETF)return v16ActivityPrevious(s,day,minute);
  // 1틱≈29.5초. 한 활동성 상태가 6~20틱(약 3~10분) 지속된다.
  const seed=Math.floor(minute/12),len=6+Math.floor(v9Unit(s.code,day,seed,'v16-act-len')*15),block=Math.floor(minute/len);
  const u=v9Unit(s.code,day,block,'v16-activity');
  // tier는 결과를 정하지 않고 활발 상태 확률에만 약하게 영향.
  const tierBias={blue:-.025,growth:0,theme:.020,junk:.035}[s.tier]||0;
  const x=Math.max(0,Math.min(.999,u+tierBias));
  let a;
  if(x<.23)a={name:'quiet',mult:.54,flow:.68};
  else if(x<.63)a={name:'normal',mult:1.18,flow:1.16};
  else if(x<.90)a={name:'active',mult:2.55,flow:2.65};
  else a={name:'hot',mult:4.35,flow:4.70};
  // V12 섹터 순환 효과는 유지하되 정답이 되지 않도록 약하게만 추가한다.
  const sectors=[...new Set(STOCKS.filter(z=>!z.isETF).map(z=>z.sector))];
  const rotBlock=Math.floor(minute/36),hotSector=sectors[hash('v16-sector-rotation',day,rotBlock)%Math.max(1,sectors.length)];
  if(s.sector===hotSector){const b=a.name==='quiet'?1.08:a.name==='normal'?1.18:1.12;a={...a,mult:a.mult*b,flow:a.flow*(1+(b-1)*1.25)}}

};

// 2~5분간 이어지는 숨은 변동성 폭발. 별도 '주도주'를 선정하지 않고

function v16BurstDrive(s,day,minute){
  if(s?.isETF)return 0;
  const act=v11Activity(s,day,minute),reg=v9Regime(s,day,minute),mom=v9Momentum(s,day,minute);
  if(act.name!=='active'&&act.name!=='hot')return 0;

  const block=Math.floor(minute/blockLen),r=rnd(hash('v16-burst',s.code,day,block));
  const baseChance={blue:.055,growth:.085,theme:.120,junk:.155}[s.tier]||.08;
  const align=(mom&&((reg.bias>0&&mom>0)||(reg.bias<0&&mom<0)))?1.35:1;
  const hot=act.name==='hot'?1.30:1;
  if(r()>Math.min(.28,baseChance*align*hot))return 0;
  // 방향은 추세가 강하면 그쪽 확률이 높지만 반전 burst도 가능하다.
  let dir;
  const d=r();
  if(mom&&d<.68)dir=Math.sign(mom); else if(reg.bias&&d<.84)dir=Math.sign(reg.bias); else dir=r()<.5?-1:1;

}

function v18RumorEvent(day,minute,index=0){

/* ============ V19 — 급하락 꼬리 보강 / 상승·하락 체감 균형 ============
   - V18의 상승 도파민은 유지
   - -14% 이하 급락 종목에도 상승측과 비슷한 수준의 후속 경로를 부여
   - 추가하락 / 급반등 후 재하락 / 하락종료(반등) 모두 가능
   - ETF 제외, +120% / -90% 최종 안전장치 적용
*/
const v19PostBase=v11PostMove;
v11PostMove=function(s,day,minute,changeRate){
  if(s?.isETF || changeRate>-.14)return v19PostBase(s,day,minute,changeRate);
  const abs=Math.abs(changeRate),heat=Math.min(1,(abs-.14)/.48),block=Math.floor(minute/20),u=v9Unit(s.code,day,block,'v19-down-path'),phase=minute%20;

  // ① 추가하락: 약 35~39%. 이미 많이 빠졌을수록 아주 소폭 낮춰 폭주를 방지한다.
  const continueFall=.39-heat*.04;
  if(u<continueFall)return -(.00108+heat*.00034);

  // ② 급반등 후 재하락: 낙폭과대 반등이 나와도 추세가 끝났다고 보장하지 않는다.
  if(u<.75){
    return phase<9
      ? (.00162+heat*.00118)
      : -(.00094+heat*.00062);
  }

  // ③ 하락 종료/회복: 강한 반등이 나올 수 있어 급락주 매수가 필승이 되지도, 항상 더 빠지지도 않는다.
  return .00072+heat*.00092;
};

// 하락 방향의 중형 가속이 상승보다 지나치게 적게 누적되는 경우를 완만하게 보정한다.
// '하락 종목 선정'은 하지 않고, 이미 하락 Regime/Momentum이 정렬된 경우에만 낮은 확률로 보너스가 붙는다.
const v19ExtremeBase=v11ExtremeDrive;
v11ExtremeDrive=function(s,day,minute){
  let base=Number(v19ExtremeBase(s,day,minute))||0;
  if(s?.isETF)return base;
  const reg=v9Regime(s,day,minute),mom=v9Momentum(s,day,minute),act=v11Activity(s,day,minute);
  if(!(reg.bias<0&&mom<0) || (act.name!=='active'&&act.name!=='hot'))return base;
  const block=Math.floor(minute/7),u=v9Unit(s.code,day,block,'v19-down-boost');
  const chance={blue:.018,growth:.028,theme:.042,junk:.055}[s.tier]||.025;
  if(u>=chance)return base;
  const mag=(act.name==='hot'?.00052:.00030)+v9Unit(s.code,day,block,'v19-down-boost-mag')*(act.name==='hot'?.00082:.00048);
  return Math.max(-.0085,Math.min(.0085,base-mag));
};

/* ============ V20 — 급락주 저점매수 반복수익 악용 방지 ============
   문제: -25~-30% 부근에서 기존 post-move가 반등 쪽으로 기울어
   '급하락 탭 최하위 매수 → 몇 % 회복 시 매도' 반복 전략의 기대값이 지나치게 높아질 수 있었다.

   원칙
   1) 특정 낙폭(-28%, -30% 등)을 반등 신호로 사용하지 않는다.
   2) 깊게 빠진 종목은 추가하락 / 저점횡보 / 반등이 모두 가능하다.
   3) -20~-35% 구간의 평균 후속 바이어스는 중립~약한 하락으로 두어 무한 저점줍기를 차단한다.
   4) 반등형도 고정된 9틱 반등 같은 읽히는 phase 패턴을 없앤다.
   5) ETF는 기존 구성종목 연동 구조를 유지한다.
*/
const v20PostBase=v11PostMove;
v11PostMove=function(s,day,minute,changeRate){
  if(s?.isETF || changeRate>-.12)return v20PostBase(s,day,minute,changeRate);

  const abs=Math.abs(changeRate);
  const severity=Math.max(0,Math.min(1,(abs-.12)/.48));
  // 6~11틱(약 3~5.5분)마다 숨은 후속 상태를 다시 정한다.
  // 낙폭이 깊을수록 '무조건 반등'이 아니라 추가하락 확률이 소폭 높아진다.
  const len=6+Math.floor(v9Unit(s.code,day,Math.floor(minute/8),'v20-dd-len')*6);
  const block=Math.floor(minute/len);
  const u=v9Unit(s.code,day,block,'v20-dd-path');
  const reg=v9Regime(s,day,minute),mom=v9Momentum(s,day,minute);
  const alignedDown=(reg.bias<0&&mom<0), alignedUp=(reg.bias>0&&mom>0);

  let pFall=.41 + severity*.06 + (alignedDown?.07:0) - (alignedUp?.05:0);
  let pRebound=.31 - severity*.035 + (alignedUp?.055:0) - (alignedDown?.035:0);
  pFall=Math.max(.34,Math.min(.57,pFall));
  pRebound=Math.max(.20,Math.min(.40,pRebound));
  const pSide=Math.max(.16,1-pFall-pRebound);

  // ① 추가하락: falling knife 위험. 심한 낙폭에서도 바닥을 보장하지 않는다.
  if(u<pFall){
    const pulse=.00078+severity*.00054;
    const jitter=v9Normal('v20-fall-jitter',s.code,day,minute)*.00022;
    return Math.max(-.00225,Math.min(-.00038,-pulse+jitter));
  }

  // ② 저점 횡보: 작은 양·음 움직임을 섞어 '-28%면 곧 -21%' 같은 회귀 패턴 제거.
  if(u<pFall+pSide){
    const n=v9Normal('v20-side-jitter',s.code,day,minute)*(.00024+severity*.00008);
    const drag=alignedDown?-.00012:alignedUp?.00008:-.00003;
    return Math.max(-.00055,Math.min(.00048,n+drag));
  }

  // ③ 반등: 실제 반등은 가능하되 매 틱 같은 방향으로 보장하지 않는다.
  // 짧은 pullback을 섞어 진입 직후 자동수익 패턴을 없앤다.
  const reboundNoise=v9Normal('v20-rebound-jitter',s.code,day,minute)*.00030;
  const reboundBase=.00058+severity*.00028;
  const pullback=v9Unit(s.code,day,minute,'v20-rebound-pullback')<(.28+severity*.08);
  const out=pullback?-(.00030+severity*.00022):reboundBase+reboundNoise;
  return Math.max(-.00085,Math.min(.00132,out));
};

// V19의 하락 boost를 그대로 사용하며 최종 -90% 안전장치는 폭주 방지용으로만 유지된다.

/* ============ V22 — 급락주 V자 단기수익 강력 억제 ============
   목적: 발견 > 급하락 탭에서 -20~-35% 부근을 매수한 뒤 짧은 시간 내
   -29% -> -21%처럼 되돌림만 먹는 반복 전략의 기대값을 크게 낮춘다.

   원칙
   1) -18% 이하 급락 종목은 '즉시 강반등'을 희귀 경로로 제한한다.
   2) 대부분은 저점 횡보 또는 추가하락으로 머물며, 낙폭이 깊다고 반등확률이 커지지 않는다.
   3) 상승 Regime이 겹쳐도 반등확률 상한을 제한해 숫자만 보고 바닥을 읽지 못하게 한다.
   4) 반등 경로조차 작은 되밀림을 자주 섞어 단기 V자 수익을 보장하지 않는다.
   5) ETF는 제외한다.
*/
const v22PostBase=v11PostMove;
v11PostMove=function(s,day,minute,changeRate){
  if(s?.isETF || changeRate>-.18)return v22PostBase(s,day,minute,changeRate);

  const abs=Math.abs(changeRate);
  const severity=Math.max(0,Math.min(1,(abs-.18)/.55));
  const reg=v9Regime(s,day,minute),mom=v9Momentum(s,day,minute);
  const alignedDown=(reg.bias<0&&mom<0),alignedUp=(reg.bias>0&&mom>0);

  // 4~8분가량 같은 후속 성격을 유지하되, 구간 경계 자체는 종목마다 달라진다.
  const len=8+Math.floor(v9Unit(s.code,day,Math.floor(minute/9),'v22-len')*9);
  const block=Math.floor(minute/len),u=v9Unit(s.code,day,block,'v22-path');

  // 깊은 낙폭일수록 '반등'이 아니라 횡보/추가하락 비중이 높아진다.
  let pRebound=.075 - severity*.025 + (alignedUp?.035:0) - (alignedDown?.020:0);
  pRebound=Math.max(.035,Math.min(.115,pRebound));
  let pFall=.46 + severity*.075 + (alignedDown?.055:0) - (alignedUp?.025:0);
  pFall=Math.max(.42,Math.min(.60,pFall));
  const pSide=Math.max(.28,1-pFall-pRebound);

  // ① 추가하락: 떨어지는 칼날. 단, 매 틱 직선 하락이 되지 않도록 잡음을 섞는다.
  if(u<pFall){
    const jitter=v9Normal('v22-fall',s.code,day,minute)*(.00020+severity*.00005);
    const base=-(.00078+severity*.00048+(alignedDown?.00016:0));
    return Math.max(-.00220,Math.min(-.00022,base+jitter));
  }

  // ② 저점 횡보: 가장 흔한 경로. 위아래 흔들리지만 평균은 거의 0~약한 하락.
  if(u<pFall+pSide){
    const n=v9Normal('v22-side',s.code,day,minute)*(.00027+severity*.00006);
    const drag=alignedDown?-.00010:alignedUp?.000035:-.000035;
    return Math.max(-.00062,Math.min(.00042,n+drag));
  }

  // ③ 반등: 매우 희귀. 반등이 골라도 절반 가까이는 되밀림이 섞이고 강도도 제한한다.
  const pullbackChance=.44+severity*.10;
  const pullback=v9Unit(s.code,day,minute,'v22-rebound-pullback')<pullbackChance;
  if(pullback)return -(.00020+severity*.00024)+v9Normal('v22-rpb',s.code,day,minute)*.00014;
  const rebound=.00034+severity*.00018+v9Normal('v22-rup',s.code,day,minute)*.00018;
  return Math.max(-.00030,Math.min(.00076,rebound));
};

*/
const V23_STOCK_BY_CODE=new Map(STOCKS.map(s=>[s.code,s]));
const V23_NON_ETF_STOCKS=STOCKS.filter(s=>!s.isETF);
const V23_SECTORS=[...new Set(V23_NON_ETF_STOCKS.map(s=>s.sector))];

// V16과 결과가 동일하되 sectors를 매 호출마다 다시 만들지 않는다.
v11Activity=function(s,day,minute){
  if(s?.isETF)return v16ActivityPrevious(s,day,minute);
  const seed=Math.floor(minute/12),len=6+Math.floor(v9Unit(s.code,day,seed,'v16-act-len')*15),block=Math.floor(minute/len);
  const u=v9Unit(s.code,day,block,'v16-activity');
  const tierBias={blue:-.025,growth:0,theme:.020,junk:.035}[s.tier]||0;
  const x=Math.max(0,Math.min(.999,u+tierBias));
  let a;
  if(x<.23)a={name:'quiet',mult:.54,flow:.68};
  else if(x<.63)a={name:'normal',mult:1.18,flow:1.16};
  else if(x<.90)a={name:'active',mult:2.55,flow:2.65};
  else a={name:'hot',mult:4.35,flow:4.70};
  const rotBlock=Math.floor(minute/36),hotSector=V23_SECTORS[hash('v16-sector-rotation',day,rotBlock)%Math.max(1,V23_SECTORS.length)];
  if(s.sector===hotSector){const b=a.name==='quiet'?1.08:a.name==='normal'?1.18:1.12;a={...a,mult:a.mult*b,flow:a.flow*(1+(b-1)*1.25)}}
  return a;
};

// V18 찌라시 생성 결과는 그대로 두고 정적 배열만 재사용한다.
v18RumorEvent=function(day,minute,index=0){
  const block=Math.floor(minute/12),r=rnd(hash('v18-rumor',day,block,index));
  const targetStock=r()<.34?V23_NON_ETF_STOCKS[Math.floor(r()*V23_NON_ETF_STOCKS.length)]:null;
  const sector=targetStock?targetStock.sector:V23_SECTORS[Math.floor(r()*V23_SECTORS.length)];
  const sentiment=r()<.51?1:-1,behaviorRoll=r();
  const behavior=behaviorRoll<.35?'real':behaviorRoll<.60?'priced':behaviorRoll<.80?'noise':behaviorRoll<.95?'rumor':'reverse';
  const posActions=['대형 수주 기대','실적 개선 기대','외국인 매수 유입설','신규 공급계약 가능성','정책 수혜 기대','증설 검토설','목표가 상향 움직임','업황 회복 기대'];
  const negActions=['수익성 둔화 우려','외국인 매도 확대설','원가 부담 우려','수요 둔화 전망','차익실현 매물 경계','규제 부담 가능성','실적 눈높이 하향','공급 과잉 우려'];
  const endings=['시장 관심이 커지고 있다는 얘기','장중 수급이 엇갈린다는 관측','이미 가격에 일부 반영됐다는 시각도 공존','확인되지 않은 이야기라 변동성에 유의','재료 해석을 두고 의견이 갈리는 분위기','단기 매매세가 붙을 수 있다는 관측'];
  const targetName=targetStock?targetStock.name:`${sector} 업종`,actions=sentiment>0?posActions:negActions;
  const action=actions[Math.floor(r()*actions.length)],text=`${targetName}, ${action}… ${endings[Math.floor(r()*endings.length)]}`;
  return {day,block,index,targetCode:targetStock?.code||'',sector,sentiment,behavior,text};
};

/* ============ V24 — 급하락 추세 지속력 보강 ============
   목적: 상승측은 그대로 유지하고, 이미 형성된 강한 하락이 중간에서 너무 빨리
   횡보로 죽는 현상만 완화한다. 틱당 낙폭을 무작정 키우지 않고 '지속시간'을 늘린다.

   원칙
   1) -16% 이하 개별주부터 하락 tail 로직을 적용한다. 특정 -30% 선은 의미가 없다.
   2) -24% 이하에서는 추가하락 상태가 더 오래 유지될 수 있다.
   3) 즉시 강한 V자 반등은 V22보다 더 희귀하게 유지한다.
   4) 하락 중 작은 반등은 허용하지만, 강한 하락 Regime/Momentum이면 다시 밀릴 수 있다.
   5) ETF와 상승측 로직은 건드리지 않는다. +120% / -90% 최종 안전장치 유지.
*/
const v24PostBase=v11PostMove;
v11PostMove=function(s,day,minute,changeRate){
  if(s?.isETF || changeRate>-.16)return v24PostBase(s,day,minute,changeRate);

  const abs=Math.abs(changeRate);
  const severity=Math.max(0,Math.min(1,(abs-.16)/.58));
  const deep=Math.max(0,Math.min(1,(abs-.24)/.46));
  const reg=v9Regime(s,day,minute),mom=v9Momentum(s,day,minute),act=v11Activity(s,day,minute);
  const alignedDown=(reg.bias<0&&mom<0),alignedUp=(reg.bias>0&&mom>0);

  // 14~25틱(약 7~12.5분) 동안 숨은 하락 성격이 유지될 수 있게 해
  // 강한 하락이 3~5분 만에 횡보로 죽는 현상을 줄인다.
  const len=14+Math.floor(v9Unit(s.code,day,Math.floor(minute/11),'v24-tail-len')*12);
  const block=Math.floor(minute/len),u=v9Unit(s.code,day,block,'v24-tail-path');

  // 추가하락 비중을 늘리되 특정 낙폭 숫자에서 갑자기 바뀌지 않도록 연속적으로 조정.
  let pFall=.54 + severity*.07 + deep*.055 + (alignedDown?.055:0) - (alignedUp?.025:0);
  pFall=Math.max(.50,Math.min(.72,pFall));

  // V자 급반등은 매우 희귀. 상승 정렬이 되어도 상한을 낮게 둔다.
  let pRebound=.045 - severity*.014 - deep*.010 + (alignedUp?.018:0) - (alignedDown?.012:0);
  pRebound=Math.max(.015,Math.min(.060,pRebound));
  const pSide=Math.max(.22,1-pFall-pRebound);

  // ① 하락 지속: 틱당 힘은 과도하게 키우지 않고 음의 바이어스를 오래 유지.
  if(u<pFall){
    const jitter=v9Normal('v24-tail-fall',s.code,day,minute)*(.00019+severity*.00005);
    const activityBoost=(act?.name==='hot'?.00016:act?.name==='active'?.00009:0);
    const base=-(.00074+severity*.00042+deep*.00022+(alignedDown?.00017:0)+activityBoost);
    // 약한 양봉/되돌림은 드물게 허용해 직선 패턴을 피한다.
    const relief=v9Unit(s.code,day,minute,'v24-relief')<(.10-severity*.025);
    if(relief)return Math.max(-.00012,Math.min(.00038,.00016+v9Normal('v24-relief-n',s.code,day,minute)*.00013));
    return Math.max(-.00225,Math.min(-.00018,base+jitter));
  }

  // ② 저점 횡보: 완전 중립보다 약한 하방 기울기를 유지해 '바닥 확정' 신호를 없앤다.
  if(u<pFall+pSide){
    const n=v9Normal('v24-tail-side',s.code,day,minute)*(.00024+severity*.00005);
    const drag=-(.000035+deep*.000055+(alignedDown?.000065:0))+(alignedUp?.000025:0);
    return Math.max(-.00058,Math.min(.00036,n+drag));
  }

  // ③ 희귀 반등: 반등 상태에서도 되밀림 가능성이 높다.
  const pullback=v9Unit(s.code,day,minute,'v24-tail-rebound-pb')<(.58+severity*.08);
  if(pullback)return -(.00018+severity*.00020)+v9Normal('v24-tail-rpb',s.code,day,minute)*.00012;
  const rebound=.00030+severity*.00013+v9Normal('v24-tail-rup',s.code,day,minute)*.00015;
  return Math.max(-.00024,Math.min(.00062,rebound));
};

// 이미 하락 Regime + 하락 Momentum이 정렬된 '활발한' 종목만 낮은 확률로
// 지속력 보너스를 받는다. 새 하락 종목을 랜덤으로 만들어내지는 않는다.
const v24ExtremeBase=v11ExtremeDrive;
v11ExtremeDrive=function(s,day,minute){
  let base=Number(v24ExtremeBase(s,day,minute))||0;
  if(s?.isETF)return base;
  const reg=v9Regime(s,day,minute),mom=v9Momentum(s,day,minute),act=v11Activity(s,day,minute);
  if(!(reg.bias<0&&mom<0) || (act?.name!=='active'&&act?.name!=='hot'))return base;
  const block=Math.floor(minute/11),u=v9Unit(s.code,day,block,'v24-down-persist');
  const chance={blue:.026,growth:.040,theme:.055,junk:.070}[s.tier]||.035;
  if(u>=chance)return base;
  const mag=(act.name==='hot'?.00042:.00025)+v9Unit(s.code,day,block,'v24-down-persist-mag')*(act.name==='hot'?.00058:.00034);
  return Math.max(-.0085,Math.min(.0085,base-mag));
};

/* ============ V25 — 강한 추세 탄생 복구 + 임계값 패턴 흐리기 ============
   목적
   - V24의 하락 지속력 / V22의 급락 V자 단기수익 억제는 유지한다.
   - 조용한 장에서도 10~20분 안에 강한 상승·하락 후보가 자연스럽게 생길 기회를 복구한다.
   - +30% 추격 / -20% 회피처럼 특정 숫자를 외워 공략하는 고정 임계값은 제거한다.
   - 후보가 생겨도 실패·중형·강한 추세·극단 tail이 모두 가능하며 방향도 사전에 노출하지 않는다.
   - ETF 제외, +120% / -90% 최종 안전장치 유지.
*/

function v25TrendEvent(s,day,minute){
  if(s?.isETF)return {active:false,dir:0,quality:'none',drive:0,impulse:0,start:false};
  const act=v11Activity(s,day,minute);
  const seedBand=Math.floor(minute/10);
  const len=7+Math.floor(v9Unit(s.code,day,seedBand,'v25-birth-len')*7); // 약 3.5~6.5분
  const block=Math.floor(minute/len),r=rnd(hash('v25-birth',s.code,day,block));
  const tierChance={blue:.030,growth:.046,theme:.066,junk:.082}[s.tier]||.044;
  const activityMul=act.name==='hot'?1.65:act.name==='active'?1.34:act.name==='normal'?.72:.24;
  const chance=Math.min(.145,tierChance*activityMul);
  if(r()>chance)return {active:false,dir:0,quality:'none',drive:0,impulse:0,start:false};

  const reg=v9Regime(s,day,minute),mom=v9Momentum(s,day,minute);
  const alignedDir=mom?Math.sign(mom):(reg.bias?Math.sign(reg.bias):0);
  let dir;
  const d=r();
  if(alignedDir&&d<.57)dir=alignedDir;
  else if(reg.bias&&d<.72)dir=Math.sign(reg.bias);
  else dir=r()<.5?-1:1;

  const q=r();
  const quality=q<.34?'weak':q<.76?'medium':q<.96?'strong':'tail';
  const ranges={
    weak:[.00016,.00034,.012,.028],
    medium:[.00038,.00078,.027,.057],
    strong:[.00078,.00138,.055,.100],
    tail:[.00128,.00205,.090,.155]
  }[quality];
  const drive=ranges[0]+r()*(ranges[1]-ranges[0]);
  const impulse=ranges[2]+r()*(ranges[3]-ranges[2]);
  const start=(minute%len)===0;
  return {active:true,dir,quality,drive:dir*drive,impulse:dir*impulse,start};
}

// 기존 Burst/Extreme은 유지하면서 '강한 추세가 태어나는 빈도'만 복구한다.
// 후보 자체가 화면에 보이지 않고, 후보 중 상당수는 weak/medium에서 끝나므로 필승 신호가 없다.
const v25ExtremeBase=v11ExtremeDrive;
v11ExtremeDrive=function(s,day,minute){
  let base=Number(v25ExtremeBase(s,day,minute))||0;
  if(s?.isETF)return base;
  const ev=v25TrendEvent(s,day,minute);
  if(!ev.active)return base;
  const noise=v9Normal('v25-birth-drive-n',s.code,day,minute)*Math.abs(ev.drive)*.18;
  // 강한 이벤트도 기존 한 틱 안전범위 안에서만 더한다.
  return Math.max(-.0085,Math.min(.0085,base+ev.drive+noise));
};

// 이벤트 시작점에는 중형 impulse를 한 번만 허용해, 조용한 장에서도 눈에 띄는 종목이 탄생할 수 있게 한다.
// 방향은 대칭이며 down 이벤트는 기존 slump와 결합될 수 있다.
const v25ShockBase=v9Shock;
v9Shock=function(s,day,minute){
  const base=v25ShockBase(s,day,minute);
  if(s?.isETF || (base&&base.ret))return base;
  const ev=v25TrendEvent(s,day,minute);
  if(!ev.active||!ev.start)return base||{ret:0,slump:false};
  // tail impulse는 희귀하며 기존 +120/-90 최종 안전장치를 넘길 수 없다.
  return {ret:ev.impulse,slump:ev.dir<0&&ev.quality!=='weak'};
};

// 고정 +14%, -16/-18% 같은 숫자 경계를 최종 post-move 단계에서 사용하지 않는다.
// 종목/시간대마다 임계값이 달라지고, 그 임계값을 넘어도 결과가 하나로 고정되지 않는다.
v11PostMove=function(s,day,minute,changeRate){
  if(s?.isETF)return 0;

  const windowBlock=Math.floor(minute/28); // 약 14분마다 숨은 임계값 재구성
  const downTrigger=.13+v9Unit(s.code,day,windowBlock,'v25-down-trigger')*.12; // -13~-25%
  const upTrigger=.15+v9Unit(s.code,day,windowBlock,'v25-up-trigger')*.14;     // +15~+29%
  const reg=v9Regime(s,day,minute),mom=v9Momentum(s,day,minute),act=v11Activity(s,day,minute);
  const alignedDown=reg.bias<0&&mom<0,alignedUp=reg.bias>0&&mom>0;

  // 급락 후: V자 단기수익 억제 유지 + V24의 tail 지속성 유지.
  if(changeRate<=-downTrigger){
    const abs=Math.abs(changeRate),severity=Math.max(0,Math.min(1,(abs-downTrigger)/Math.max(.32,.68-downTrigger)));
    const len=9+Math.floor(v9Unit(s.code,day,Math.floor(minute/10),'v25-down-len')*10); // 4.5~9분
    const block=Math.floor(minute/len),u=v9Unit(s.code,day,block,'v25-down-path');

    // 하락 지속은 강하지만 V24처럼 특정 숫자 아래에서 80~90% 확정적으로 밀리는 구조는 피한다.
    let pFall=.46+severity*.075+(alignedDown?.065:0)-(alignedUp?.035:0)+(act.name==='hot'?.025:0);
    pFall=Math.max(.40,Math.min(.66,pFall));
    let pRebound=.070-severity*.020+(alignedUp?.026:0)-(alignedDown?.018:0);
    pRebound=Math.max(.025,Math.min(.105,pRebound));
    const pSide=Math.max(.25,1-pFall-pRebound);

    if(u<pFall){
      const jitter=v9Normal('v25-down-fall',s.code,day,minute)*(.00022+severity*.00006);
      const base=-(.00070+severity*.00048+(alignedDown?.00014:0)+(act.name==='hot'?.00010:0));
      // 직선 하락을 피하기 위한 작은 되돌림. -29 -> -21 같은 V자는 만들지 않을 정도로 제한.
      if(v9Unit(s.code,day,minute,'v25-down-relief')<(.105-severity*.025))
        return Math.max(-.00014,Math.min(.00034,.00012+v9Normal('v25-down-relief-n',s.code,day,minute)*.00012));
      return Math.max(-.00225,Math.min(-.00018,base+jitter));
    }
    if(u<pFall+pSide){
      const n=v9Normal('v25-down-side',s.code,day,minute)*(.00027+severity*.00006);
      const drag=-(.000025+severity*.000040+(alignedDown?.000050:0))+(alignedUp?.000025:0);
      return Math.max(-.00060,Math.min(.00038,n+drag));
    }
    // 희귀 반등도 되밀림을 자주 섞어 단기 V자 수익 기대값을 낮게 유지.
    if(v9Unit(s.code,day,minute,'v25-down-rpb')<(.52+severity*.10))
      return -(.00015+severity*.00018)+v9Normal('v25-down-rpb-n',s.code,day,minute)*.00013;
    return Math.max(-.00022,Math.min(.00064,.00030+severity*.00012+v9Normal('v25-down-rup',s.code,day,minute)*.00016));
  }

  // 급등 후: +30~40% 추격이 자동 우위가 되지 않도록 연장/소화/종료를 더 균형 있게 섞는다.
  if(changeRate>=upTrigger){
    const heat=Math.max(0,Math.min(1,(changeRate-upTrigger)/Math.max(.35,.82-upTrigger)));
    const len=10+Math.floor(v9Unit(s.code,day,Math.floor(minute/11),'v25-up-len')*11); // 5~10분
    const block=Math.floor(minute/len),u=v9Unit(s.code,day,block,'v25-up-path');
    let pContinue=.34-heat*.045+(alignedUp?.040:0)-(alignedDown?.025:0);
    pContinue=Math.max(.26,Math.min(.40,pContinue));
    let pFade=.30+heat*.055+(alignedDown?.035:0)-(alignedUp?.020:0);
    pFade=Math.max(.25,Math.min(.40,pFade));
    const pChurn=Math.max(.24,1-pContinue-pFade);

    if(u<pContinue){
      const n=v9Normal('v25-up-cont',s.code,day,minute)*(.00018+heat*.00004);
      return Math.max(.00020,Math.min(.00145,.00072+heat*.00026+n));
    }
    if(u<pContinue+pChurn){
      // 큰 조정/재상승을 고정 phase로 만들지 않고 매 틱 불규칙하게 소화한다.
      const n=v9Normal('v25-up-churn',s.code,day,minute)*(.00048+heat*.00010);
      const drag=-heat*.00010+(alignedUp?.000025:0);
      return Math.max(-.00115,Math.min(.00100,n+drag));
    }
    const n=v9Normal('v25-up-fade',s.code,day,minute)*.00018;
    // 추세 종료도 가끔 작은 양봉이 섞여 '+30이면 무조건 매도' 역공략을 막는다.
    if(v9Unit(s.code,day,minute,'v25-up-relief')<.13)return Math.max(-.00008,Math.min(.00038,.00014+n));
    return Math.max(-.00155,Math.min(-.00016,-(.00062+heat*.00046)+n));
  }

  // 극단 구간 밖에서는 Regime/Momentum/Activity 자체가 방향을 결정한다.
  // 숫자 임계값 근처에서 자동 반등/자동 추가상승 신호를 만들지 않는다.
  return 0;
};

function rewardDateKey(d){return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`}
function hourlyRewardSlot(ms=Date.now()){
  const d=new Date(ms),session=marketSessionInfo(ms),hour=d.getHours();
  const open=session.open&&hour>=8&&hour<=23;
  const slotKey=open?`${rewardDateKey(d)}_${String(hour).padStart(2,'0')}`:'';
  let next;
  if(open&&hour<23)next=new Date(d.getFullYear(),d.getMonth(),d.getDate(),hour+1,0,0,0);
  else if(open)next=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,8,0,0,0);
  else if(hour<8)next=new Date(d.getFullYear(),d.getMonth(),d.getDate(),8,0,0,0);
  else next=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,8,0,0,0);

function rewardRand(slotKey){return rnd(hash('hourly-reward-v27',Store.uid||userId||'guest',slotKey))}
function rewardCashAmount(r,kind){
  if(kind==='tiny')return Math.round((100+Math.floor(r()*401))/100)*100;
  if(kind==='jackpot')return Math.round((30000+Math.floor(r()*70001))/100)*100;
  if(kind==='high')return Math.round((5000+Math.floor(r()*25001))/100)*100;
  return Math.round((500+Math.floor(r()*4501))/100)*100;
}
const REWARD_PRICE_BUCKETS=[
  {min:0,max:10000,w:38},{min:10000,max:30000,w:27},{min:30000,max:70000,w:17},
  {min:70000,max:150000,w:10},{min:150000,max:300000,w:5},{min:300000,max:500000,w:2},{min:500000,max:Infinity,w:1}
];
function chooseRewardStock(r){
  const pool=STOCKS.filter(s=>!s.isETF),priced=pool.map(s=>({s,price:quote(s).price}));
  let z=r()*100,b=REWARD_PRICE_BUCKETS.at(-1);for(const x of REWARD_PRICE_BUCKETS){if((z-=x.w)<0){b=x;break}}
  let candidates=priced.filter(x=>x.price>=b.min&&x.price<b.max);
  if(!candidates.length)candidates=priced.sort((a,c)=>Math.abs(a.price-(Number.isFinite(b.max)?(b.min+b.max)/2:b.min))-Math.abs(c.price-(Number.isFinite(b.max)?(b.min+b.max)/2:b.min))).slice(0,12);
  const pick=candidates[Math.floor(r()*candidates.length)]||priced[0];
  const rarity=pick.price>=500000?'초희귀':pick.price>=150000?'희귀':'일반';
  return {type:'stock',stockCode:pick.s.code,stockName:pick.s.name,qty:1,grantPrice:pick.price,amount:0,rarity};
}
function buildHourlyReward(slotKey){

  if(roll<59.7){const amount=rewardCashAmount(r,'high');return{type:'cash',amount,stockCode:'',stockName:'',qty:0,grantPrice:0,rarity:'희귀'}}
  if(roll<60){const amount=rewardCashAmount(r,'jackpot');return{type:'cash',amount,stockCode:'',stockName:'',qty:0,grantPrice:0,rarity:'대박'}}

function applyHourlyReward(reward,slotKey){
  state.rewardClaims=state.rewardClaims&&typeof state.rewardClaims==='object'?state.rewardClaims:{};
  if(state.rewardClaims[slotKey])return false;
  if(reward.type==='cash')state.cash=Math.max(0,Math.round((+state.cash||0)+(+reward.amount||0)));
  else{
    const s=STOCKS.find(x=>x.code===reward.stockCode&&!x.isETF);if(!s)return false;
    const h=state.holdings[s.code]||{qty:0,avg:0},qty=1,price=Math.max(1,Math.round(+reward.grantPrice||quote(s).price));

  return true;
}

}

<script>
/* ============ V29 — 전환 안전형 1단계 엔진 수정 ============
   - 2026-08-27 08:00 KST 전까지는 V27 시세를 그대로 사용
   - 전환 순간 각 종목의 V27 가격에 새 엔진을 정확히 앵커링
   - 전환 이후 같은 장중 게임일 경계는 직전 종가에서 이어짐
   - 급등/급락 기대값 과교정 완화
   - 주문가격 5초 만료

*/
const V29_TRANSITION_MS = Date.parse('2026-08-27T08:00:00+09:00');

// V27의 실제 동작 함수들을 먼저 보존한다.
const v29LegacyDayOpen = v9DayOpen;
const v29LegacyRawPriceAt = v9RawPriceAt;
const v29LegacyPostMove = v11PostMove;

const V29_OPEN_CACHE = new Map();
const V29_CLOSE_CACHE = new Map();
const V29_SCALE_CACHE = new Map();

function v29TransitionTick(){
  return marketTickAt(acceleratedMs(effectiveMarketRealMs(V29_TRANSITION_MS)));
}
function v29SessionAnchorDay(){
  const ems = effectiveMarketRealMs(Date.now()), d = new Date(ems);
  const openReal = new Date(d.getFullYear(),d.getMonth(),d.getDate(),8,0,0,0).getTime();
  return Math.floor(marketTickAt(acceleratedMs(openReal))/390);
}

// P1/P2 — 현재 활성 postMove는 이 함수 하나다.
v11PostMove = function v29PostMove(s,day,minute,changeRate){
  if(s?.isETF)return 0;
  const windowBlock=Math.floor(minute/28);
  const downTrigger=.13+v9Unit(s.code,day,windowBlock,'v29-down-trigger')*.12;
  const upTrigger=.15+v9Unit(s.code,day,windowBlock,'v29-up-trigger')*.14;
  const reg=v9Regime(s,day,minute),mom=v9Momentum(s,day,minute),act=v11Activity(s,day,minute);
  const alignedDown=reg.bias<0&&mom<0,alignedUp=reg.bias>0&&mom>0;

  if(changeRate<=-downTrigger){
    const abs=Math.abs(changeRate),severity=Math.max(0,Math.min(1,(abs-downTrigger)/Math.max(.32,.68-downTrigger)));
    const len=9+Math.floor(v9Unit(s.code,day,Math.floor(minute/10),'v29-down-len')*10),block=Math.floor(minute/len),u=v9Unit(s.code,day,block,'v29-down-path');
    let pFall=.38+severity*.05+(alignedDown?.040:0)-(alignedUp?.030:0)+(act.name==='hot'?.015:0);
    pFall=Math.max(.33,Math.min(.52,pFall));
    let pRebound=.22-severity*.05+(alignedUp?.040:0)-(alignedDown?.030:0);
    pRebound=Math.max(.12,Math.min(.30,pRebound));
    const pSide=Math.max(.24,1-pFall-pRebound);

    if(u<pFall){
      const jitter=v9Normal('v29-down-fall',s.code,day,minute)*(.00020+severity*.00005);
      const base=-(.00045+severity*.00028+(alignedDown?.00008:0)+(act.name==='hot'?.00005:0));
      if(v9Unit(s.code,day,minute,'v29-down-relief')<(.14-severity*.025))
        return Math.max(-.00014,Math.min(.00038,.00013+v9Normal('v29-down-relief-n',s.code,day,minute)*.00013));
      return Math.max(-.00155,Math.min(-.00012,base+jitter));
    }
    if(u<pFall+pSide){
      const n=v9Normal('v29-down-side',s.code,day,minute)*(.00028+severity*.00005);
      const drag=-(.000010+severity*.000020+(alignedDown?.000025:0))+(alignedUp?.000035:0);
      return Math.max(-.00058,Math.min(.00048,n+drag));
    }
    const pullback=v9Unit(s.code,day,minute,'v29-down-rpb')<(.38+severity*.06);
    if(pullback)return -(.00010+severity*.00012)+v9Normal('v29-down-rpb-n',s.code,day,minute)*.00015;
    return Math.max(-.00020,Math.min(.00090,.00042+severity*.00016+v9Normal('v29-down-rup',s.code,day,minute)*.00020));
  }

  if(changeRate>=upTrigger){
    const heat=Math.max(0,Math.min(1,(changeRate-upTrigger)/Math.max(.35,.82-upTrigger)));
    const len=10+Math.floor(v9Unit(s.code,day,Math.floor(minute/11),'v29-up-len')*11),block=Math.floor(minute/len),u=v9Unit(s.code,day,block,'v29-up-path');
    let pContinue=.29-heat*.045+(alignedUp?.030:0)-(alignedDown?.025:0);
    pContinue=Math.max(.22,Math.min(.35,pContinue));
    let pFade=.34+heat*.055+(alignedDown?.030:0)-(alignedUp?.015:0);
    pFade=Math.max(.29,Math.min(.44,pFade));
    const pChurn=Math.max(.24,1-pContinue-pFade);

    if(u<pContinue){
      const n=v9Normal('v29-up-cont',s.code,day,minute)*(.00019+heat*.00004);
      return Math.max(.00014,Math.min(.00122,.00060+heat*.00022+n));
    }
    if(u<pContinue+pChurn){
      const n=v9Normal('v29-up-churn',s.code,day,minute)*(.00050+heat*.00010);
      const drag=-heat*.00012+(alignedUp?.000015:0);
      return Math.max(-.00120,Math.min(.00100,n+drag));
    }
    const n=v9Normal('v29-up-fade',s.code,day,minute)*.00019;
    if(v9Unit(s.code,day,minute,'v29-up-relief')<.15)
      return Math.max(-.00010,Math.min(.00040,.00013+n));
    return Math.max(-.00148,Math.min(-.00012,-(.00058+heat*.00040)+n));
  }
  return 0;
};

function v29RawWithOpen(s,day,minute,open){
  let p=open,slumpUntil=-1,center=open;
  for(let i=0;i<=minute;i++){
    const reg=v9Regime(s,day,i),mom=v9Momentum(s,day,i),vol=v9Volatility(s,day,i),act=v11Activity(s,day,i),shock=v9Shock(s,day,i);
    if(shock.ret){
      const shockLog=Math.log1p(Math.max(-.95,shock.ret));
      p*=Math.exp(shockLog);
      center*=Math.exp(shockLog*.78);
      if(shock.slump)slumpUntil=Math.max(slumpUntil,i+10+Math.floor(v9Unit(s.code,day,i,'slump')*21));
    }
    const slumpBias=i<slumpUntil?-.000045:0;
    const sigma=v66MarketSigma(p,.00032*vol*act.mult);
    const noise=v9Normal(s.code,day,i,'idio')*sigma;
    const currentChange=p/open-1;
    const extreme=v11ExtremeDrive(s,day,i,currentChange),post=v11PostMove(s,day,i,currentChange);
    let ret=(reg.bias+mom+slumpBias)*(.72+act.mult*.34)+v9MarketImpulse(day,i)*.28+v9SectorImpulse(s,day,i)*.32+noise+extreme+post;
    center*=Math.exp((reg.bias+slumpBias)*.25);
    const gap=Math.log(Math.max(1,center)/Math.max(1,p));
    ret+=Math.max(-.000035,Math.min(.000035,gap*.008));
    ret=v70EnsureCumulativeMove(s,day,i,p,ret,reg,mom);
    ret=Math.max(-.012,Math.min(.012,ret));
    p*=Math.exp(ret);
    p=Math.max(open*.10,Math.min(open*2.20,p));
  }
  return p;
}

function v29ModelDayOpen(s,day){
  const anchor=v29SessionAnchorDay();
  if(day<anchor||day>anchor+7)return v29LegacyDayOpen(s,day);
  const key=s.code+'|'+anchor+'|'+day;
  if(V29_OPEN_CACHE.has(key))return V29_OPEN_CACHE.get(key);

  let open=v29LegacyDayOpen(s,anchor);
  V29_OPEN_CACHE.set(s.code+'|'+anchor+'|'+anchor,open);

  for(let d=anchor;d<day;d++){
    const ck=s.code+'|'+anchor+'|close|'+d;
    let close=V29_CLOSE_CACHE.get(ck);
    if(!Number.isFinite(close)){
      close=v29RawWithOpen(s,d,389,open);
      V29_CLOSE_CACHE.set(ck,close);
    }
    const gap=Math.max(-.03,Math.min(.03,v9Normal('v29-day-gap',s.code,d)*.009));
    open=Math.max(1,close*Math.exp(gap));
    V29_OPEN_CACHE.set(s.code+'|'+anchor+'|'+(d+1),open);
  }
  return open;
}

function v29ModelRaw(s,t){
  const day=Math.floor(t/390),minute=((t%390)+390)%390,open=v29ModelDayOpen(s,day);
  const p=v29RawWithOpen(s,day,minute,open);
  return {price:v65RoundPrice(p),open:v65RoundPrice(open),day,minute};
}

// 전환 순간의 V27 가격 = 새 엔진의 시작 가격.
// 이 scale은 종목마다 한 번 계산되고 세션 내 계속 동일하다.
function v29MigrationScale(s){
  const anchor=v29SessionAnchorDay();
  const key=s.code+'|'+anchor;
  if(V29_SCALE_CACHE.has(key))return V29_SCALE_CACHE.get(key);

  const tt=v29TransitionTick();
  const legacy=v29LegacyRawPriceAt(s,tt);
  const model=v29ModelRaw(s,tt);
  const scale=(legacy?.price>0&&model?.price>0)?legacy.price/model.price:1;
  const safe=Math.max(.20,Math.min(5,scale));
  V29_SCALE_CACHE.set(key,safe);
  return safe;
}

v9RawPriceAt=function v29RawPriceAt(s,t=marketTick()){
  const tt=v29TransitionTick();

  // 배포 당일 장 마감까지는 기존 V27 가격을 그대로 보여준다.
  if(Date.now()<V29_TRANSITION_MS || t<tt)return v29LegacyRawPriceAt(s,t);

  const raw=v29ModelRaw(s,t),scale=v29MigrationScale(s);
  return {
    ...raw,
    price:v65RoundPrice(raw.price*scale),
    open:v65RoundPrice(raw.open*scale)
  };
};
priceAt=function(s,t=marketTick()){

orderSheet=function(type){

<script>
/* ============ V30 — P1 미세 밸런스 조정 ============
   목표:
   - 급하락 TOP의 구조적 불리함을 완화하되 V자 반등 필승은 되살리지 않음
   - 급상승 TOP의 추격매수 기대값도 약하게 눌러 양쪽 기대값을 중립에 가깝게
   - V29의 전환 안전장치 / 경계 연속성 / 5초 주문 만료 / 홈 보상카드 유지
*/

v11PostMove = function v30PostMove(s,day,minute,changeRate){
  if(s?.isETF)return 0;

  const windowBlock=Math.floor(minute/28);
  // 숫자 하나를 외워 공략하지 못하도록 종목·시간대별 발동점 유지
  const downTrigger=.13+v9Unit(s.code,day,windowBlock,'v30-down-trigger')*.12;
  const upTrigger=.15+v9Unit(s.code,day,windowBlock,'v30-up-trigger')*.14;

  const reg=v9Regime(s,day,minute);
  const mom=v9Momentum(s,day,minute);
  const act=v11Activity(s,day,minute);
  const alignedDown=reg.bias<0&&mom<0;
  const alignedUp=reg.bias>0&&mom>0;

  // 급하락 이후: "계속 하락" 우위를 조금 줄이고
  // 횡보/완만한 반등을 늘리되, 강한 V자 반등은 여전히 희귀하게 유지
  if(changeRate<=-downTrigger){
    const abs=Math.abs(changeRate);
    const severity=Math.max(0,Math.min(1,(abs-downTrigger)/Math.max(.32,.68-downTrigger)));
    const len=9+Math.floor(v9Unit(s.code,day,Math.floor(minute/10),'v30-down-len')*11);
    const block=Math.floor(minute/len);
    const u=v9Unit(s.code,day,block,'v30-down-path');

    let pFall=.35+severity*.04+(alignedDown?.030:0)-(alignedUp?.035:0)+(act.name==='hot'?.010:0);
    pFall=Math.max(.30,Math.min(.47,pFall));

    let pRebound=.245-severity*.040+(alignedUp?.045:0)-(alignedDown?.020:0);
    pRebound=Math.max(.15,Math.min(.32,pRebound));

    const pSide=Math.max(.28,1-pFall-pRebound);

    if(u<pFall){
      const jitter=v9Normal('v30-down-fall',s.code,day,minute)*(.00018+severity*.00004);
      const base=-(.00039+severity*.00022+(alignedDown?.00006:0)+(act.name==='hot'?.00004:0));

      // 작은 되돌림은 허용하지만 큰 V자는 드물게
      if(v9Unit(s.code,day,minute,'v30-down-relief')<(.17-severity*.02)){
        return Math.max(-.00012,Math.min(.00034,
          .00012+v9Normal('v30-down-relief-n',s.code,day,minute)*.00012));
      }
      return Math.max(-.00132,Math.min(-.00010,base+jitter));
    }

    if(u<pFall+pSide){
      const n=v9Normal('v30-down-side',s.code,day,minute)*(.00030+severity*.00005);
      const drag=-(.000004+severity*.000010+(alignedDown?.000012:0))+(alignedUp?.000030:0);
      return Math.max(-.00055,Math.min(.00052,n+drag));
    }

    // 반등 경로도 대부분 완만하게. 한 틱 급반등은 제한.
    const pullback=v9Unit(s.code,day,minute,'v30-down-rpb')<(.42+severity*.05);
    if(pullback){
      return -(.00006+severity*.00008)
        +v9Normal('v30-down-rpb-n',s.code,day,minute)*.00015;
    }
    return Math.max(-.00016,Math.min(.00072,
      .00032+severity*.00012
      +v9Normal('v30-down-rup',s.code,day,minute)*.00018));
  }

  // 급상승 이후: 추격매수 우위를 약간 더 제거
  if(changeRate>=upTrigger){
    const heat=Math.max(0,Math.min(1,(changeRate-upTrigger)/Math.max(.35,.82-upTrigger)));
    const len=10+Math.floor(v9Unit(s.code,day,Math.floor(minute/11),'v30-up-len')*11);
    const block=Math.floor(minute/len);
    const u=v9Unit(s.code,day,block,'v30-up-path');

    let pContinue=.275-heat*.045+(alignedUp?.025:0)-(alignedDown?.030:0);
    pContinue=Math.max(.20,Math.min(.33,pContinue));

    let pFade=.355+heat*.050+(alignedDown?.035:0)-(alignedUp?.010:0);
    pFade=Math.max(.31,Math.min(.45,pFade));

    const pChurn=Math.max(.25,1-pContinue-pFade);

    if(u<pContinue){
      const n=v9Normal('v30-up-cont',s.code,day,minute)*(.00018+heat*.00004);
      return Math.max(.00012,Math.min(.00110,.00052+heat*.00018+n));
    }

    if(u<pContinue+pChurn){
      const n=v9Normal('v30-up-churn',s.code,day,minute)*(.00052+heat*.00010);
      const drag=-heat*.00013+(alignedUp?.000010:0);
      return Math.max(-.00118,Math.min(.00094,n+drag));
    }

    const n=v9Normal('v30-up-fade',s.code,day,minute)*.00019;
    if(v9Unit(s.code,day,minute,'v30-up-relief')<.17){
      return Math.max(-.00010,Math.min(.00038,.00012+n));
    }
    return Math.max(-.00142,Math.min(-.00011,
      -(.00056+heat*.00036)+n));
  }

  return 0;
};

<script>
/* ============ V31 — 비결정형 급등·급락 후속경로 ============
   목표: 현재 등락률 자체가 다음 방향의 정답이 되지 않게 한다.
   - 동일한 +20% 급등주도 연장/횡보/조정/가짜돌파가 섞임
   - 동일한 -20% 급락주도 추가하락/횡보/완만반등/가짜반등이 섞임
   - 확률도 종목/게임일/시간블록/Regime/Momentum/Activity에 따라 계속 흔들림
   - 어떤 단일 조건도 방향확률을 약 58% 이상 밀지 않도록 제한
   - V29 전환 보호·게임일 연속성·주문 5초 만료·홈 보상카드는 그대로 유지
*/

function v31Clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function v31SoftSeverity(absChange,start,span){
  const z=(absChange-start)/span;
  return 1/(1+Math.exp(-4*z));
}
function v31MixWeights(s,day,minute,side,changeRate){
  const block=Math.floor(minute/24);
  const reg=v9Regime(s,day,minute);
  const mom=v9Momentum(s,day,minute);
  const act=v11Activity(s,day,minute);
  const abs=Math.abs(changeRate);
  const sev=v31SoftSeverity(abs, side>0?.16:.15, .18);
  const wobble=(v9Unit(s.code,day,block,'v31-wobble-'+side)-.5)*.14;
  const wobble2=(v9Unit(s.code,day,block,'v31-wobble2-'+side)-.5)*.10;
  const regSign=Math.sign(reg.bias||0), momSign=Math.sign(mom||0);
  const trendSupport=(regSign===side?1:0)+(momSign===side?1:0);
  const trendOppose=(regSign===-side?1:0)+(momSign===-side?1:0);
  const hot=act?.name==='hot'?1:0;
  // 각 경로의 기본 비중. 숫자 하나를 넘는 순간 확 바뀌지 않도록 연속형 보정만 사용.
  let trend=.28 + .035*trendSupport - .035*trendOppose + .020*hot + wobble;
  let churn=.34 + wobble2 - .015*hot;
  let reverse=.28 - .020*trendSupport + .030*trendOppose + sev*.020 - wobble*.45;
  let fake=.10 + (1-sev)*.018 + (v9Unit(s.code,day,block,'v31-fake-'+side)-.5)*.035;
  trend=v31Clamp(trend,.20,.38);
  churn=v31Clamp(churn,.27,.43);
  reverse=v31Clamp(reverse,.21,.38);
  fake=v31Clamp(fake,.06,.15);
  const sum=trend+churn+reverse+fake;
  return {trend:trend/sum,churn:churn/sum,reverse:reverse/sum,fake:fake/sum,sev,act,reg,mom};
}

v11PostMove=function v31PostMove(s,day,minute,changeRate){
  if(s?.isETF)return 0;
  const abs=Math.abs(changeRate);
  // 10% 부근부터 아주 부드럽게 개입. 하드 경계는 두지 않는다.
  const engage=v31Clamp((abs-.09)/.10,0,1);
  if(engage<=0)return 0;
  const side=changeRate>=0?1:-1;
  const w=v31MixWeights(s,day,minute,side,changeRate);
  const len=8+Math.floor(v9Unit(s.code,day,Math.floor(minute/8),'v31-len-'+side)*15);
  const block=Math.floor(minute/len);
  const u=v9Unit(s.code,day,block,'v31-path-'+side);
  let mode;
  if(u<w.trend)mode='trend';
  else if(u<w.trend+w.churn)mode='churn';
  else if(u<w.trend+w.churn+w.reverse)mode='reverse';
  else mode='fake';

  const n=v9Normal('v31-n',s.code,day,minute,side);
  let ret=0;
  if(mode==='trend'){
    // 현재 방향 지속. 강도는 제한하여 추격매수/급락회피가 정답이 되지 않게 한다.
    const mag=.00028+w.sev*.00018+Math.abs(n)*.00010;
    ret=side*mag;
    // 같은 경로 안에서도 간헐적 반대 틱
    if(v9Unit(s.code,day,minute,'v31-trend-counter-'+side)<(.23+w.sev*.03))
      ret=-side*(.00008+Math.abs(v9Normal('v31-trend-counter-n',s.code,day,minute))* .00012);
  }else if(mode==='churn'){
    // 방향성이 거의 없는 저점/고점 소화 구간
    const bias=(Math.sign(w.reg.bias||0)+Math.sign(w.mom||0))*.000012;
    ret=v9Normal('v31-churn',s.code,day,minute)*(.00034+w.sev*.00006)+bias;
  }else if(mode==='reverse'){
    // 반대 방향 움직임. 급락주는 완만한 반등, 급등주는 조정.
    const mag=.00026+w.sev*.00014+Math.abs(n)*.00009;
    ret=-side*mag;
    // 되돌림도 일률적이지 않게 일부 틱은 원방향으로 되밀림
    if(v9Unit(s.code,day,minute,'v31-reverse-counter-'+side)<(.30-w.sev*.04))
      ret=side*(.00007+Math.abs(v9Normal('v31-reverse-counter-n',s.code,day,minute))* .00011);
  }else{
    // 가짜 돌파/가짜 반등: 짧게 한쪽으로 갔다 다시 섞인다.
    const phase=minute%len;
    const first=phase < Math.floor(len*.42);
    const fakeSide=first?-side:side;
    ret=fakeSide*(.00022+Math.abs(v9Normal('v31-fake-n',s.code,day,minute))* .00013);
  }
  // 개입 강도도 연속형. ±10% 근처에서 갑자기 행동이 바뀌지 않는다.
  ret*=engage;
  return v31Clamp(ret,-.00082,.00082);
};

// 경계 직후 첫 2틱에는 대형 shock이 겹쳐 순간이동처럼 보이지 않도록 shock 효과만 제한한다.
const v31ShockBase=v9Shock;
v9Shock=function v31Shock(s,day,minute){
  const sh=v31ShockBase(s,day,minute);
  if(!sh||!sh.ret)return sh;
  if(minute<=1){
    return {...sh,ret:v31Clamp(sh.ret,-.018,.018),slump:false};
  }
  return sh;
};

<script>

   목적:
   - +20~40%는 잘 나오는데 -20~-40%는 일찍 눌리는 구조적 비대칭 보정

function v32Clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function v32SoftSeverity(absChange){
  // 상승/하락 완전히 같은 기준: 약 15% 부근부터 부드럽게 커짐
  const z=(absChange-.15)/.18;
  return 1/(1+Math.exp(-4*z));
}

function v32MixWeights(s,day,minute,side,changeRate){
  const block=Math.floor(minute/24);
  const reg=v9Regime(s,day,minute);
  const mom=v9Momentum(s,day,minute);
  const act=v11Activity(s,day,minute);
  const sev=v32SoftSeverity(Math.abs(changeRate));

  // 종목·날짜·시간마다 확률 자체가 흔들린다.
  const wobble=(v9Unit(s.code,day,block,'v32-wobble-'+side)-.5)*.15;
  const wobble2=(v9Unit(s.code,day,block,'v32-wobble2-'+side)-.5)*.11;
  const regSign=Math.sign(reg.bias||0),momSign=Math.sign(mom||0);
  const trendSupport=(regSign===side?1:0)+(momSign===side?1:0);
  const trendOppose=(regSign===-side?1:0)+(momSign===-side?1:0);
  const hot=act?.name==='hot'?1:0;

  // 상승/하락 동일한 기본식.
  let trend=.275+.032*trendSupport-.032*trendOppose+.018*hot+wobble;
  let churn=.345+wobble2-.012*hot;
  let reverse=.280-.018*trendSupport+.028*trendOppose+sev*.018-wobble*.42;
  let fake=.100+(1-sev)*.016+(v9Unit(s.code,day,block,'v32-fake-'+side)-.5)*.036;

  trend=v32Clamp(trend,.19,.38);
  churn=v32Clamp(churn,.27,.44);
  reverse=v32Clamp(reverse,.21,.39);
  fake=v32Clamp(fake,.06,.15);

  const sum=trend+churn+reverse+fake;
  return {trend:trend/sum,churn:churn/sum,reverse:reverse/sum,fake:fake/sum,sev,act,reg,mom};
}

v11PostMove=function v32PostMove(s,day,minute,changeRate){
  if(s?.isETF)return 0;

  const abs=Math.abs(changeRate);
  // 양방향 완전히 동일한 연속형 개입. 하드 트리거 없음.
  const engage=v32Clamp((abs-.09)/.10,0,1);
  if(engage<=0)return 0;

  const side=changeRate>=0?1:-1;
  const w=v32MixWeights(s,day,minute,side,changeRate);
  const len=8+Math.floor(v9Unit(s.code,day,Math.floor(minute/8),'v32-len-'+side)*15);
  const block=Math.floor(minute/len);
  const u=v9Unit(s.code,day,block,'v32-path-'+side);

  let mode;
  if(u<w.trend)mode='trend';
  else if(u<w.trend+w.churn)mode='churn';
  else if(u<w.trend+w.churn+w.reverse)mode='reverse';
  else mode='fake';

  const n=v9Normal('v32-n',s.code,day,minute,side);
  let ret=0;

  if(mode==='trend'){
    const mag=.00029+w.sev*.00019+Math.abs(n)*.00010;
    ret=side*mag;
    if(v9Unit(s.code,day,minute,'v32-trend-counter-'+side)<(.23+w.sev*.03))
      ret=-side*(.00008+Math.abs(v9Normal('v32-trend-counter-n',s.code,day,minute))* .00012);
  }else if(mode==='churn'){
    const bias=(Math.sign(w.reg.bias||0)+Math.sign(w.mom||0))*.000011;
    ret=v9Normal('v32-churn',s.code,day,minute)*(.00035+w.sev*.00006)+bias;
  }else if(mode==='reverse'){
    const mag=.00027+w.sev*.00014+Math.abs(n)*.00009;
    ret=-side*mag;
    if(v9Unit(s.code,day,minute,'v32-reverse-counter-'+side)<(.30-w.sev*.04))
      ret=side*(.00007+Math.abs(v9Normal('v32-reverse-counter-n',s.code,day,minute))* .00011);
  }else{
    const phase=minute%len;
    const first=phase<Math.floor(len*.42);
    const fakeSide=first?-side:side;
    ret=fakeSide*(.00022+Math.abs(v9Normal('v32-fake-n',s.code,day,minute))* .00013);
  }

  return v32Clamp(ret*engage,-.00084,.00084);
};

// 누적된 V18~V25 Extreme 체인에 남은 상방 꼬리 우위를 아주 약하게 보정.

const v32ExtremeBase=v11ExtremeDrive;
v11ExtremeDrive=function v32ExtremeDrive(s,day,minute){
  let base=Number(v32ExtremeBase(s,day,minute))||0;
  if(s?.isETF||base===0)return base;

  const block=Math.floor(minute/12);
  const jitter=(v9Unit(s.code,day,block,'v32-tail-balance')-.5)*.08; // ±4%
  const signBias=base>0 ? -.035 : .035; // 상방 -3.5%, 하방 +3.5%
  const mult=1+signBias+jitter;
  return v32Clamp(base*mult,-.0085,.0085);
};

<script>
/* ============ V34 STEP 2 — 시장 분포/급등락 균형 보정 ============
   검증에서 확인된 구조:
   1) 기존 Regime 분포가 하락 30% / 중립 32% / 상승 38%로 상방 편향.
   2) 같은 절대 % 구간이라도 복리 가격공간에서는 -20→-30%가 +20→+30%보다
      더 큰 상대 이동을 요구해 하방 꼬리가 짧아지는 기하학적 비대칭이 존재.
   수정 원칙:
   - 상승/하락 Regime 발생확률을 완전 대칭화.
   - 후속 경로의 방향확률(trend/churn/reverse/fake)은 V32 그대로 유지.
   - 이미 하락 중이고 실제 반환값도 추가하락인 경우에만 이동폭을 연속적으로 보정.
   - 특정 -20/-25/-30% 하드 트리거는 만들지 않음.
   - ETF 제외.
*/

// Regime: strongDown 11% + down 22% / flat 34% / up 22% + strongUp 11%
v9Regime = function v34SymmetricRegime(s,day,minute){
  const len=55+Math.floor(v9Unit(s.code,day,'reg-len')*56);
  const block=Math.floor(minute/len);
  const u=v9Unit(s.code,day,block,'reg');
  const type=u<.11?'strongDown':u<.33?'down':u<.67?'flat':u<.89?'up':'strongUp';
  return {
    type,
    bias:{strongDown:-.00020,down:-.00010,flat:0,up:.00010,strongUp:.00020}[type]
  };
};

// V32의 경로 선택은 그대로 두고, 퍼센트 공간의 하방 기하학적 불리함만 보정.
const v34PostBase = v11PostMove;
v11PostMove = function v34PercentSpaceBalancedPostMove(s,day,minute,changeRate){
  let ret = Number(v34PostBase(s,day,minute,changeRate)) || 0;
  if(s?.isETF || changeRate>=-.12 || ret===0) return ret;

  // -12%부터 -35%까지 연속적으로 증가. 특정 숫자에서 동작이 갑자기 바뀌지 않는다.
  const z=Math.max(0,Math.min(1,(Math.abs(changeRate)-.12)/.23));

  // 방향확률은 건드리지 않는다.
  // '추가하락'이 이미 선택된 틱의 이동폭만 보정하고,
  // 반등 틱도 소폭 완화해 하방 꼬리의 거리만 보정한다.
  if(ret<0) ret*=1.35+.85*z;       // 1.35x → 최대 2.20x
  else      ret*=.92-.18*z;        // 0.92x → 최소 0.74x

  return Math.max(-.00185,Math.min(.00084,ret));
};

<script>
/* ============ V35 STEP 3 — 체결 악용 방지 / 실시간 체결가 ============
   - V29의 5초 주문 만료 유지
   - 주문 확정 직전에 현재 시세를 다시 읽음
   - 주문금액이 커질수록 아주 작은 시장충격(슬리피지) 적용
   - 매수는 조금 높게 / 매도는 조금 낮게 체결
   - ETF 포함 동일 원칙, 단 가격 생성 엔진은 건드리지 않음
   - 시장 방향/급등락 확률은 STEP 3에서 변경하지 않음
*/
const v35TradeBase=trade;

function v35SlipRate(notional){
  // 소액은 체감 거의 없음. 큰 계좌의 무한 전액회전만 억제.
  // 100만원≈0.01%, 1천만원≈0.04%, 5천만원≈0.10%, 1억≈0.15%, 상한 0.35%
  const n=Math.max(0,+notional||0);
  return Math.min(.0035,.00005+.00045*Math.sqrt(n/10_000_000));
}

trade=async function v35Trade(type,qty){
  qty=Math.floor(Number(qty));
  if(!selected||!pendingOrder||pendingOrder.code!==selected.code||pendingOrder.type!==type)
    return v35TradeBase(type,qty);

  // V29 만료 검사가 먼저 의미를 갖도록 5초 이상이면 기존 래퍼에 맡긴다.
  if(Date.now()-(+pendingOrder.at||0)>5000)return v35TradeBase(type,qty);

  // 주문창을 연 가격이 아니라 '확정 순간'의 현재 화면 시세를 기준으로 한다.
  const live=quote(selected);
  const livePrice=Math.max(1,+live?.price||+pendingOrder.price||1);
  const notional=livePrice*Math.max(1,qty);
  const slip=v35SlipRate(notional);

  // KRX식 호가단위 단순화: 기존 게임과 동일하게 10원 단위.
  const execRaw=livePrice*(type==='buy'?1+slip:1-slip);
  const exec=v65RoundPrice(execRaw);

  pendingOrder.price=exec;
  pendingOrder.v35={
    livePrice,
    slipRate:slip,
    notional,
    refreshedAt:Date.now()
  };

  return v35TradeBase(type,qty);
};

<script>
/* ============ V36 STEP 4 — 특정 등락률 구간의 예측 우위 평탄화 ============
   - +20%대 추격 우위와 -15~-20% 과도한 약세를 '넓고 부드러운' 함수로 완화

   - V35 체결 보호 / ETF 라우팅 / V34 상하방 균형 유지

const v36PostBase = v11PostMove;

function v36Bell(x, center, width){
  const z=(x-center)/width;
  return Math.exp(-0.5*z*z);
}

v11PostMove=function v36FlattenPredictableZones(s,day,minute,changeRate){

  const upBand=v36Bell(changeRate,.22,.055);

  // 영향은 대략 -10~-25%에 걸쳐 부드럽게 분산.
  const dnBand=v36Bell(changeRate,-.175,.055);
  if(dnBand>0.01){
    if(ret<0) ret*=1-.30*dnBand;
    else      ret*=1+.14*dnBand;
  }

  // 종목/시간별 작은 흔들림으로 보정 자체가 고정 공식이 되지 않게 함.
  const block=Math.floor(minute/17);

<script>
/* ============ V37 — 통합 대칭 상태전이 엔진 ============
   V34/V36처럼 특정 등락률 구간을 사후 교정하지 않는다.
   현재 급등/급락의 절대 크기는 '활성도'에만 영향.
   미래 방향은 추세연장/횡보/반전/페이크 4상태에서 선택되며
   상승/하락에 완전히 같은 공식을 사용한다.
*/
function v37Clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function v37Smooth01(x){x=v37Clamp(x,0,1);return x*x*(3-2*x);}

v11PostMove=function v37UnifiedPostMove(s,day,minute,changeRate){
  if(s?.isETF)return 0;

  const side=changeRate>=0?1:-1;
  const a=Math.abs(changeRate);

  // 8~30% 사이에서 부드럽게 개입 강도만 증가. 방향 확률의 하드 경계가 아님.
  const engage=v37Smooth01((a-.08)/.22);
  if(engage<=0)return 0;

  const reg=v9Regime(s,day,minute);
  const mom=v9Momentum(s,day,minute);
  const act=v11Activity(s,day,minute);
  const block=Math.floor(minute/23);

  const regSide=Math.sign(reg?.bias||0);
  const momSide=Math.sign(mom||0);
  let support=0;
  if(regSide===side)support+=1;
  else if(regSide===-side)support-=1;
  if(momSide===side)support+=1;
  else if(momSide===-side)support-=1;

  // 시장정보는 최대 ±5%p 정도만 경로확률에 영향.
  const info=v37Clamp(support*.025,-.05,.05);
  const wobble=(v9Unit(s.code,day,block,'v37-wobble')-.5)*.14;

  let pTrend=.27+info+wobble;
  let pReverse=.27-info-wobble*.55;
  let pFake=.12+(v9Unit(s.code,day,block,'v37-fake')-.5)*.05;
  let pChurn=1-pTrend-pReverse-pFake;

  pTrend=v37Clamp(pTrend,.18,.37);
  pReverse=v37Clamp(pReverse,.18,.37);
  pFake=v37Clamp(pFake,.075,.165);
  pChurn=v37Clamp(pChurn,.25,.43);
  const sum=pTrend+pReverse+pFake+pChurn;
  pTrend/=sum;pReverse/=sum;pFake/=sum;pChurn/=sum;

  const len=8+Math.floor(v9Unit(s.code,day,block,'v37-len')*15);
  const pathBlock=Math.floor(minute/len);
  const u=v9Unit(s.code,day,pathBlock,'v37-path');

  let mode='churn';
  if(u<pTrend)mode='trend';
  else if(u<pTrend+pChurn)mode='churn';
  else if(u<pTrend+pChurn+pReverse)mode='reverse';
  else mode='fake';

  // 상승/하락에 동일한 magnitude 식.
  const severity=v37Smooth01((a-.10)/.30);
  const hot=act?.name==='hot'?1:0;
  const n=Math.abs(v9Normal('v37-mag',s.code,day,minute));

  let ret=0;
  if(mode==='trend'){
    const mag=.00024+severity*.00017+hot*.000035+n*.000085;
    ret=side*mag;
  }else if(mode==='reverse'){
    const mag=.00024+severity*.00017+hot*.000035+n*.000085;
    ret=-side*mag;
  }else if(mode==='churn'){
    ret=v9Normal('v37-churn',s.code,day,minute)*(.00031+severity*.000055);
  }else{
    const phase=(minute%len)/len;
    const fakeSide=phase<.44?-side:side;
    ret=fakeSide*(.00019+severity*.00008+n*.00007);
  }

  // 드물게 경로 내부에서 반대틱을 섞어 단순 연속패턴을 약화.
  if(mode!=='churn' && v9Unit(s.code,day,minute,'v37-counter')<(.16+severity*.04)){
    ret*=-.38;
  }

  return v37Clamp(ret*engage,-.00082,.00082);
};

// V32의 상/하방 고정 ±3.5% 사후 보정을 제거.
// 기존 extreme 결과의 방향은 유지하되 종목/시간 공통식으로만 약하게 압축한다.
const v37ExtremeBase=v11ExtremeDrive;
v11ExtremeDrive=function v37NeutralExtreme(s,day,minute){
  const base=Number(v37ExtremeBase(s,day,minute))||0;
  if(s?.isETF||base===0)return base;
  const block=Math.floor(minute/13);
  const jitter=.96+v9Unit(s.code,day,block,'v37-ext-jitter')*.08;
  return v37Clamp(base*jitter,-.0082,.0082);
};

<script>
/* ============ V38 — 불합격구간 수정: Extreme 탄생단계 대칭화 ============
   목표:
   - +30% 이상 상방 꼬리 과다 제거
   - 급상승 1위 추격 기대값 제거
   - -15~-25% 구간의 기대값 절벽 완화
   원칙:
   - 특정 등락률 구간을 직접 보정하지 않음
   - Extreme 방향/세기를 처음 만드는 단계에서 상하 동일 공식 사용
   - V37의 통합 postMove 상태전이 유지
*/
function v38Clamp(x,a,b){return Math.max(a,Math.min(b,x));}

// 이전 Extreme 체인을 우회하고 하나의 대칭 엔진으로 최종 교체한다.
v11ExtremeDrive=function v38SymmetricExtreme(s,day,minute){
  if(s?.isETF)return 0;

  const reg=v9Regime(s,day,minute);
  const mom=v9Momentum(s,day,minute);
  const act=v11Activity(s,day,minute);
  const block=Math.floor(minute/18);

  // 이벤트 자체 발생 여부: 방향과 무관.
  const hot=act?.name==='hot'?1:0;
  const pEvent=.018+hot*.010;
  if(v9Unit(s.code,day,block,'v38-ext-event')>=pEvent)return 0;

  // 방향은 상승/하락 50:50에서 시작.
  // Regime/Momentum은 합쳐도 최대 ±6%p만 기울일 수 있다.
  let tilt=0;
  const rb=Math.sign(reg?.bias||0);
  const mb=Math.sign(mom||0);
  tilt += rb*.018;
  tilt += mb*.018;
  tilt=v38Clamp(tilt,-.06,.06);

  const dir=v9Unit(s.code,day,block,'v38-ext-dir') < (.5+tilt) ? 1 : -1;

  // 방향과 관계없이 동일한 지속시간/세기 공식.
  const len=5+Math.floor(v9Unit(s.code,day,block,'v38-ext-len')*16);
  const phase=(minute%18)/Math.max(1,len);
  if(phase>1)return 0;

  const shape=Math.sin(Math.PI*Math.min(1,phase));
  const mag=.00042
    +v9Unit(s.code,day,block,'v38-ext-mag')*.00100
    +hot*.00016;

  // 일부 이벤트는 가짜 돌파: 중간 이후 방향이 뒤집힌다.
  const fake=v9Unit(s.code,day,block,'v38-ext-fake')<.18;
  let actualDir=dir;
  if(fake && phase>.48)actualDir=-dir;

  const noise=v9Normal('v38-ext-noise',s.code,day,minute)*.00011;
  return v38Clamp(actualDir*mag*(.45+.55*shape)+noise,-.00175,.00175);
};

// Regime도 V34의 대칭 분포를 최종 보장.
v9Regime=function v38SymmetricRegime(s,day,minute){
  const len=55+Math.floor(v9Unit(s.code,day,'v38-reg-len')*56);
  const block=Math.floor(minute/len);
  const u=v9Unit(s.code,day,block,'v38-reg');
  const type=u<.11?'strongDown':u<.33?'down':u<.67?'flat':u<.89?'up':'strongUp';
  return {type,bias:{strongDown:-.00020,down:-.00010,flat:0,up:.00010,strongUp:.00020}[type]};
};

v11ExtremeDrive=function v41TailPercentSpaceExtreme(s,day,minute,currentChange=0){
  let ret=Number(v39ExtremeBase(s,day,minute,currentChange))||0;
  if(s?.isETF || ret===0)return ret;

  /*
    가격은 exp(ret)로 움직이므로 같은 log-return 충격은
    이미 오른 종목에서 퍼센트 상승폭을 더 크게, 이미 내린 종목에서는

  */
  const cc=v39Clamp(Number(currentChange)||0,-.72,.95);
  let scale=1/(1+cc);
  // 한 틱에서 과도한 폭발/반등을 막는 연속형 안전 범위.
  scale=v39Clamp(scale,.68,1.65);

  // 꼬리 보정은 extreme 성분에만 적용. 일반 noise/regime/momentum은 그대로.
  ret*=scale;

  return v39Clamp(ret,-.00235,.00205);
};

<script>
/* ============ V41.1 — 1일 차트 시간축/전일종가 기준 수정 ============
   - 1일 차트는 00:00~24:00이 아니라 실제 장시간 08:00~23:30 기준
   - 08:06이면 하루 차트의 약 0.6%만 채워짐
   - '어제보다'는 오늘 시가가 아니라 전일 종가 기준으로 계산
   - 전일 종가를 점선 기준선으로 표시
   - 현재가가 전일 종가보다 높으면 차트 색도 상승색으로 표시
*/

function v411SessionBounds(ms=Date.now()){
  const d=new Date(ms);
  const open=new Date(d.getFullYear(),d.getMonth(),d.getDate(),8,0,0,0).getTime();
  const close=new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,30,0,0).getTime();
  return {open,close};
}
function v411PrevCloseMs(ms=Date.now()){
  const d=new Date(ms);
  d.setDate(d.getDate()-1);
  d.setHours(23,30,0,0);
  return d.getTime();
}
function v411PrevClose(s,ms=Date.now()){
  return Math.max(1,fastVisualPriceAt(s,v411PrevCloseMs(ms)));
}
function v411DaySeries(s,count=CHART_RANGES.day.count){
  const now=Date.now(),{open,close}=v411SessionBounds(now);
  const prev=v411PrevClose(s,now);

  if(now<open)return [prev,prev];

  const end=Math.min(now,close);
  const progress=Math.max(0,Math.min(1,(end-open)/(close-open)));
  const lastSlot=Math.max(1,Math.min(count-1,Math.floor(progress*(count-1))));
  const used=Math.min(count,lastSlot+1);
  const out=[];

  for(let i=0;i<used;i++){
    if(i===used-1){
      out.push(quote(s).price);
    }else{
      const ms=open+(i/(count-1))*(close-open);
      out.push(fastVisualPriceAt(s,ms));
    }
  }
  return out;
}

const v411ChartSeriesBase=chartSeries;
chartSeries=function(s,range=chartRange){
  return range==='day'?v411DaySeries(s,CHART_RANGES.day.count):v411ChartSeriesBase(s,range);
};

const v411RangeChangeBase=rangeChange;
rangeChange=function(s,range=chartRange){
  if(range!=='day')return v411RangeChangeBase(s,range);
  const base=v411PrevClose(s),last=quote(s).price,value=last-base;
  return {label:'어제보다',value,rate:value/Math.max(1,base)*100};
};

const v411ChartAnnotationsBase=chartAnnotations;
chartAnnotations=function(ctx,s,a,x,y,w,h,col){
  v411ChartAnnotationsBase(ctx,s,a,x,y,w,h,col);
  if(chartRange!=='day')return;
  const prev=v411PrevClose(s);
  ctx.save();
  ctx.strokeStyle='#cfd6de';
  ctx.lineWidth=1;
  ctx.setLineDash([5,5]);
  ctx.beginPath();
  ctx.moveTo(0,y(prev));
  ctx.lineTo(w,y(prev));
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#8b95a1';
  ctx.font='11px -apple-system, sans-serif';
  ctx.textAlign='left';
  ctx.textBaseline='bottom';
  ctx.fillText('전일 종가',7,Math.max(12,y(prev)-5));
  ctx.restore();
};

drawChart=function(s,hover=-1){
  const c=$('#chart');if(!c)return;
  const rect=c.getBoundingClientRect(),vh=window.innerHeight||document.documentElement.clientHeight;
  if(rect.bottom<0||rect.top>vh)return;

  // 기존 캔들 렌더러는 day xSlots=120 구조라 새 day series와 함께 그대로 사용 가능.
  if(chartMode==='candle'){paintChart(s,hover);return}

  const ctx=c.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2),
        w=Math.max(1,c.clientWidth),h=Math.max(1,c.clientHeight),
        pw=Math.round(w*dpr),ph=Math.round(h*dpr);
  if(c.width!==pw||c.height!==ph){c.width=pw;c.height=ph}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);

  const a=chartSeries(s),pad=20;
  if(!a.length)return;

  const prev=chartRange==='day'?v411PrevClose(s):null;
  const rawMin=Math.min(...a,...(prev!=null?[prev]:[]));
  const rawMax=Math.max(...a,...(prev!=null?[prev]:[]));
  const gap=Math.max(10,(rawMax-rawMin)*.14),min=rawMin-gap,max=rawMax+gap;

  // 1일은 전일종가 대비 색상. 장중에 시가보다 내려도 전일 대비 상승이면 빨간색.
  const up=chartRange==='day'?a.at(-1)>=prev:a.at(-1)>=a[0];
  const col=up?'#f04452':'#3182f6';

  // 장중 진행률을 실제 전체 장시간 폭에 반영.
  const xSlots=chartRange==='day'?CHART_RANGES.day.count:a.length;
  const x=i=>pad+i/Math.max(1,xSlots-1)*(w-pad*2);
  const y=v=>pad+(max-v)/(max-min||1)*(h-pad*2);

  ctx.strokeStyle='#f1f3f5';ctx.lineWidth=1;
  for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(0,i*h/4);ctx.lineTo(w,i*h/4);ctx.stroke()}

  ctx.beginPath();
  a.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));
  ctx.lineWidth=2.7;ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=col;ctx.stroke();

  chartAnnotations(ctx,s,a,x,y,w,h,col);

  if(hover>=0){
    const i=Math.max(0,Math.min(a.length-1,hover));
    ctx.setLineDash([4,4]);ctx.strokeStyle='#8b95a1';ctx.beginPath();
    ctx.moveTo(x(i),0);ctx.lineTo(x(i),h);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(x(i),y(a[i]),4,0,Math.PI*2);ctx.fill();
    let tip=$('.chart-tip');
    if(!tip){$('.chart-wrap').insertAdjacentHTML('beforeend','<div class="chart-tip"></div>');tip=$('.chart-tip')}
    tip.textContent=fmt(a[i])+'원';
  }else $('.chart-tip')?.remove();
};

bindChartPointer=function(s){
  const c=$('#chart'),wrap=$('.chart-wrap');if(!c||!wrap)return;
  const point=e=>{
    const r=c.getBoundingClientRect(),clientX=e.touches?.[0]?.clientX??e.clientX;
    const a=chartSeries(s);

/* ============ V42 — Extreme depth 실제 반영 + 시장속도 12x ============
   1) currentChange를 Extreme '크기'에 실제 사용
      - 방향확률은 변경하지 않음
      - 깊은 하락일수록 추가 하락 extreme의 거리만 연속적으로 보강
      - 깊은 상승은 동일 논리로 약하게 압축해 퍼센트 공간 비대칭 완화
      - 특정 -20/-30% 하드 트리거 없음
   2) MARKET_V9_SPEED 7.5 -> 12 (이후 V58에서 15로 상향)
      - 10분 플레이 체감을 기존 약 20분 수준에 가깝게 압축
   3) postMove / shock log1p / 체결보호 / ETF / 전일종가 표시 기준 유지
*/
function v42Clamp(x,a,b){return Math.max(a,Math.min(b,x));}

const v42ExtremeBase=v11ExtremeDrive;
v11ExtremeDrive=function v42DepthAwareExtreme(s,day,minute,currentChange=0){
  let ret=Number(v42ExtremeBase(s,day,minute,currentChange))||0;
  if(s?.isETF || ret===0)return ret;

  const cc=v42Clamp(Number(currentChange)||0,-.70,.90);

  // 가격공간 보정은 '현재 방향으로 더 뻗는 extreme'에만 적용.
  // 반등/되밀림의 방향확률 자체는 건드리지 않는다.
  if(ret<0 && cc<0){
    const depth=-cc;
    const mult=1.04 + Math.min(.55, depth*1.30);
    ret*=mult;
  }else if(ret>0 && cc>0){
    const height=cc;
    const mult=1 / (1 + Math.min(.30,height*.42));
    ret*=mult;
  }

  return v42Clamp(ret,-.00245,.00210);
};

<script>

   시장 가격/확률/체결 규칙은 변경하지 않는다.

// ---------- 1. 1일 차트 과거점 캐시 ----------
const V44_DAY_SERIES_CACHE=new Map();

v411DaySeries=function(s,count=CHART_RANGES.day.count){
  if(!s)return [];
  const now=Date.now(),bounds=v411SessionBounds(now),open=bounds.open,close=bounds.close;
  const prev=v411PrevClose(s,now);
  if(now<open)return [prev,prev];

  const end=Math.min(now,close);
  const progress=Math.max(0,Math.min(1,(end-open)/(close-open)));
  const lastSlot=Math.max(1,Math.min(count-1,Math.floor(progress*(count-1))));
  const used=Math.min(count,lastSlot+1);
  const dayKey=new Date(open).toDateString();
  const key=s.code+'|'+dayKey+'|'+count+'|'+lastSlot;

  let history=V44_DAY_SERIES_CACHE.get(key);
  if(!history){
    history=[];
    // 마지막 현재가 점은 캐시하지 않는다.
    for(let i=0;i<used-1;i++){
      const ms=open+(i/(count-1))*(close-open);
      history.push(fastVisualPriceAt(s,ms));
    }
    // 이전 슬롯 캐시는 같은 종목 기준으로 정리.
    if(V44_DAY_SERIES_CACHE.size>STOCKS.length*2){
      for(const k of V44_DAY_SERIES_CACHE.keys()){
        if(k.startsWith(s.code+'|') && k!==key)V44_DAY_SERIES_CACHE.delete(k);
      }
      if(V44_DAY_SERIES_CACHE.size>STOCKS.length*3)V44_DAY_SERIES_CACHE.clear();
    }
    V44_DAY_SERIES_CACHE.set(key,history);
  }
  return history.concat(quote(s).price);
};

const V45_QUOTE_TICK_CACHE = new Map();
