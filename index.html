/* 1) 저장 상태에 지급 기록 보존 */
const normalizeStateV5=normalizeState;
normalizeState=function(v){
  const out=normalizeStateV5(v);
  out.grants=(Array.isArray(v?.grants)?v.grants:[])
    .filter(g=>g&&typeof g.id==='string'&&Number.isFinite(+g.amount))
    .map(g=>({id:String(g.id),amount:Math.round(+g.amount),title:String(g.title||'').slice(0,60),message:String(g.message||'').slice(0,500),at:Number.isFinite(+g.at)?+g.at:Date.now(),acked:!!g.acked}))
    .slice(-200);
  out.grantCutoff=Number.isFinite(+v?.grantCutoff)?+v.grantCutoff:0;
  return out;
};

/* 2) 지급받은 현금은 수익이 아니라 원금 → 오늘 수익에서 제외 */
const dailyAccountPnlBase=dailyAccountPnl;
dailyAccountPnl=function(){
  const base=dailyAccountPnlBase(),start=new Date();start.setHours(0,0,0,0);
  const today=(state?.grants||[]).reduce((sum,g)=>sum+(+g.at>=start.getTime()?(+g.amount||0):0),0);
  return base-today;
};

/* 3) 거래내역에 지급 내역 함께 표시 */
openTradeLog=function(){
  const rows=[
    ...(state?.tradeLog||[]).map(x=>({kind:'trade',at:+x.at||0,x})),
    ...(state?.grants||[]).map(g=>({kind:'grant',at:+g.at||0,x:g}))
  ].sort((a,b)=>b.at-a.at);
  const html=rows.length?rows.map(r=>{
    if(r.kind==='grant'){
      const g=r.x,plus=g.amount>=0;
      return `<div class="log-row"><b class="tag-grant">${plus?'원화 지급':'원화 차감'} · ${escHtml(g.title||'관리자')}</b><b class="${plus?'gain':'down'}">${plus?'+':'-'}${fmt(Math.abs(g.amount))}원</b><small>${new Date(g.at).toLocaleString('ko-KR')}${g.message?' · '+escHtml(g.message):''}</small></div>`;
    }
    const x=r.x,s=STOCKS.find(v=>v.code===x.code);
    if(!s)return '';
    return `<div class="log-row"><b class="${x.type==='buy'?'gain':'down'}">${x.type==='buy'?'매수':'매도'} · ${escHtml(s.name)}</b><b>${fmt(x.price*x.qty)}원</b><small>${new Date(x.at).toLocaleString('ko-KR')} · ${fmt(x.price)}원 × ${fmt(x.qty)}주</small></div>`;
  }).join(''):'<div class="empty">아직 거래내역이 없어요.</div>';
  document.body.insertAdjacentHTML('beforeend',`<div class="overlay"><div class="sheet"><div class="sheet-head"><h2>거래내역</h2>${closeButton()}</div><div class="log-list">${html}</div></div></div>`);
};

/* 4) 지급 알림 팝업 */
function grantPopup(g){
  return new Promise(resolve=>{
    const plus=g.amount>=0;
    const el=document.createElement('div');
    el.className='grant-pop';
    el.innerHTML=`<div class="grant-card">
      <span class="grant-badge">${plus?'원화 지급':'원화 차감'}</span>
      <p class="grant-title">${escHtml(g.title||(plus?'관리자 지급금이 도착했어요':'관리자 정산 안내'))}</p>
      <p class="grant-amount ${plus?'':'minus'}">${plus?'+':'-'}${fmt(Math.abs(g.amount))}원</p>
      ${g.message?`<div class="grant-msg">${escHtml(g.message)}</div>`:''}
      <p class="grant-meta">${new Date(g.at).toLocaleString('ko-KR')} · 예수금에 자동 반영되었어요</p>
      <button class="primary" data-grant-ok>확인했어요</button>
    </div>`;
    el.addEventListener('click',e=>{
      if(!e.target.closest('[data-grant-ok]'))return;
      e.stopPropagation();
      el.remove();
      resolve();
    });
    document.body.append(el);
  });
}

/* 5) 지급 수신 */
const GrantWatch={
  started:false,showing:false,unsub:null,
  start(){
    if(this.started||!Store.online||!Store.db||!Store.uid||!state)return;
    this.started=true;
    if(!Number.isFinite(+state.grantCutoff)||+state.grantCutoff<=0){
      state.grantCutoff=(state.tradeLog?.length||state.nickname)?1:Date.now();
      Store.saveMe(userId,state);
    }
    this.unsub=Store.db.collection('grants').orderBy('createdAtMs','desc').limit(80)
      .onSnapshot(snap=>{
        const list=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(+a.createdAtMs||0)-(+b.createdAtMs||0));
        this.apply(list);
      },error=>console.warn('지급 수신 실패',error?.code||error?.message));
  },
  async apply(list){
    if(!state)return;
    let changed=false;
    for(const g of list){
      const amount=Math.round(+g.amount||0);
      if(!Number.isFinite(amount)||!amount)continue;
      const all=g.targets==='all',mine=all||(Array.isArray(g.targets)&&g.targets.includes(Store.uid));
      if(!mine)continue;
      if((state.grants||[]).some(x=>x.id===g.id))continue;
      const at=Number.isFinite(+g.createdAtMs)?+g.createdAtMs:Date.now();
      if(all&&at<(+state.grantCutoff||0))continue;
      state.cash=Math.max(0,Math.round((+state.cash||0)+amount));
      state.grants=[...(state.grants||[]),{id:g.id,amount,title:String(g.title||''),message:String(g.message||''),at,acked:false}].slice(-200);
      changed=true;
      this.report(g.id,amount);
    }
    if(changed){
      await Store.saveMe(userId,state);
      Store.pushMyScore(true);
      if(!selected&&!document.querySelector('.overlay'))render();
    }
    this.flush();
  },
  async report(id,amount){
    if(!Store.online||!Store.db||!Store.uid)return;
    try{
      await Store.db.collection('grants').doc(id).collection('claims').doc(Store.uid).set({
        uid:Store.uid,nickname:state?.nickname||'',amount,
        claimedAt:firebase.firestore.FieldValue.serverTimestamp()
      },{merge:true});
    }catch(error){console.warn('수령 기록 실패',error?.code||error?.message)}
  },
  async flush(){
    if(this.showing||!state)return;
    const pending=(state.grants||[]).filter(g=>!g.acked);
    if(!pending.length)return;
    if(document.querySelector('.overlay')){setTimeout(()=>this.flush(),1500);return}
    this.showing=true;
    for(const g of pending){
      await grantPopup(g);
      g.acked=true;
      await Store.saveMe(userId,state);
    }
    this.showing=false;
    if(!selected&&!document.querySelector('.overlay'))render();
  }
};
(function waitGrantReady(){

})();

/* ============ 일일 랭킹 전환 (시스템 날짜 기준, v7) ============ */
// 랭킹을 누적이 아니라 "오늘 하루" 손익 기준으로 바꾸고,
// 실시간 리스너 대신 화면이 랭킹 탭일 때만 구독해서 읽기 사용량을 크게 줄인다.
const normalizeStateV6=normalizeState;
normalizeState=function(v){
  const out=normalizeStateV6(v);
  out.dailyBaseKey=typeof v?.dailyBaseKey==='string'?v.dailyBaseKey:'';
  out.dailyBaseValue=Number.isFinite(+v?.dailyBaseValue)?+v.dailyBaseValue:0;
  out.rankingLoadedAt=Number.isFinite(+v?.rankingLoadedAt)?+v.rankingLoadedAt:0;
  return out;
};
function todayKey(d=new Date()){return ''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}
function ensureDailyBase(){
  const key=todayKey();
  if(!state)return key;
  if(state.dailyBaseKey!==key){
    state.dailyBaseKey=key;
    state.dailyBaseValue=Math.round(total());
    Store.saveMe(userId,state);
  }
  return key;
}
function dailyRankPnl(){ensureDailyBase();return Math.round(total())-Math.round(+state.dailyBaseValue||total())}
function dailyRankRate(){const base=Math.max(1,+state.dailyBaseValue||total());return dailyRankPnl()/base*100}

const SCORE_INTERVAL=25000; // 8초 → 25초: 점수 쓰기 빈도를 줄여 리스너로 퍼지는 읽기량도 함께 감소
Store.scheduleScore=function(force=false){
  if(!this.online||!state||!this.uid)return;
  const wait=Math.max(0,SCORE_INTERVAL-(Date.now()-this.lastPushAt));
  if(force||wait===0){clearTimeout(this.pushTimer);this.pushTimer=0;this.pushMyScore(true);return}
  if(!this.pushTimer)this.pushTimer=setTimeout(()=>{this.pushTimer=0;this.pushMyScore(true)},wait);
};
Store.pushMyScore=async function(force=false){
  if(!this.online||!state||!this.db||!this.uid||!state.nickname||state.nickname==='게스트')return false;
  if(this.pushPromise&&Date.now()-this.lastPushAt<500)return this.pushPromise;
  if(!force&&Date.now()-this.lastPushAt<SCORE_INTERVAL){this.scheduleScore();return false}
  this.lastPushAt=Date.now();
  const key=ensureDailyBase();
  this.pushPromise=this.db.collection('ranking_daily').doc(key).collection('scores').doc(this.uid).set({
    nickname:cleanNickname(state.nickname),
    totalValue:dailyRankPnl(),
    pnlRate:+dailyRankRate().toFixed(4),
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>true).catch(error=>{console.warn('일일 랭킹 저장 실패',error?.code||error?.message);return false})
    .finally(()=>{this.pushPromise=null});
  return this.pushPromise;
};
Store.removeMyScore=async function(){
  if(!this.online||!this.db||!this.uid)return;
  try{await this.db.collection('ranking_daily').doc(todayKey()).collection('scores').doc(this.uid).delete()}catch{}
};
// 기존엔 접속하자마자 전체 참가자 랭킹을 실시간 구독했는데(가장 큰 읽기 비용),
// 이제는 랭킹 탭을 보고 있을 때만 구독하도록 init()에서 그 부분을 제거한다.
Store.init=async function(){
  let legacyId='';
  try{legacyId=localStorage.getItem('mockstock:uid')||''}catch{}
  try{
    if(!window.firebase)throw new Error('Firebase SDK unavailable');
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const credential=firebase.auth().currentUser?{user:firebase.auth().currentUser}:await firebase.auth().signInAnonymously(),uid=credential.user.uid;
    this.uid=uid;
    this.db=firebase.firestore();
    this.online=true;
    try{
      const old=legacyId&&legacyId!==uid?localStorage.getItem('mockstock:'+legacyId):null,current=localStorage.getItem('mockstock:'+uid);
      if(old&&!current)localStorage.setItem('mockstock:'+uid,old);
      localStorage.setItem('mockstock:uid',uid);
    }catch{}
    userId=uid;
    return true;
  }catch(error){
    console.warn('Firebase 연결 실패',error?.code||error?.message);
    this.online=false;
    return false;
  }
};

// 랭킹은 실시간 구독 없이, 탭에 들어와도 "1시간에 한 번"만 조회한다.
// (새로고침/재접속과 무관하게 마지막 조회로부터 1시간이 지나야만 다시 불러옴)
// TOP 5 + 최하위 1명만 별도 쿼리로 가져와서 한 번에 최대 6건만 읽는다.
const RANKING_REFRESH_MS=60*60*1000; // 1시간
let lastOnRanking=false;
async function loadDailyRanking(force=false){
  if(!Store.online||!Store.db||!state)return;
  const key=ensureDailyBase();
  const now=Date.now();
  if(!force&&state.rankingLoadedAt&&(now-state.rankingLoadedAt)<RANKING_REFRESH_MS)return;
  try{
    const valid=x=>typeof x.nickname==='string'&&x.nickname.trim()&&x.nickname!=='게스트'&&Number.isFinite(x.totalValue)&&Number.isFinite(x.pnlRate);
    const base=Store.db.collection('ranking_daily').doc(key).collection('scores');
    const [topSnap,lastSnap]=await Promise.all([
      base.orderBy('totalValue','desc').limit(5).get(),
      base.orderBy('totalValue','asc').limit(1).get()
    ]);
    Store.rankingRows=topSnap.docs.map(doc=>({uid:doc.id,...doc.data()})).filter(valid);
    const lastDoc=lastSnap.docs[0];
    Store.rankingLast=(lastDoc&&!Store.rankingRows.some(x=>x.uid===lastDoc.id))?[{uid:lastDoc.id,...lastDoc.data()}].filter(valid):[];
    state.rankingLoadedAt=now;
    Store.saveMe(userId,state);
    if(view==='ranking'&&!selected&&!document.querySelector('.overlay'))render();
  }catch(error){console.warn('일일 랭킹 조회 실패',error?.code||error?.message)}
}
setInterval(()=>{
  if(!state||!Store.online||!Store.db)return;
  const onRanking=(view==='ranking');
  if(onRanking&&!lastOnRanking)loadDailyRanking(false); // 탭에 들어와도 1시간 안 지났으면 조회 안 함
  lastOnRanking=onRanking;
},700);
