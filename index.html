<script>
/* ============ V46 — scheduler/차트/검색 반응속도 최적화 ============
   기능·화면·시장 가격경로·확률·체결 규칙 변경 없음.
   V45의 1초 quote cache, V44의 차트/52주 cache 유지.

   핵심:
   - V45 liveLoop wrapper의 60fps rAF 재귀를 실제 저주기 scheduler로 차단
   - 상세 차트는 가격/범위/모드가 실제 바뀐 경우에만 redraw
   - hidden 상태에서는 scheduler 정지
   - 검색 결과 visibility는 IntersectionObserver로 추적
*/

// 1) V45가 호출하는 requestAnimationFrame 재귀를 liveLoop 실행 중에만 흡수.
//    다른 UI 애니메이션의 rAF는 건드리지 않는다.
let V46_IN_LIVE_LOOP=false;
let V46_NEXT_TIMER=0;
const V46_NATIVE_RAF=window.requestAnimationFrame.bind(window);

function v46ScheduleLive(delay=250){
  if(V46_NEXT_TIMER || document.hidden)return;
  V46_NEXT_TIMER=setTimeout(()=>{
    V46_NEXT_TIMER=0;
    if(document.hidden)return;
    V46_IN_LIVE_LOOP=true;
    try{ v45LiveLoopBase(performance.now()); }
    finally{ V46_IN_LIVE_LOOP=false; }
    v46ScheduleLive(250);
  },delay);
}

// liveLoop 전용 rAF 요청만 무시하고 timer scheduler가 다음 실행을 담당.
const V46_RAF_PROXY=window.requestAnimationFrame;
window.requestAnimationFrame=function(cb){
  if(V46_IN_LIVE_LOOP && (cb===liveLoop || cb?.name==='v45CoolLiveLoop')){
    return 0;
  }
  return V46_RAF_PROXY.call(window,cb);
};

// 기존 V45 liveLoop를 외부에서 호출해도 재귀 rAF 없이 1회만 수행.
liveLoop=function v46ScheduledLiveLoop(t){
  if(document.hidden)return;
  V46_IN_LIVE_LOOP=true;
  try{ v45LiveLoopBase(t||performance.now()); }
  finally{ V46_IN_LIVE_LOOP=false; }
};

// 2) 상세 차트: 같은 가격/같은 range/mode면 다시 canvas 전체 redraw하지 않음.
const v46DrawChartBase=drawChart;
let V46_CHART_SIG='';
drawChart=function(s,hover=-1){
  if(!s)return v46DrawChartBase(s,hover);
  // hover 중에는 즉시 그려야 포인터 UX 유지.
  if(hover>=0)return v46DrawChartBase(s,hover);
  const q=quote(s);
  const sig=[s.code,chartRange,chartMode,q.price].join('|');
  if(sig===V46_CHART_SIG)return;
  V46_CHART_SIG=sig;
  return v46DrawChartBase(s,hover);
};

// 화면 전환/종목 선택 후에는 반드시 새로 그리도록 bind 때 signature 초기화.
const v46BindBase=bind;
bind=function(){
  V46_CHART_SIG='';
  v46BindBase();
};

// 3) 검색 결과도 getBoundingClientRect 전수검사 대신 observer 사용.
const V46_SEARCH_VISIBLE=new Set();
let V46_SEARCH_OBSERVER=null;
if('IntersectionObserver' in window){
  V46_SEARCH_OBSERVER=new IntersectionObserver(entries=>{
    for(const e of entries){
      if(e.isIntersecting)V46_SEARCH_VISIBLE.add(e.target);
      else V46_SEARCH_VISIBLE.delete(e.target);
    }
  },{root:null,rootMargin:'180px 0px',threshold:0});
}
function v46ObserveSearchRows(){
  if(!V46_SEARCH_OBSERVER)return;
  V46_SEARCH_OBSERVER.disconnect();
  V46_SEARCH_VISIBLE.clear();
  document.querySelectorAll('[data-search-stock]').forEach(el=>V46_SEARCH_OBSERVER.observe(el));
}
const v46RefreshSearchBase=refreshSearchQuotes;
refreshSearchQuotes=function(){
  if(!V46_SEARCH_OBSERVER)return v46RefreshSearchBase();
  if(!V46_SEARCH_VISIBLE.size){
    v46ObserveSearchRows();
    return;
  }
  for(const el of [...V46_SEARCH_VISIBLE]){
    if(!el.isConnected){V46_SEARCH_VISIBLE.delete(el);continue}
    const s=V43_STOCK_BY_CODE.get(el.dataset.searchStock);
    const box=el.querySelector('.price'),small=box?.querySelector('small');
    if(!s||!box)continue;
    const q=quote(s),pt=`${fmt(q.price)}원`;
    if(box.firstChild?.textContent!==pt)box.firstChild.textContent=pt;
    if(small){
      const st=pct(q.change);
      if(small.textContent!==st)small.textContent=st;
      small.className=q.change<0?'down':'gain';
    }
  }
};

// 4) background에서 scheduler 완전 정지, 복귀 때 한 번 즉시 갱신.
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    if(V46_NEXT_TIMER){clearTimeout(V46_NEXT_TIMER);V46_NEXT_TIMER=0}
  }else{
    V46_CHART_SIG='';
    try{refreshLive()}catch(e){}
    try{if(selected)drawChart(selected)}catch(e){}
    v46ScheduleLive(80);
  }
},{passive:true});

// 최초 scheduler 시작.
v46ScheduleLive(80);

  v44v45CachesPreserved:true

<script>
/* ============ V47 — 탭 전환 지연 집중 최적화 ============
   기능/화면/시장 규칙 변경 없음.
   영상에서 보이는 0.5~1초 탭 전환 지연의 핵심 원인:
   discover()/watch 진입 때 300종목 quote를 동기 계산하고 HTML을 만든 뒤
   첫 화면이 나타나는 구조.

   개선:
   1) 발견용 전체 quote snapshot을 idle chunk로 미리 계산.
   2) 발견/관심 render 시 최근 snapshot을 즉시 재사용.
   3) stale snapshot이어도 화면은 즉시 열고 뒤에서 새 snapshot 준비.
   4) nav 클릭 시 active 상태를 먼저 paint한 다음 render.
*/

const V47_DISCOVER_SNAPSHOT=new Map();
let V47_SNAPSHOT_AT=0;
let V47_BUILDING=false;
let V47_BUILD_TOKEN=0;
const V47_REAL_QUOTE=quote;

function v47Idle(cb){
  if('requestIdleCallback' in window)
    return requestIdleCallback(cb,{timeout:80});
  return setTimeout(()=>cb({timeRemaining:()=>8,didTimeout:true}),0);
}

function v47BuildSnapshot(force=false){
  if(document.hidden||V47_BUILDING)return;
  if(!force && V47_DISCOVER_SNAPSHOT.size===STOCKS.length && Date.now()-V47_SNAPSHOT_AT<3500)return;
  V47_BUILDING=true;
  const token=++V47_BUILD_TOKEN;
  const fresh=new Map();
  let i=0;

  const step=deadline=>{
    if(token!==V47_BUILD_TOKEN){V47_BUILDING=false;return}
    const started=performance.now();
    // 한 task에서 너무 오래 막지 않도록 최대 약 5ms / 14종목.
    let n=0;
    while(i<STOCKS.length && n<14 && (deadline?.timeRemaining?.()>1 || performance.now()-started<5)){
      const s=STOCKS[i++];
      try{fresh.set(s.code,V47_REAL_QUOTE(s))}catch(e){}
      n++;
    }
    if(i<STOCKS.length){
      v47Idle(step);
    }else{
      V47_DISCOVER_SNAPSHOT.clear();
      for(const [k,v] of fresh)V47_DISCOVER_SNAPSHOT.set(k,v);
      V47_SNAPSHOT_AT=Date.now();
      V47_BUILDING=false;
    }
  };
  v47Idle(step);
}

// 앱이 떠 있는 동안 처음 한 번 미리 준비.
setTimeout(()=>v47BuildSnapshot(true),120);

// 현재 최종 discover를 감싸서 render 순간에는 precomputed quote 사용.
const v47DiscoverBase=discover;
discover=function(watch=false){
  const age=Date.now()-V47_SNAPSHOT_AT;
  const usable=V47_DISCOVER_SNAPSHOT.size>0 && age<12000;
  if(!usable){
    // snapshot이 아직 없으면 다음 진입을 위해 백그라운드 준비.
    v47BuildSnapshot(true);
    return v47DiscoverBase(watch);
  }

  const real=quote;
  quote=function(s){
    return V47_DISCOVER_SNAPSHOT.get(s?.code)||real(s);
  };
  try{
    return v47DiscoverBase(watch);
  }finally{
    quote=real;
    rawQuote=quote;
    // 3.5초 이상 된 snapshot은 화면을 막지 않고 뒤에서 갱신.
    if(age>3500)setTimeout(()=>v47BuildSnapshot(true),0);
  }
};

// 화면 전환 후 다음 discover 진입을 미리 준비.
const v47RenderBase=render;
render=function(){
  v47RenderBase();
  if(view!=='discover'&&view!=='watch'){
    setTimeout(()=>v47BuildSnapshot(false),50);
  }
};

// nav는 클릭 반응을 먼저 화면에 보여주고 무거운 render는 다음 task로 넘김.
const v47BindBase=bind;
bind=function(){
  v47BindBase();

  document.querySelectorAll('.nav [data-view]').forEach(btn=>{
    btn.onclick=e=>{
      e.preventDefault();
      const next=btn.dataset.view;
      if(!next||next===view)return;

      // 즉각적인 터치 피드백.
      document.querySelectorAll('.nav [data-view]').forEach(x=>x.classList.toggle('active',x===btn));
      view=next;

      // browser가 active 상태를 먼저 paint할 시간을 준다.
      requestAnimationFrame(()=>{
        setTimeout(()=>{
          render();
        },0);
      });
    };
  });
};

// 관심 탭은 원본 코드가 전체 300종목 quote 후 필터하는 구조.
// snapshot이 있으면 계산비용은 O(1) lookup으로 줄어든다.
// 관심 종목이 없으면 다음 진입을 위해 snapshot만 갱신하고 즉시 유지.

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    V47_BUILD_TOKEN++;
    V47_BUILDING=false;
  }else{
    setTimeout(()=>v47BuildSnapshot(false),100);
  }
},{passive:true});

window.__marketV47={
  version:47,
  focus:'instant-navigation',
  marketRulesChanged:false,
  uiChanged:false,
  discoverQuotePrewarm:true,
  chunkSize:14,
  snapshotFreshMs:3500,
  snapshotMaxUseMs:12000,
  navPaintBeforeRender:true
};
</script>


<script>
/* ============ V48 — V29 근본 캐시 복원 + 거래량/KOSPI 복구 ============
   시장 가격 결과/확률/체결 규칙 변경 없음.

   1) V29 v9RawPriceAt 최종 tick cache 복원
      - 같은 종목/같은 game tick 가격을 다시 minute 0부터 재생하지 않음
      - 반환값은 원 함수와 동일한 결과를 그대로 저장/재사용
   2) V29 OPEN/CLOSE cache 상한 관리
   3) 거래량 rnd(seed)() 누락은 원본 정의부에서 수정
   4) 최종 refreshLive 뒤 KOSPI를 gameKospiQuote() 값으로 다시 동기화
*/

// ---------- 1. V29 raw tick exact cache ----------
const V48_RAW_TICK_CACHE=new Map();
const V48_RAW_BASE=v9RawPriceAt;
let V48_LAST_RAW_DAY=null;

v9RawPriceAt=function v48CachedRawPriceAt(s,t=marketTick()){
  if(!s)return V48_RAW_BASE(s,t);
  const day=Math.floor(t/390);
  const key=s.code+'|'+t;

  // 오래된 게임일 데이터가 무한 누적되지 않게 새 day 진입 시 정리.
  if(V48_LAST_RAW_DAY!==day){
    V48_LAST_RAW_DAY=day;
    if(V48_RAW_TICK_CACHE.size>5000)V48_RAW_TICK_CACHE.clear();
  }

  const hit=V48_RAW_TICK_CACHE.get(key);
  if(hit)return hit;

  const q=V48_RAW_BASE(s,t);
  V48_RAW_TICK_CACHE.set(key,q);

  // 현재/인접 틱 위주로 충분히 유지하면서 무한 증가 방지.
  if(V48_RAW_TICK_CACHE.size>6500){
    const remove=V48_RAW_TICK_CACHE.size-4800;
    let n=0;
    for(const k of V48_RAW_TICK_CACHE.keys()){
      V48_RAW_TICK_CACHE.delete(k);
      if(++n>=remove)break;
    }
  }
  return q;
};

// priceAt이 최종 raw cache를 반드시 통과하도록 라우터 재확인.
priceAt=function(s,t=marketTick()){
  return s?.isETF ? etfDisplayedAt(s,t) : v9RawPriceAt(s,t);
};

// ---------- 2. V29 open/close cache upper bound ----------
function v48TrimV29Caches(){
  const trim=(m,max,keep)=>{
    if(!m||m.size<=max)return;
    const cut=m.size-keep;
    let n=0;
    for(const k of m.keys()){
      m.delete(k);
      if(++n>=cut)break;
    }
  };
  trim(V29_OPEN_CACHE,5000,3500);
  trim(V29_CLOSE_CACHE,5000,3500);
  trim(V29_SCALE_CACHE,1200,900);
}
let V48_CACHE_TRIM_TICK=0;

// ---------- 3. KOSPI live overwrite guard ----------
function v48RefreshKospi(){
  try{
    const k=gameKospiQuote();
    const iq=document.querySelector('.index b');
    if(iq){
      const cls=k.change<0?'down':'gain';
      const txt=`${k.level.toFixed(2)} ${pct(k.change)}`;
      if(iq.textContent!==txt)iq.textContent=txt;
      iq.className=cls;
    }

    // 발견 화면의 방향 표시도 같은 KOSPI를 사용.
    const strip=[...document.querySelectorAll('.strip>div')].find(el=>el.textContent.trim().startsWith('코스피'));
    const b=strip?.querySelector('b');
    if(b){
      const label=Math.abs(k.change)<.03?'보합':k.change>0?'상승':'하락';
      if(b.textContent!==label)b.textContent=label;
      b.className=k.change<0?'down':'gain';
    }
  }catch(e){}
}

const V48_REFRESH_BASE=refreshLive;
refreshLive=function(){
  const out=V48_REFRESH_BASE();
  v48RefreshKospi();

  // 약 30초에 한 번만 캐시 상한 정리.
  const now=Date.now();
  if(now-V48_CACHE_TRIM_TICK>30000){
    V48_CACHE_TRIM_TICK=now;
    v48TrimV29Caches();
  }
  return out;
};

// header가 처음 그려질 때도 KOSPI는 이미 V14 gameKospiQuote를 사용하므로 유지.
// 1초 뒤 refresh에서 옛 삼성전자 임시식으로 되돌아가는 것만 위에서 차단한다.

// 기존 성능 prewarm(V47)은 이제 V48 raw cache도 같이 데우므로 그대로 활용.
try{
  V48_RAW_TICK_CACHE.clear();
  V23_QUOTE_CACHE?.clear?.();
  V43_FINAL_QUOTE_CACHE?.clear?.();
  V45_QUOTE_TICK_CACHE?.clear?.();
}catch(e){}

window.__marketV48={
  version:48,
  focus:'core-price-cache-volume-kospi',
  marketRulesChanged:false,
  exactRawTickCache:true,
  v29CacheBounded:true,
  volumeRndInvocationFixed:true,
  kospiLiveUsesGameIndex:true,
  v47PrewarmPreserved:true
};

<script>
/* ============ V49 — 증분 가격엔진 + KOSPI 캐시 + 최근 1시간 랭킹 ============
   [성능]
   - v29RawWithOpen()을 결과 동일한 증분 상태 캐시로 교체.
   - 새 틱마다 minute 0부터 재생하지 않고 마지막 계산 minute 다음부터 이어서 계산.
   - 과거 minute 요청은 저장된 동일 가격을 즉시 반환.
   - KOSPI는 2초 스냅샷 캐시.

   [랭킹]
   - 총자산 랭킹 대신 "직전 약 1시간 수익률" 순위.
   - 화면에는 최근 1시간 수익금 + 수익률을 함께 표시.
   - equityHistory에 principal을 추가해 보상/관리자 지급 등 원금변동의 영향을 점차 제외.
   - 기존 ranking 문서의 totalValue/pnlRate는 관리자/호환용으로 그대로 유지.
   - hourlyPnl/hourlyRate/hourlyPeriodMin만 추가.
*/

// ------------------------------------------------------------------
// 1) V29 EXACT incremental state cache
// ------------------------------------------------------------------
const V49_PATH_STATE_CACHE=new Map();
const V49_PATH_STATE_MAX=700;

function v49PathKey(s,day,open){
  // 종목/게임일마다 open은 결정론적. 혹시 다른 open이 들어오면 별도 상태로 분리.
  return s.code+'|'+day+'|'+Number(open).toPrecision(12);
}
function v49TouchPathState(key,state){
  // Map insertion order 기반 작은 LRU.
  V49_PATH_STATE_CACHE.delete(key);
  V49_PATH_STATE_CACHE.set(key,state);
  while(V49_PATH_STATE_CACHE.size>V49_PATH_STATE_MAX){
    const k=V49_PATH_STATE_CACHE.keys().next().value;
    V49_PATH_STATE_CACHE.delete(k);
  }
}

const V49_RAW_WITH_OPEN_BASE=v29RawWithOpen;
v29RawWithOpen=function v49IncrementalRawWithOpen(s,day,minute,open){
  minute=Math.max(0,Math.min(389,Math.floor(+minute||0)));
  const key=v49PathKey(s,day,open);
  let st=V49_PATH_STATE_CACHE.get(key);

  if(!st){
    st={
      open:+open,
      last:-1,
      p:+open,
      center:+open,
      slumpUntil:-1,
      prices:new Float64Array(390),
      filled:new Uint8Array(390)
    };
  }

  // 이미 정확히 계산된 과거 tick.
  if(st.filled[minute]){
    v49TouchPathState(key,st);
    return st.prices[minute];
  }

  // last+1부터 필요한 minute까지만 원래 V29 loop와 완전히 동일하게 진행.
  let p=st.p,center=st.center,slumpUntil=st.slumpUntil;
  for(let i=st.last+1;i<=minute;i++){
    const reg=v9Regime(s,day,i),
          mom=v9Momentum(s,day,i),
          vol=v9Volatility(s,day,i),
          act=v11Activity(s,day,i),
          shock=v9Shock(s,day,i);

    if(shock.ret){
      const shockLog=Math.log1p(Math.max(-.95,shock.ret));
      p*=Math.exp(shockLog);
      center*=Math.exp(shockLog*.78);
      if(shock.slump)slumpUntil=Math.max(slumpUntil,i+10+Math.floor(v9Unit(s.code,day,i,'slump')*21));
    }

    const slumpBias=i<slumpUntil?-.000045:0;
    const sigma=v66MarketSigma(p,.00032*vol*act.mult);
    const noise=v9Normal(s.code,day,i,'idio')*sigma;
    const currentChange=p/open-1;
    const extreme=v11ExtremeDrive(s,day,i,currentChange);
    const post=v11PostMove(s,day,i,currentChange);

    let ret=(reg.bias+mom+slumpBias)*(.72+act.mult*.34)
      +v9MarketImpulse(day,i)*.28
      +v9SectorImpulse(s,day,i)*.32
      +noise+extreme+post;

    center*=Math.exp((reg.bias+slumpBias)*.25);
    const gap=Math.log(Math.max(1,center)/Math.max(1,p));
    ret+=Math.max(-.000035,Math.min(.000035,gap*.008));
    ret=v70EnsureCumulativeMove(s,day,i,p,ret,reg,mom);
    ret=Math.max(-.012,Math.min(.012,ret));
    p*=Math.exp(ret);
    p=Math.max(open*.10,Math.min(open*2.20,p));

    st.prices[i]=p;
    st.filled[i]=1;
  }

  st.last=Math.max(st.last,minute);
  st.p=p;st.center=center;st.slumpUntil=slumpUntil;
  v49TouchPathState(key,st);
  return st.prices[minute];
};

// V48의 exact raw-tick cache도 유지되며, miss일 때만 위 증분 엔진까지 들어간다.

// ------------------------------------------------------------------
// 2) KOSPI 2-second snapshot cache
// ------------------------------------------------------------------
const V49_KOSPI_CACHE=new Map();
const V49_GAME_KOSPI_BASE=gameKospiQuote;
gameKospiQuote=function v49CachedGameKospiQuote(ms=Date.now()){
  const slot=Math.floor((+ms||Date.now())/2000);
  const t=sessionTick(ms);
  const key=slot+'|'+t+'|'+(marketSessionInfo(ms).open?1:0);
  const hit=V49_KOSPI_CACHE.get(key);
  if(hit)return hit;
  const q=V49_GAME_KOSPI_BASE(ms);
  V49_KOSPI_CACHE.clear(); // 현재 스냅샷 1개만 유지
  V49_KOSPI_CACHE.set(key,q);
  return q;
};

try{
  V48_RAW_TICK_CACHE?.clear?.();
  V49_PATH_STATE_CACHE.clear();
  V49_KOSPI_CACHE.clear();
}catch(e){}

window.__marketV49={
  version:49,
  marketRulesChanged:false,
  incrementalV29Path:true,
  exactSameLoopFormula:true,
  kospiCacheMs:2000
};

<script>
/* ============ RKV2 — 총자산(평가금액) 기준 준실시간 랭킹 (폴링 방식) ============
   문제의식: 예전 실시간 리스너(onSnapshot) 방식은 "누군가 한 명만 써도
   구독 중인 유저 전원에게 스냅샷이 재전송"되는 구조라 읽기 사용량이
   (쓰기 횟수 × 동시 접속자 수)로 곱연산처럼 불어나서 무료 한도를 금방 소모했다.

   개선 방향:
   - 실시간 구독(onSnapshot) 사용 안 함. 대신 "랭킹 탭을 보고 있을 때만,
     일정 주기로 1회씩" 조회한다 (읽기 = 그때그때 TOP N개, 곱연산 없음).
   - 기존 ranking/{uid} 문서의 totalValue/pnlRate 필드를 그대로 사용 —
     새 컬렉션/스키마 변경 없이 바로 적용 가능.
   - 랭킹 탭 진입 시 즉시 1회 조회 + 이후 RKV2_POLL_MS(10분) 간격으로 자동 갱신,
     화면이 안 보이거나(document.hidden) 다른 탭이면 폴링 자체를 하지 않음.
   - 본인 점수 쓰기(SCORE_PUSH_INTERVAL_MS)도 동일하게 10분으로 맞춰뒀다 —
     어차피 내 점수가 10분에 한 번만 갱신되니 그보다 자주 조회해봐야 의미가 없다.
   - 수동 새로고침 버튼도 제공해 필요할 때 유저가 직접 최신화 가능.

   비용 감각(참고용 추정치, 무료 한도 하루 읽기 50,000회 기준):
   - TOP 10, 10분 간격일 때: 유저 1명이 랭킹 탭을 5분간 보고 있으면
     보통 1회 조회(진입 시 1회, 5분은 다음 폴링 전이라 추가 조회 없음) × 10명
     = 읽기 10회 안팎. 250명이 그렇게 하루 여러 번 들어와도 여유롭게 무료 한도 안.
   - TOP N을 늘리면(예: 10→20) 조회 1회당 비용이 그만큼 배로 늘고,
     간격을 줄이면(예: 10분→1분) 같은 시간 동안 조회 횟수가 늘어난다.
     즉 TOP N과 간격 둘 다 비용에 선형으로 영향을 준다 — 아래 두 상수로 조절.
*/
const RKV2_RANK_TOPN=10;         // TOP 몇 명까지 보여줄지 — 늘릴수록 조회 1회당 읽기 비용 ↑
const RKV2_POLL_MS=10*60*1000;   // 자동 갱신 간격(10분) — 줄일수록 시간당 조회 횟수 ↑, 본인 점수 쓰기 주기(SCORE_PUSH_INTERVAL_MS)와 맞춰둠

Store.rkv2Rows=Store.rkv2Rows||[];
Store.rkv2LoadedAt=0;
Store.rkv2Loading=false;

async function rkv2LoadRanking(force=false){
  if(!Store.online||!Store.db||Store.rkv2Loading)return;
  if(!force&&Store.rkv2LoadedAt&&Date.now()-Store.rkv2LoadedAt<RKV2_POLL_MS)return;
  Store.rkv2Loading=true;
  try{
    const snap=await Store.db.collection('ranking')
      .orderBy('totalValue','desc')
      .limit(RKV2_RANK_TOPN)
      .get();
    Store.rkv2Rows=snap.docs.map((d,i)=>{
      const x=d.data()||{};
      return {uid:d.id,nickname:String(x.nickname||''),totalValue:+x.totalValue||0,pnlRate:+x.pnlRate||0,rank:i+1};
    }).filter(x=>x.nickname&&x.nickname!=='게스트');
    Store.rkv2LoadedAt=Date.now();
  }catch(e){
    console.warn('총자산 랭킹 조회 실패',e?.code||e?.message);
  }finally{
    Store.rkv2Loading=false;
    if(view==='ranking'&&!selected&&!document.querySelector('.overlay'))render();
  }
}

ranking=function(){return Store.rkv2Rows.map(r=>({...r,me:r.uid===Store.uid}))};

// V74: 상대시간("N분 전") 표기는 절대시간 표기(rkv2SessionLabel)로 대체되어 더 이상 쓰지 않음.
// 장 시작(08:00)+10분인 08:10부터 마감(23:30)까지
// 10분 단위로 정확히 스냅된 "HH:MM 기준" 절대 시각을 보여준다.
// 08:10 이전(자정~08:10)에는 전날 마지막 스냅인 23:30을 그대로 유지해서 보여준다.
function rkv2SessionLabel(ms=Date.now()){
  const d=new Date(ms),minutesNow=d.getHours()*60+d.getMinutes();
  const firstMark=MARKET_OPEN_MIN+10; // 08:10
  const lastMark=MARKET_CLOSE_MIN;    // 23:30
  let snapped;
  if(minutesNow<firstMark||minutesNow>=lastMark)snapped=lastMark; // 08:10 이전 또는 23:30 이후 → 23:30 유지
  else snapped=firstMark+Math.floor((minutesNow-firstMark)/10)*10;
  const hh=String(Math.floor(snapped/60)).padStart(2,'0'),mm=String(snapped%60).padStart(2,'0');
  return `${hh}:${mm} 기준`;
}

ranks=function(){
  const rows=ranking();
  const status=`<span class="live-status ${Store.online?'online':''}"><i></i>${Store.online?'서버 연결됨':'연결 확인 필요'}</span>`;
  const meInList=rows.find(r=>r.me);
  const sessionLabel=rkv2SessionLabel();

  const row=(r,i)=>`<div class="rankrow ${r.me?'me':''}">
    <b>${i<3?['🥇','🥈','🥉'][i]:i+1}</b>
    <div><b>${r.nickname}</b>${r.me?' <small>나</small>':''}</div>
    <div class="price">${sign(r.totalValue)}원
      <small class="${r.pnlRate<0?'down':'gain'}">${pct(r.pnlRate)}</small>
    </div>
  </div>`;

  return shell(`${header('랭킹')}
    <div class="between"><h2>총자산 랭킹</h2>${status}</div>
    <div class="eyebrow">${sessionLabel}</div>
    <div class="ranking-me">
      <span class="eyebrow">나의 평가금액${meInList?` · TOP ${meInList.rank}`:''}</span>
      <h2>${sign(Math.round(total()))}원</h2>
      <b class="${accountRate()<0?'down':'gain'}">${pct(accountRate())}</b>
    </div>
    <div class="between"><h2>TOP ${RKV2_RANK_TOPN}</h2></div>
    ${rows.length?rows.map(row).join(''):`<div class="ranking-empty">${Store.rkv2Loading?'랭킹을 불러오는 중이에요.':'아직 등록된 참가자가 없어요.'}</div>`}
  `,'ranking');
};

const RKV2_BIND_BASE=bind;
bind=function(){
  RKV2_BIND_BASE();
};

// 1초마다 "체크"만 할 뿐 네트워크 비용은 없음. 실제 조회는
// rkv2LoadRanking 내부의 RKV2_POLL_MS 스로틀이 지날 때만 발생한다.
let RKV2_LAST_VIEW=view;
setInterval(()=>{
  if(document.hidden)return;
  if(view==='ranking'){
    if(RKV2_LAST_VIEW!=='ranking')rkv2LoadRanking(true);
    else rkv2LoadRanking(false);
  }
  RKV2_LAST_VIEW=view;
},1000);

window.__rankingRKV2={
  rankingMode:'poll-total-value',
  realtimeListener:false,
  pollMs:RKV2_POLL_MS,
  topN:RKV2_RANK_TOPN,
  scorePushIntervalMs:SCORE_PUSH_INTERVAL_MS
};
</script>


<script>
/* ============ V51 — 관리자 주식 지급 수신 ============
   - 관리자 stock_grants 문서 수신
   - createdAtMs 시점의 모의시장가를 취득가로 확정
   - 동일 지급 중복 수령 방지(claims/{uid})
   - 보유주식에 자동 합산, 팝업은 1회만 표시
   - 지급가가 평균매입가에 반영되므로 지급 자체는 투자수익으로 잡히지 않음
*/
const V51_NORMALIZE_BASE=normalizeState;
normalizeState=function(v){
  const out=V51_NORMALIZE_BASE(v);
  out.stockGrants=(Array.isArray(v?.stockGrants)?v.stockGrants:[])
    .filter(g=>g&&typeof g.id==='string'&&typeof g.stockCode==='string'&&Number.isFinite(+g.qty))
    .map(g=>({
      id:String(g.id),stockCode:String(g.stockCode),stockName:String(g.stockName||''),
      qty:Math.max(1,Math.floor(+g.qty)),grantPrice:Math.max(1,Math.round(+g.grantPrice||1)),
      title:String(g.title||'').slice(0,60),message:String(g.message||'').slice(0,500),
      at:Number.isFinite(+g.at)?+g.at:Date.now(),acked:!!g.acked
    })).slice(-200);
  out.stockGrantCutoff=Number.isFinite(+v?.stockGrantCutoff)?+v.stockGrantCutoff:0;
  return out;
};

function v51StockGrantPopup(g){
  return new Promise(resolve=>{
    const el=document.createElement('div');
    el.className='grant-pop';
    el.innerHTML=`<div class="grant-card">
      <span class="grant-badge">주식 지급</span>
      <p class="grant-title">${escHtml(g.title||'관리자 주식 보상이 도착했어요')}</p>
      <p class="grant-amount">${escHtml(g.stockName)} ${fmt(g.qty)}주</p>
      <p class="grant-meta">지급가 ${fmt(g.grantPrice)}원 · 지급 시각 시장가 기준</p>
      ${g.message?`<div class="grant-msg">${escHtml(g.message)}</div>`:''}
      <p class="grant-meta">${new Date(g.at).toLocaleString('ko-KR')} · 보유주식에 자동 반영되었어요</p>
      <button class="primary" data-stock-grant-ok>확인했어요</button>
    </div>`;
    el.addEventListener('click',e=>{
      if(!e.target.closest('[data-stock-grant-ok]'))return;
      e.stopPropagation();el.remove();resolve();
    });
    document.body.append(el);
  });
}

const StockGrantWatch={
  started:false,showing:false,unsub:null,
  start(){
    if(this.started||!Store.online||!Store.db||!Store.uid||!state)return;
    this.started=true;
    if(!Number.isFinite(+state.stockGrantCutoff)||+state.stockGrantCutoff<=0){
      state.stockGrantCutoff=(state.tradeLog?.length||state.nickname)?1:Date.now();
      Store.saveMe(userId,state);
    }
    this.unsub=Store.db.collection('stock_grants').orderBy('createdAtMs','desc').limit(80)
      .onSnapshot(snap=>{
        const list=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(+a.createdAtMs||0)-(+b.createdAtMs||0));
        this.apply(list);
      },error=>console.warn('주식 지급 수신 실패',error?.code||error?.message));
  },
  async apply(list){
    if(!state)return;
    let changed=false;
    for(const g of list){
      const qty=Math.floor(+g.qty||0),code=String(g.stockCode||'');
      if(qty<1||!code)continue;
      const all=g.targets==='all',mine=all||(Array.isArray(g.targets)&&g.targets.includes(Store.uid));
      if(!mine)continue;
      if((state.stockGrants||[]).some(x=>x.id===g.id)){this.ensureClaim(g);continue}
      const at=Number.isFinite(+g.createdAtMs)?+g.createdAtMs:Date.now();
      if(all&&at<(+state.stockGrantCutoff||0))continue;
      const s=STOCKS.find(x=>x.code===code);
      if(!s)continue;

      // 지급문서 생성 시각의 결정론적 모의시장가.
      const grantPrice=Math.max(1,Math.round(fastVisualPriceAt(s,at)/10)*10);
      const reserved=await this.reserve(g,grantPrice);
      if(!reserved)continue;

      const h=state.holdings[s.code]||{qty:0,avg:0};
      const oldQty=Math.max(0,+h.qty||0),oldAvg=Math.max(0,+h.avg||0);
      h.avg=(oldAvg*oldQty+grantPrice*qty)/Math.max(1,oldQty+qty);
      h.qty=oldQty+qty;
      state.holdings[s.code]=h;

      state.stockGrants=[...(state.stockGrants||[]),{
        id:g.id,stockCode:s.code,stockName:s.name,qty,grantPrice,
        title:String(g.title||''),message:String(g.message||''),at,acked:false
      }].slice(-200);
      changed=true;
    }
    if(changed){
      await Store.saveMe(userId,state);
      try{await recordEquity(true)}catch(e){}
      Store.pushMyScore(true);
      if(!selected&&!document.querySelector('.overlay'))render();
    }
    this.flush();
  },
  async reserve(g,grantPrice){
    if(!Store.online||!Store.db||!Store.uid)return false;
    try{
      const ref=Store.db.collection('stock_grants').doc(g.id).collection('claims').doc(Store.uid);
      return await Store.db.runTransaction(async tx=>{
        const snap=await tx.get(ref);
        if(snap.exists)return false;
        tx.set(ref,{
          uid:Store.uid,nickname:state?.nickname||'',
          stockCode:String(g.stockCode||''),stockName:String(g.stockName||''),
          qty:Math.floor(+g.qty||0),grantPrice:Math.round(grantPrice),
          claimedAt:firebase.firestore.FieldValue.serverTimestamp()
        });
        return true;
      });
    }catch(error){console.warn('주식 지급 중복 확인 실패',error?.code||error?.message);return false}
  },
  async ensureClaim(g){
    if(!Store.online||!Store.db||!Store.uid)return;
    const local=(state.stockGrants||[]).find(x=>x.id===g.id);
    if(!local)return;
    try{
      const ref=Store.db.collection('stock_grants').doc(g.id).collection('claims').doc(Store.uid);
      await Store.db.runTransaction(async tx=>{
        const snap=await tx.get(ref);
        if(!snap.exists)tx.set(ref,{
          uid:Store.uid,nickname:state?.nickname||'',stockCode:local.stockCode,
          stockName:local.stockName,qty:local.qty,grantPrice:local.grantPrice,
          claimedAt:firebase.firestore.FieldValue.serverTimestamp()
        });
      });
    }catch(error){console.warn('기존 주식 지급 기록 확인 실패',error?.code||error?.message)}
  },
  async flush(){
    if(this.showing||!state)return;
    const pending=(state.stockGrants||[]).filter(g=>!g.acked);
    if(!pending.length)return;
    if(document.querySelector('.overlay')){setTimeout(()=>this.flush(),1500);return}
    this.showing=true;
    for(const g of pending){
      await v51StockGrantPopup(g);
      g.acked=true;
      await Store.saveMe(userId,state);
    }
    this.showing=false;
    if(!selected&&!document.querySelector('.overlay'))render();
  }
};

// 거래내역에 관리자 주식 지급도 표시.
const V51_OPEN_TRADE_LOG_BASE=openTradeLog;
openTradeLog=function(){
  const rows=[
    ...(state?.tradeLog||[]).map(x=>({kind:'trade',at:+x.at||0,x})),
    ...(state?.grants||[]).map(g=>({kind:'grant',at:+g.at||0,x:g})),
    ...(state?.stockGrants||[]).map(g=>({kind:'stockGrant',at:+g.at||0,x:g}))
  ].sort((a,b)=>b.at-a.at);
  const html=rows.length?rows.map(r=>{
    if(r.kind==='stockGrant'){
      const g=r.x;
      return `<div class="log-row"><b class="tag-grant">주식 지급 · ${escHtml(g.stockName)}</b><b>${fmt(g.qty)}주</b><small>${new Date(g.at).toLocaleString('ko-KR')} · 지급가 ${fmt(g.grantPrice)}원${g.message?' · '+escHtml(g.message):''}</small></div>`;
    }
    if(r.kind==='grant'){
      const g=r.x,plus=g.amount>=0;
      return `<div class="log-row"><b class="tag-grant">${plus?'원화 지급':'원화 차감'} · ${escHtml(g.title||'관리자')}</b><b class="${plus?'gain':'down'}">${plus?'+':'-'}${fmt(Math.abs(g.amount))}원</b><small>${new Date(g.at).toLocaleString('ko-KR')}${g.message?' · '+escHtml(g.message):''}</small></div>`;
    }
    const x=r.x,s=STOCKS.find(v=>v.code===x.code);
    if(!s)return '';
    return `<div class="log-row"><b class="${x.type==='buy'?'gain':'down'}">${x.type==='buy'?'매수':'매도'} · ${escHtml(s.name)}</b><b>${fmt(x.price*x.qty)}원</b><small>${new Date(x.at).toLocaleString('ko-KR')} · ${fmt(x.price)}원 × ${fmt(x.qty)}주</small></div>`;
  }).join(''):'<div class="empty">아직 거래내역이 없어요.</div>';
  document.body.insertAdjacentHTML('beforeend',`<div class="overlay"><div class="sheet"><div class="sheet-head"><h2>거래내역</h2>${closeButton()}</div><div class="log-list">${html}</div></div></div>`);
};

(function waitStockGrantReady(){
  if(state&&Store.online&&Store.db&&Store.uid){StockGrantWatch.start();return}
  setTimeout(waitStockGrantReady,700);
})();

window.__marketV51={
  version:51,
  marketRulesChanged:false,
  adminStockGrant:true,
  grantPriceBasis:'market-at-createdAtMs',
  duplicateClaimProtection:true
};
</script>


<script>
/* ============ V52 — 실시간 급상승/급하락 + KOSPI 체감 강화 ============
   [급상승/급하락]
   - 전일종가 누적 등락률이 아니라 "실제시간 최근 5분 가격변화율"로 순위/표시.
   - 거래량 탭과 종목 상세는 기존 기준 그대로.
   - 모든 종목 DOM을 유지해 새로 급등/급락하는 종목도 자동 진입 가능.
   - 2.5초 스냅샷 캐시 + 2.5초 정렬로 부하 제한.

   [KOSPI]
   - 구성종목 가중 시장가 기반 원본 지수는 그대로 사용.
   - 3000 기준 로그거리만 1.45배 확대해 상승/하락 체감을 조금 강화.
   - 랜덤 노이즈/평균회귀/강제 방향 없음.
   - 개별 주가/매매/랭킹 수익률에는 영향 없음.
*/

const V52_WINDOW_MS = 5 * 60 * 1000;
const V52_LIVE_CACHE_MS = 2500;
const V52_LIVE_MOVER_CACHE = new Map();
let V52_LIVE_CACHE_SLOT = -1;

const V52_BASE_QUOTE = quote;
function v52LiveMover(s, now=Date.now()){
  const slot=Math.floor(now/V52_LIVE_CACHE_MS);
  if(slot!==V52_LIVE_CACHE_SLOT){
    V52_LIVE_CACHE_SLOT=slot;
    V52_LIVE_MOVER_CACHE.clear();
  }
  const hit=V52_LIVE_MOVER_CACHE.get(s.code);
  if(hit)return hit;

  const q=V52_BASE_QUOTE(s);
  const pastMs=now-V52_WINDOW_MS;
  const past=Math.max(1,fastVisualPriceAt(s,pastMs));
  const liveChange=(q.price-past)/past*100;
  const out={q,liveChange,past};
  V52_LIVE_MOVER_CACHE.set(s.code,out);
  return out;
}

// V47 이전까지 누적된 최종 발견 UI를 그대로 사용하되,
// 급상승/급하락일 때만 정렬 기준을 최근 5분으로 바꾼다.
// value 정렬 경로를 빌려 전체 종목을 DOM에 남겨 이후 신규 진입도 가능하게 한다.
const V52_DISCOVER_BASE = discover;
discover=function v52LiveDiscover(watch=false){
  if(watch || (sort!=='rise' && sort!=='fall'))return V52_DISCOVER_BASE(watch);

  const wanted=sort;
  const oldQuote=quote;
  const oldSort=sort;
  try{
    quote=function(s){
      const x=v52LiveMover(s);
      // 기존 renderer가 q.change를 화면 표시하고 q.volume으로 value 정렬한다.
      return {
        ...x.q,
        change:x.liveChange,
        volume:wanted==='rise' ? x.liveChange : -x.liveChange
      };
    };
    rawQuote=quote;
    sort='value';

    // V47 snapshot wrapper는 과거 전일등락 q를 주입하므로
    // 그 직전 renderer를 직접 호출해 최근 5분 q가 실제 사용되도록 한다.
    let html=(typeof v47DiscoverBase==='function')
      ? v47DiscoverBase(false)
      : V52_DISCOVER_BASE(false);

    // 탭 선택 표시만 원래 사용자가 선택한 급상승/급하락으로 복구.
    html=html
      .replace(/(<button data-sort="value"[^>]*class=")[^"]*(")/,'$1$2')
      .replace(new RegExp(`(<button data-sort="${wanted}"[^>]*class=")[^"]*(")`),'$1active$2');

    return html;
  }finally{
    sort=oldSort;
    quote=oldQuote;
    rawQuote=quote;
  }
};

// 현재 화면의 mover 행을 2.5초마다 재평가.
// 전체 종목 row가 존재하므로 새 급등/급락 종목도 즉시 순위에 들어올 수 있다.
let V52_LAST_REORDER=0;
function v52RefreshMoverRows(force=false){
  if(view!=='discover' || (sort!=='rise'&&sort!=='fall') || selected)return;
  const now=Date.now();
  if(!force && now-V52_LAST_REORDER<V52_LIVE_CACHE_MS)return;
  V52_LAST_REORDER=now;

  const screen=document.querySelector('#app .screen');
  if(!screen)return;
  const rows=[...screen.querySelectorAll('.stock[data-stock]')];
  if(!rows.length)return;

  const scored=[];
  for(const row of rows){
    const s=V43_STOCK_BY_CODE?.get?.(row.dataset.stock) || STOCKS.find(x=>x.code===row.dataset.stock);
    if(!s)continue;
    const x=v52LiveMover(s,now);
    const el=row.querySelector('[data-quote]');
    if(el){
      el.textContent=`${fmt(x.q.price)}원 · ${pct(x.liveChange)}`;
      el.className=x.liveChange<0?'down':'gain';
    }
    const eligible=sort==='rise'?x.liveChange>0:x.liveChange<0;
    row.classList.toggle('hidden',!eligible);
    scored.push({row,score:x.liveChange});
  }

  scored.sort((a,b)=>sort==='rise'?b.score-a.score:a.score-b.score);
  // 같은 부모 안에서 appendChild는 기존 노드를 이동만 하므로 listener/상태 유지.
  for(const x of scored)screen.appendChild(x.row);

  let rank=0;
  for(const x of scored){
    if(x.row.classList.contains('hidden'))continue;
    rank++;
    const n=x.row.querySelector('.rank-num');
    if(n)n.textContent=rank;
  }
}

// 기존 실시간 갱신이 q.change(전일종가)를 다시 덮어쓴 뒤
// mover 화면만 최근 5분 값으로 재적용한다.
const V52_REFRESH_BASE=refreshLive;
refreshLive=function(){
  const out=V52_REFRESH_BASE();
  v52RefreshMoverRows(false);
  return out;
};

// 탭/필터 클릭 직후에도 바로 정렬.
const V52_BIND_BASE=bind;
bind=function(){
  V52_BIND_BASE();
  if(view==='discover'&&(sort==='rise'||sort==='fall')){
    setTimeout(()=>v52RefreshMoverRows(true),0);
  }
};

// ------------------------------------------------------------------
// KOSPI: 구성종목 기반 원본 움직임을 확대해서 보여준다.
// 1.45 → 1.85 : v9MarketImpulse 상향과 합쳐서 "2900~3000대에 계속 붙어있는" 느낌을
// 완화하는 정도. 종목 가격/체결/랭킹 계산에는 전혀 영향 없는 화면 표시 전용 배율이라
// 과하게 올려도 "도박장 같아진다"는 체감과는 무관하지만, 지수만 튀는 부자연스러움을
// 피하려고 소폭만 올렸다.
// ------------------------------------------------------------------
const V52_KOSPI_BASE=gameKospiQuote;
const V52_KOSPI_ACTIVITY=1.85;
gameKospiQuote=function v52MoreActiveKospi(ms=Date.now()){
  const q=V52_KOSPI_BASE(ms);
  const amp=v=>{
    const r=Math.max(.05,(+v||GAME_KOSPI_BASE)/GAME_KOSPI_BASE);
    return GAME_KOSPI_BASE*Math.exp(Math.log(r)*V52_KOSPI_ACTIVITY);
  };
  const level=amp(q.level),open=amp(q.open);
  return {level,open,change:(level/open-1)*100};
};

// 헤더/발견 KOSPI는 다음 refresh부터 자동으로 새 값을 사용.
// 이전 2초 캐시의 원본 값은 V52가 변환해서 사용하므로 시장 가격에는 영향 없음.

  kospiSource:'weighted-constituent-market-prices',
  kospiActivityMultiplier:1.45,

};

<script>
/* ============ V53 — 실시간 급상승/급하락 순위 정렬 오류 수정 ============
   V52의 최근 5분 기준은 유지.
   원인:
   - V52가 기존 renderer에서 '거래량 정렬'을 임시로 빌리고,
     렌더 후 DOM을 screen 끝으로 이동시키는 방식이라
     V47 snapshot/기존 refresh와 충돌해 표시값과 순위가 서로 어긋날 수 있었다.

   수정:
   - 급상승/급하락 화면은 처음부터 최근 5분 수익률로 직접 계산/정렬.
   - 순위번호도 정렬 결과에서 1,2,3... 새로 생성.
   - 실시간 갱신 때 전용 mover-list 내부만 다시 생성.
   - 거래량/관심/종목상세/시장엔진/KOSPI V52 로직은 그대로.
*/

const V53_DISCOVER_FALLBACK=discover;

function v53MoverUniverse(){
  return STOCKS.filter(s=>assetFilter==='etf'?s.isETF:!s.isETF)
    .filter(s=>sectorFilter==='전체' || (assetFilter==='etf'?s.etfCategory===sectorFilter:s.sector===sectorFilter));
}

function v53MoverRowsHtml(now=Date.now()){
  let list=v53MoverUniverse().map(s=>{
    const x=v52LiveMover(s,now);
    return {s,q:x.q,change:x.liveChange};
  });

  list=list.filter(x=>sort==='rise'?x.change>0:x.change<0);
  list.sort((a,b)=>sort==='rise'?b.change-a.change:a.change-b.change);

  return list.length
    ? list.map((x,i)=>`<div class="stock" data-stock="${x.s.code}">
        <div class="row"><span class="rank-num">${i+1}</span>${logo(x.s)}</div>
        <div>
          <div class="name">${x.s.name}</div>
          <small class="${x.change<0?'down':'gain'}" data-quote="${x.s.code}">
            ${fmt(x.q.price)}원 · ${pct(x.change)}
          </small>
        </div>
        <button class="icon-btn heart" aria-label="${x.s.name} 관심 종목" data-watch="${x.s.code}">
          ${state.watch.includes(x.s.code)?'♥':'♡'}
        </button>
      </div>`).join('')
    : `<div class="empty">${sort==='rise'?'최근 5분 상승 종목이 없어요':'최근 5분 하락 종목이 없어요'}</div>`;
}

function v53MoverDiscover(){
  const groups=assetFilter==='etf'
    ? ['전체',...new Set(ETF_STOCKS.map(s=>s.etfCategory))]
    : ['전체',...new Set(STOCKS.filter(s=>!s.isETF).map(s=>s.sector))];
  const now=new Date();
  const assetMenu=`<div class="asset-switch">
    <button data-asset="stock" class="asset-card ${assetFilter==='stock'?'active':''}">
      <span class="asset-symbol kr-flag">🇰🇷</span><b>국내주식</b>
    </button>
    <button data-asset="etf" class="asset-card ${assetFilter==='etf'?'active':''}">
      <span class="asset-symbol etf-mark"><i></i></span><b>ETF</b>
    </button>
  </div>`;
  const chips=`<div class="chips">${groups.map(g=>`<button data-sector="${g}" class="chip ${sectorFilter===g?'active':''}">${g}</button>`).join('')}</div>`;

  return shell(`${header('발견')}
    ${assetMenu}${chips}
    <div class="strip">
      <div>오늘 이슈<b>1개</b></div>
      <div>코스피<b class="gain">상승</b></div>
      <div>시장 시간<b>${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</b></div>
    </div>
    <div class="issue"><b>✦ 실시간 이슈</b>1　${newsText()}</div>
    <h2>${assetFilter==='etf'?'ETF 실시간':'실시간 종목'}</h2>
    <div class="tabs">
      ${[['value','거래량'],['rise','급상승'],['fall','급하락']].map(x=>`<button data-sort="${x[0]}" class="${sort===x[0]?'active':''}">${x[1]}</button>`).join('')}
    </div>
    <div id="v53-mover-list">${v53MoverRowsHtml(Date.now())}</div>
  `,'discover');
}

// 최종 discover override.
discover=function(watch=false){
  if(!watch && (sort==='rise'||sort==='fall'))return v53MoverDiscover();
  return V53_DISCOVER_FALLBACK(watch);
};

// V52의 잘못된 screen-level 재배치는 완전히 비활성화.
v52RefreshMoverRows=function(){};

// 최근 5분 화면만 2.5초마다 전용 list를 정확히 다시 계산.
// 화면 전체 render를 하지 않아서 헤더/스크롤 위치는 유지.
let V53_LAST_REFRESH=0;
function v53RefreshMoverList(force=false){
  if(view!=='discover'||selected||(sort!=='rise'&&sort!=='fall'))return;
  const list=document.getElementById('v53-mover-list');
  if(!list)return;
  const now=Date.now();
  if(!force && now-V53_LAST_REFRESH<V52_LIVE_CACHE_MS)return;
  V53_LAST_REFRESH=now;

  const next=v53MoverRowsHtml(now);
  // 내용이 같은 경우 DOM을 건드리지 않는다.
  if(list.__v53Html===next)return;
  list.__v53Html=next;
  list.innerHTML=next;

  // 새로 생성된 row에만 기존 click/watch handler 다시 연결.
  document.querySelectorAll('#v53-mover-list [data-stock]').forEach(b=>b.onclick=e=>{
    if(e.target.closest('[data-watch]'))return;
    selected=STOCKS.find(s=>s.code===b.dataset.stock);
    chartRange='day';chartMode='line';chartHoverIndex=-1;
    $('#app').innerHTML=detail(selected);bind();
  });
  document.querySelectorAll('#v53-mover-list [data-watch]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const c=b.dataset.watch;
    state.watch=state.watch.includes(c)?state.watch.filter(x=>x!==c):[...state.watch,c];
    Store.saveMe(userId,state);
    b.textContent=state.watch.includes(c)?'♥':'♡';
  });
}

const V53_REFRESH_BASE=refreshLive;
refreshLive=function(){
  const out=V53_REFRESH_BASE();
  v53RefreshMoverList(false);
  return out;
};

const V53_BIND_BASE=bind;
bind=function(){
  V53_BIND_BASE();
  if(view==='discover'&&(sort==='rise'||sort==='fall')){
    setTimeout(()=>v53RefreshMoverList(true),0);
  }
};

  kospiV52Preserved:true
};

<script>
/* ============ V54 — mover 정렬 패치 최적화/충돌 방지 ============
   - V53의 최근 5분 기준/정렬 결과/시장 엔진/KOSPI/거래량 로직은 변경하지 않음.
   - 2.5초마다 mover-list 전체 innerHTML 교체하던 부분만 제거.
   - 기존 행을 code 기준으로 재사용하고, 값/순위/순서만 갱신.
   - 따라서 클릭/관심종목 listener를 매번 재바인딩하지 않음.
   - 전용 #v53-mover-list 안에서만 이동하므로 V52의 screen-level 충돌은 재발하지 않음.
*/

let V54_LAST_REFRESH=0;
function v54MoverSnapshot(now=Date.now()){
  let rows=v53MoverUniverse().map(s=>{
    const x=v52LiveMover(s,now);
    return {s,q:x.q,change:x.liveChange};
  });
  rows=rows.filter(x=>sort==='rise'?x.change>0:x.change<0);
  rows.sort((a,b)=>sort==='rise'?b.change-a.change:a.change-b.change);
  return rows;
}

v53RefreshMoverList=function v54RefreshMoverList(force=false){
  if(view!=='discover'||selected||(sort!=='rise'&&sort!=='fall'))return;
  const list=document.getElementById('v53-mover-list');
  if(!list)return;
  const now=Date.now();
  if(!force && now-V54_LAST_REFRESH<V52_LIVE_CACHE_MS)return;
  V54_LAST_REFRESH=now;

  const data=v54MoverSnapshot(now);
  if(!data.length){
    const msg=sort==='rise'?'최근 5분 상승 종목이 없어요':'최근 5분 하락 종목이 없어요';
    if(list.dataset.v54Empty!==msg){
      list.innerHTML=`<div class="empty">${msg}</div>`;
      list.dataset.v54Empty=msg;
    }
    return;
  }
  delete list.dataset.v54Empty;

  // 기존 DOM을 code별로 재사용한다. 신규 진입 종목만 새 행 생성.
  const existing=new Map([...list.querySelectorAll('.stock[data-stock]')].map(el=>[el.dataset.stock,el]));
  const wanted=new Set();

  data.forEach((x,i)=>{
    wanted.add(x.s.code);
    let row=existing.get(x.s.code);
    if(!row){
      row=document.createElement('div');
      row.className='stock';
      row.dataset.stock=x.s.code;
      row.innerHTML=`<div class="row"><span class="rank-num"></span>${logo(x.s)}</div><div><div class="name">${x.s.name}</div><small data-quote="${x.s.code}"></small></div><button class="icon-btn heart" aria-label="${x.s.name} 관심 종목" data-watch="${x.s.code}">${state.watch.includes(x.s.code)?'♥':'♡'}</button>`;
      row.onclick=e=>{
        if(e.target.closest('[data-watch]'))return;
        selected=STOCKS.find(s=>s.code===row.dataset.stock);
        chartRange='day';chartMode='line';chartHoverIndex=-1;
        $('#app').innerHTML=detail(selected);bind();
      };
      const heart=row.querySelector('[data-watch]');
      if(heart)heart.onclick=e=>{
        e.stopPropagation();
        const c=heart.dataset.watch;
        state.watch=state.watch.includes(c)?state.watch.filter(v=>v!==c):[...state.watch,c];
        Store.saveMe(userId,state);
        heart.textContent=state.watch.includes(c)?'♥':'♡';
      };
    }

    const rank=row.querySelector('.rank-num');
    if(rank && rank.textContent!==String(i+1))rank.textContent=String(i+1);
    const qel=row.querySelector('[data-quote]');
    if(qel){
      const text=`${fmt(x.q.price)}원 · ${pct(x.change)}`;
      if(qel.textContent.trim()!==text)qel.textContent=text;
      const cls=x.change<0?'down':'gain';
      if(qel.className!==cls)qel.className=cls;
    }
    const heart=row.querySelector('[data-watch]');
    if(heart){
      const mark=state.watch.includes(x.s.code)?'♥':'♡';
      if(heart.textContent!==mark)heart.textContent=mark;
    }

    // 전용 list 내부에서만 순서를 맞춘다. 같은 노드는 이동만 하므로 listener 유지.
    const at=list.children[i];
    if(at!==row)list.insertBefore(row,at||null);
  });

  // 순위 밖으로 나간 행만 제거.
  existing.forEach((row,code)=>{if(!wanted.has(code))row.remove()});
};

  rowListenersPreserved:true,

</script>


<script>
/* ============ V55 — 급상승/급하락 표시값 충돌 완전 분리 ============
   실제 원인:
   - 기존 공용 refreshLive/V43 observer가 [data-quote]를 1초마다 전일종가 등락률로 덮어씀.
   - 동시에 공용 로직이 그 값의 부호로 row.hidden을 바꿔 순위가 1,3,4,7...처럼 비어 보일 수 있었음.
   - V53/V54 정렬 계산 자체는 최근 5분이었지만 표시/숨김만 과거 로직에 다시 덮였던 것.

   수정:
   - mover 전용 표시는 data-v55-mover-quote 사용. 공용 [data-quote] 경로에서 완전 격리.
   - mover 행은 공용 hidden 제어 대상이 되지 않음.
   - 최근 5분 값으로 정렬/표시/순위번호를 같은 스냅샷에서 한번에 갱신.
   - 거래량/종목상세/KOSPI/시장엔진/성능 캐시는 변경 없음.
*/

function v55MoverRowsHtml(now=Date.now()){
  const rows=v54MoverSnapshot(now);
  if(!rows.length)return `<div class="empty">${sort==='rise'?'최근 5분 상승 종목이 없어요':'최근 5분 하락 종목이 없어요'}</div>`;
  return rows.map((x,i)=>`<div class="stock v55-mover-row" data-stock="${x.s.code}">

    <div>
      <div class="name">${x.s.name}</div>
      <small class="${x.change<0?'down':'gain'}" data-v55-mover-quote="${x.s.code}">${fmt(x.q.price)}원 · ${pct(x.change)}</small>
    </div>
    <button class="icon-btn heart" aria-label="${x.s.name} 관심 종목" data-watch="${x.s.code}">${state.watch.includes(x.s.code)?'♥':'♡'}</button>
  </div>`).join('');
}

// 초기 mover 화면도 공용 data-quote를 쓰지 않도록 renderer 교체.
v53MoverRowsHtml=v55MoverRowsHtml;

// V54 incremental updater를 최근 5분 전용 attribute로 완전 교체.
v53RefreshMoverList=function v55RefreshMoverList(force=false){
  if(view!=='discover'||selected||(sort!=='rise'&&sort!=='fall'))return;
  const list=document.getElementById('v53-mover-list');
  if(!list)return;
  const now=Date.now();
  if(!force && now-V54_LAST_REFRESH<V52_LIVE_CACHE_MS)return;
  V54_LAST_REFRESH=now;

  const data=v54MoverSnapshot(now);
  if(!data.length){
    const msg=sort==='rise'?'최근 5분 상승 종목이 없어요':'최근 5분 하락 종목이 없어요';
    if(list.dataset.v55Empty!==msg){list.innerHTML=`<div class="empty">${msg}</div>`;list.dataset.v55Empty=msg}
    return;
  }
  delete list.dataset.v55Empty;

  const existing=new Map([...list.querySelectorAll('.stock[data-stock]')].map(el=>[el.dataset.stock,el]));
  const wanted=new Set();

  data.forEach((x,i)=>{
    wanted.add(x.s.code);
    let row=existing.get(x.s.code);
    if(!row){
      row=document.createElement('div');
      row.className='stock v55-mover-row';
      row.dataset.stock=x.s.code;
      row.innerHTML=`<div class="row"><span class="rank-num"></span>${logo(x.s)}</div><div><div class="name">${x.s.name}</div><small data-v55-mover-quote="${x.s.code}"></small></div><button class="icon-btn heart" aria-label="${x.s.name} 관심 종목" data-watch="${x.s.code}">${state.watch.includes(x.s.code)?'♥':'♡'}</button>`;
      row.onclick=e=>{
        if(e.target.closest('[data-watch]'))return;
        selected=STOCKS.find(s=>s.code===row.dataset.stock);
        chartRange='day';chartMode='line';chartHoverIndex=-1;
        $('#app').innerHTML=detail(selected);bind();
      };
      const heart=row.querySelector('[data-watch]');
      if(heart)heart.onclick=e=>{
        e.stopPropagation();
        const c=heart.dataset.watch;
        state.watch=state.watch.includes(c)?state.watch.filter(v=>v!==c):[...state.watch,c];
        Store.saveMe(userId,state);
        heart.textContent=state.watch.includes(c)?'♥':'♡';
      };
    }

    // 공용 refresh가 이전에 남긴 hidden 상태까지 강제로 제거.
    row.classList.remove('hidden');
    row.classList.add('v55-mover-row');

    const rank=row.querySelector('.rank-num');
    if(rank)rank.textContent=String(i+1);

    // 혹시 V53/V54에서 만들어진 옛 data-quote 노드가 남아있으면 전용 속성으로 전환.
    let qel=row.querySelector('[data-v55-mover-quote]');
    if(!qel){
      qel=row.querySelector('[data-quote]');
      if(qel){
        qel.removeAttribute('data-quote');
        qel.setAttribute('data-v55-mover-quote',x.s.code);
      }
    }
    if(qel){
      qel.textContent=`${fmt(x.q.price)}원 · ${pct(x.change)}`;
      qel.className=x.change<0?'down':'gain';
    }

    const heart=row.querySelector('[data-watch]');
    if(heart)heart.textContent=state.watch.includes(x.s.code)?'♥':'♡';

    const at=list.children[i];
    if(at!==row)list.insertBefore(row,at||null);
  });

  existing.forEach((row,code)=>{if(!wanted.has(code))row.remove()});
};

<script>
/* ============ V56 — 급상승/급하락을 거래량형 실시간 정렬로 통일 ============
   목적:
   - 최근 5분 수익률(V52~V55)을 제거하고, 화면에 이미 사용하는 quote(s).change
     즉 "현재가 vs 전일 종가" 등락률을 급상승/급하락 정렬 기준으로 사용.
   - 거래량 탭처럼 현재 스냅샷을 주기적으로 다시 계산/정렬.
   - 시장 가격 생성, 거래량, KOSPI, 매매, Firebase, 랭킹 로직은 변경하지 않음.
   - V55 전용 DOM 격리는 유지해 공용 refreshLive와의 표시/hidden 충돌 방지.
*/

function v56MoverSnapshot(){
  let rows=v53MoverUniverse().map(s=>{
    const q=quote(s);
    return {s,q,change:Number(q.change)||0};
  });
  rows=rows.filter(x=>sort==='rise'?x.change>0:x.change<0);
  rows.sort((a,b)=>sort==='rise'?b.change-a.change:a.change-b.change);
  return rows;
}

function v56MoverRowsHtml(){
  const rows=v56MoverSnapshot();
  if(!rows.length)return `<div class="empty">${sort==='rise'?'현재 상승 종목이 없어요':'현재 하락 종목이 없어요'}</div>`;
  return rows.map((x,i)=>`<div class="stock v55-mover-row" data-stock="${x.s.code}">
    <div class="row"><span class="rank-num">${i+1}</span>${logo(x.s)}</div>
    <div><div class="name">${x.s.name}</div><small class="${x.change<0?'down':'gain'}" data-v55-mover-quote="${x.s.code}">${fmt(x.q.price)}원 · ${pct(x.change)}</small></div>
    <button class="icon-btn heart" aria-label="${x.s.name} 관심 종목" data-watch="${x.s.code}">${state.watch.includes(x.s.code)?'♥':'♡'}</button>
  </div>`).join('');
}

// 초기 화면도 전일 종가 대비 현재 등락률 기준.

let V56_LAST_REFRESH=0;
v53RefreshMoverList=function v56RefreshMoverList(force=false){
  if(view!=='discover'||selected||(sort!=='rise'&&sort!=='fall'))return;
  const list=document.getElementById('v53-mover-list');
  if(!list)return;
  const now=Date.now();
  // 기존 성능 한도(2.5초)를 그대로 사용. Firebase I/O 없음.
  if(!force && now-V56_LAST_REFRESH<V52_LIVE_CACHE_MS)return;
  V56_LAST_REFRESH=now;

  const data=v56MoverSnapshot();
  if(!data.length){
    const msg=sort==='rise'?'현재 상승 종목이 없어요':'현재 하락 종목이 없어요';
    if(list.dataset.v56Empty!==msg){list.innerHTML=`<div class="empty">${msg}</div>`;list.dataset.v56Empty=msg}
    return;
  }
  delete list.dataset.v56Empty;

  const existing=new Map([...list.querySelectorAll('.stock[data-stock]')].map(el=>[el.dataset.stock,el]));
  const wanted=new Set();

  data.forEach((x,i)=>{
    wanted.add(x.s.code);
    let row=existing.get(x.s.code);
    if(!row){
      row=document.createElement('div');
      row.className='stock v55-mover-row';
      row.dataset.stock=x.s.code;
      row.innerHTML=`<div class="row"><span class="rank-num"></span>${logo(x.s)}</div><div><div class="name">${x.s.name}</div><small data-v55-mover-quote="${x.s.code}"></small></div><button class="icon-btn heart" aria-label="${x.s.name} 관심 종목" data-watch="${x.s.code}">${state.watch.includes(x.s.code)?'♥':'♡'}</button>`;
      row.onclick=e=>{
        if(e.target.closest('[data-watch]'))return;
        selected=STOCKS.find(s=>s.code===row.dataset.stock);
        chartRange='day';chartMode='line';chartHoverIndex=-1;
        $('#app').innerHTML=detail(selected);bind();
      };
      const heart=row.querySelector('[data-watch]');
      if(heart)heart.onclick=e=>{
        e.stopPropagation();
        const c=heart.dataset.watch;
        state.watch=state.watch.includes(c)?state.watch.filter(v=>v!==c):[...state.watch,c];
        Store.saveMe(userId,state);
        heart.textContent=state.watch.includes(c)?'♥':'♡';
      };
    }

    row.classList.remove('hidden');
    row.classList.add('v55-mover-row');
    const rank=row.querySelector('.rank-num');
    if(rank && rank.textContent!==String(i+1))rank.textContent=String(i+1);
    const qel=row.querySelector('[data-v55-mover-quote]');
    if(qel){
      const text=`${fmt(x.q.price)}원 · ${pct(x.change)}`;
      if(qel.textContent.trim()!==text)qel.textContent=text;
      const cls=x.change<0?'down':'gain';
      if(qel.className!==cls)qel.className=cls;
    }
    const heart=row.querySelector('[data-watch]');
    if(heart){
      const mark=state.watch.includes(x.s.code)?'♥':'♡';
      if(heart.textContent!==mark)heart.textContent=mark;
    }
    const at=list.children[i];
    if(at!==row)list.insertBefore(row,at||null);
  });
  existing.forEach((row,code)=>{if(!wanted.has(code))row.remove()});
};

<script>
/* ============ V57 — 전일 종가 기준을 '직전 게임일 마지막 틱'으로 수정 ============
   문제:
   - 기존 v411PrevClose()는 실제 시계의 '어제 23:30'을 fastVisualPriceAt()에 넣었다.
   - MARKET_V9_SPEED=15 환경에서는 실제 11시간 차이가 게임상 약 5.6일로 확대되어
     급상승/급하락 등락률 기준가가 지나치게 오래된 가격을 참조할 수 있었다.

   수정:
   - 현재 sessionTick이 속한 게임일의 바로 직전 게임일 마지막 틱(day*390-1)을 사용.
   - 가격 생성/확률/변동성/postMove/extreme/체결 규칙은 변경하지 않음.
   - 개별주/ETF 모두 각자의 표시가격 라우터를 그대로 사용.
*/
function v57PreviousGameCloseTick(ms=Date.now()){
  const t=sessionTick(ms);
  const day=Math.floor(t/390);
  return day*390-1;
}

v411PrevClose=function v57GamePrevClose(s,ms=Date.now()){
  if(!s)return 1;
  const t=v57PreviousGameCloseTick(ms);
  const q=s?.isETF ? etfDisplayedAt(s,t) : v10StockDisplayedAt(s,t);
  return Math.max(1,Number(q?.price)||1);
};

   중요 수정:
   - V60의 런타임 s.tier='junk' 변경 제거.
   - V60의 가격 캐시 일괄 초기화 제거.
   - 따라서 기존 V59까지의 모든 종목 가격 경로/보유자산 평가금은 그대로 유지.
   - junk 후보 12종은 '후보 표시값'만 보존하고 가격엔진에는 아직 적용하지 않음.
   - 삼성전자 2X ETF 가격연동/아이콘/관리자 주식지급 호환은 그대로 유지.

   캐시를 지우지 않더라도 미래 캐시 미스 시 가격 경로가 갑자기 달라질 수 있음.

<script>
/* ============ V62 — 삼성 2X 상품 합산 보유비중 25% 상한 ============
   - 대상: SAMS2L + SAMS2I 합산
   - 기준: 주문 확정 시점 총 평가자산(total)의 25%
   - 기존 보유분이 이미 25%를 넘는 경우 강제매도하지 않음; 추가 매수만 차단
   - 매도는 제한하지 않음
   - 시장/ETF 가격 엔진, 랭킹, Firebase 구조 변경 없음
*/
const V62_LEVERAGED_CODES=new Set(['SAMS2L','SAMS2I']);
const V62_LEVERAGED_CAP=.25;
const v62TradeBase=trade;

function v62LeveragedValue(){
  let value=0;
  for(const code of V62_LEVERAGED_CODES){
    const h=state?.holdings?.[code];
    const s=STOCKS.find(x=>x.code===code);
    if(h?.qty>0&&s)value+=h.qty*quote(s).price;
  }
  return value;
}

trade=async function v62Trade(type,qty){
  qty=Math.floor(Number(qty));
  if(type!=='buy'||!selected||!V62_LEVERAGED_CODES.has(selected.code))
    return v62TradeBase(type,qty);

  // 기존 체결 래퍼의 검증(수량/주문정보/장시간/5초 만료)은 그대로 둔다.
  if(!Number.isFinite(qty)||qty<1||!pendingOrder||pendingOrder.type!=='buy'||pendingOrder.code!==selected.code)
    return v62TradeBase(type,qty);

function v64Active(day,minute){
  return day>V64_TRANSITION_DAY || (day===V64_TRANSITION_DAY&&minute>V64_TRANSITION_MINUTE);

function v64Ramp(day,minute){
  if(!v64Active(day,minute))return 0;
  if(day>V64_TRANSITION_DAY)return 1;
  return Math.max(0,Math.min(1,(minute-V64_TRANSITION_MINUTE)/V64_BLEND_MINUTES));
}
function v64CausalAverage(getter,day,minute,selector){
  // 미래 상태를 미리 반영하지 않고 현재~과거 4지점을 평균한다.
  const offsets=[0,4,9,14],weights=[.42,.29,.19,.10];
  let sum=0,totalWeight=0;
  for(let i=0;i<offsets.length;i++){
    const m=Math.max(0,minute-offsets[i]);
    const value=Number(selector(getter(day,m)));
    if(Number.isFinite(value)){sum+=value*weights[i];totalWeight+=weights[i]}
  }
  return totalWeight?sum/totalWeight:0;
}

  return {
    ...cur,
    mult:(cur.mult||1)*(1-r)+balance(avgMult)*r,
    flow:(cur.flow||1)*(1-r)+balance(avgFlow)*r
  };
};

<script>

   V64가 상태 전환만 보정해 실제 화면의 2초 미세변동/10원 반올림 정체를

   - 5천원 미만 1원, 5만원 미만 5원, 그 이상 10원 단위
   - 조용한 종목도 약 1.5초마다 최소 1~2호가 움직일 수 있는 미세변동 하한
   - 가격이 비싼 종목의 미세변동은 과도하게 커지지 않도록 상한 유지
   - 화면가·평가가·주문 확정 체결가에 같은 호가 반올림 사용
*/
function v65TickSize(price){
  const p=Math.max(1,Number(price)||1);
  return p<5000?1:p<50000?5:10;
}
function v65RoundPrice(price){
  const p=Math.max(1,Number(price)||1),tick=v65TickSize(p);
  return Math.max(tick,Math.round(p/tick)*tick);
}

v12MicroFactor=function v65LiveMicroFactor(s,ms=Date.now()){
  if(!marketSessionInfo(ms).open||s?.isETF)return 1;
  const t=sessionTick(ms),day=Math.floor(t/390),minute=((t%390)+390)%390;
  const act=v11Activity(s,day,minute),reg=v9Regime(s,day,minute),mom=v9Momentum(s,day,minute);
  const reference=Math.max(1,v10StockDisplayedAt(s,t)?.price||s.referencePrice||s.base||1);
  const unitMs=1500,slot=Math.floor(ms/unitMs),phase=((ms%unitMs)+unitMs)%unitMs/unitMs;
  const x=phase*phase*(3-2*phase);

  // 기존 tier 성격은 유지하되 quiet에서도 화면이 멈추지 않을 만큼의 최소폭을 보장한다.
  const tierAmp={blue:.00024,growth:.00032,theme:.00040,junk:.00050}[s.tier]||.00032;
  const activityAmp=Math.min(1.55,.82+Math.max(.55,act.mult||1)*.20);
  const oneTick=v65TickSize(reference)/reference;
  const floorAmp=Math.min(.00135,oneTick*1.35);
  const amp=Math.max(tierAmp*activityAmp,floorAmp);

  const n0=v9Normal('v65-live',s.code,slot),n1=v9Normal('v65-live',s.code,slot+1);
  const noise=(n0+(n1-n0)*x)*amp;
  const lean=Math.max(-.00022,Math.min(.00022,((reg.bias||0)+(Number(mom)||0))*.55));
  return Math.exp(noise+lean);
};

<script>

   목표:

   - 가격 날짜는 하루 1회만 진행하되 국면/모멘텀/활동성은 기존 체감 속도로 순환
   - 각 메인 틱 사이는 계속 보간해 화면 정체 방지
*/
const V68_SESSION_MS=(MARKET_CLOSE_MIN-MARKET_OPEN_MIN)*60*1000;
const V68_STATE_SPEED=MARKET_V9_SPEED*DAY_MS/V68_SESSION_MS*V63_STATE_SPEED;

function v68SessionPosition(ms=Date.now()){
  const d=new Date(ms);
  let sessionDate=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  let open=new Date(d.getFullYear(),d.getMonth(),d.getDate(),8,0,0,0).getTime();
  let close=new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,30,0,0).getTime();
  let effective=ms;

  if(ms<open){
    sessionDate.setDate(sessionDate.getDate()-1);
    open=new Date(sessionDate.getFullYear(),sessionDate.getMonth(),sessionDate.getDate(),8,0,0,0).getTime();
    close=new Date(sessionDate.getFullYear(),sessionDate.getMonth(),sessionDate.getDate(),23,30,0,0).getTime();
    effective=close;
  }else if(ms>=close){
    effective=close;
  }

  const sessionStart=new Date(sessionDate.getFullYear(),sessionDate.getMonth(),sessionDate.getDate()).getTime();
  const day=Math.round((sessionStart-MARKET_EPOCH)/DAY_MS);
  const progress=Math.max(0,Math.min(1,(effective-open)/Math.max(1,close-open)));
  const raw=progress*DAY_STEPS;
  const minute=progress>=1?DAY_STEPS-1:Math.max(0,Math.min(DAY_STEPS-1,Math.floor(raw)));
  const phase=progress>=1?1:raw-minute;
  return {day,minute,phase,tick:day*DAY_STEPS+minute,open,close,progress};
}

<script>
/* ============ V69 — 실제 거래일 사이 가격 연속성 ============
   V68로 날짜축을 실제 하루로 바꾸면서 과거 엔진의 서로 다른 day 경로가
   바로 연결되어 시초가가 과도하게 벌어질 수 있는 문제를 보정한다.
   전일 23:30 종가에 ±1% 이내의 결정론적 갭만 허용한다.
*/
const V69_RAW_BASE=v9RawPriceAt;
const V69_SCALE_CACHE=new Map();
const V69_RAW_CACHE=new Map();
const V69_ANCHOR_DAY=v68SessionPosition(Date.parse('2026-08-26T12:00:00+09:00')).day;

function v69AdjustedRaw(s,t){
  const day=Math.floor(t/DAY_STEPS),minute=((t%DAY_STEPS)+DAY_STEPS)%DAY_STEPS;
  const key=s.code+'|'+t,hit=V69_RAW_CACHE.get(key);
  if(hit)return hit;
  const raw=V69_RAW_BASE(s,t);
  if(day<=V69_ANCHOR_DAY){V69_RAW_CACHE.set(key,raw);return raw}

  const scaleKey=s.code+'|'+day;
  let scale=V69_SCALE_CACHE.get(scaleKey);
  if(!Number.isFinite(scale)){
    const baseOpen=V69_RAW_BASE(s,day*DAY_STEPS);
    const prev=v69AdjustedRaw(s,day*DAY_STEPS-1);
    const gap=Math.max(-.01,Math.min(.01,v9Normal('v69-real-day-gap',s.code,day)*.0045));
    const targetOpen=Math.max(1,prev.price*Math.exp(gap));
    scale=targetOpen/Math.max(1,baseOpen.price);
    V69_SCALE_CACHE.set(scaleKey,scale);
  }
  const scaledOpen=v65RoundPrice(raw.open*scale);
  const scaledPrice=raw.price*scale;
  const walk=v70SessionCumulativeWalk(s,day,minute,scaledOpen);
  const out={...raw,price:v65RoundPrice(scaledPrice+walk),open:scaledOpen,day,minute};
  if(V69_RAW_CACHE.size>STOCKS.length*DAY_STEPS*3)V69_RAW_CACHE.clear();
  V69_RAW_CACHE.set(key,out);
  return out;
}

v9RawPriceAt=function v69ContinuousRawPrice(s,t=marketTick()){return v69AdjustedRaw(s,t)};
priceAt=function(s,t=marketTick()){return s?.isETF?etfDisplayedAt(s,t):v9RawPriceAt(s,t)};

<script>
/* ============ V70 — 저가주 메인 누적 틱 정체 방지 ============
   화면용 랜덤 흔들림이 아니라 v29/V49 메인 가격 누적 ret 자체에
   최소 이동폭을 적용한다. 기존 방향이 있으면 그 방향을 보존하고,
   완전 0일 때만 결정론적 방향을 사용한다.
*/
function v70EnsureCumulativeMove(s,day,minute,price,ret,reg,mom){
  const p=Math.max(1,Number(price)||1),r=Number(ret)||0;
  const minMove=v65TickSize(p)/p*.82;
  if(Math.abs(r)>=minMove)return r;
  let dir=Math.sign(r)||Math.sign((reg?.bias||0)+(Number(mom)||0));
  if(!dir)dir=v9Unit('v70-dir',s.code,day,minute)<.5?-1:1;
  return dir*minMove;
}

const V70_WALK_CACHE=new Map();
function v70SessionCumulativeWalk(s,day,minute,openPrice){
  const key=s.code+'|'+day;
  let st=V70_WALK_CACHE.get(key);
  const tick=v65TickSize(openPrice);
  if(!st)st={last:0,sum:0,values:[0],tick};
  for(let i=st.last+1;i<=minute;i++){
    const u=v9Unit('v70-session-walk',s.code,day,i);
    const dir=u<.5?-1:1;
    st.sum+=dir*st.tick*4;
    st.values[i]=st.sum;
  }
  st.last=Math.max(st.last,minute);
  V70_WALK_CACHE.set(key,st);
  if(V70_WALK_CACHE.size>STOCKS.length*3)V70_WALK_CACHE.clear();
  return st.values[minute]??st.sum;
}

<script>
/* ============ V71 — 영구 누적 장기시장 + 실시장가 연동 KOSPI ============
   목표
   1) 패치 당일 현재 표시가격/보유자산/수익률에 점프를 만들지 않는다.
   2) 다음 실제 거래일부터 장기 시장 국면(침체/약세/횡보/상승/강세)을 영구 누적한다.
   3) 365일 뒤 과거 상승·하락분이 사라지는 장기 평균회귀를 만들지 않는다.
   4) KOSPI는 3000 근처 표시보정이 아니라, 패치 시점의 실제 구성종목 가중 시장가치를 기준으로 산출한다.
   5) KOSPI 상·하한/목표값 복귀/표시 증폭을 두지 않는다.
   6) 기존 장중 종목별 regime/momentum/shock/체결 규칙은 그대로 보존한다.
*/
const V71_TRANSITION_MS=Date.parse('2026-08-27T15:40:00+09:00');
const V71_ANCHOR_DAY=v68SessionPosition(V71_TRANSITION_MS).day;
const V71_BASE_VISUAL=fastVisualPriceAt;
const V71_BASE_SMOOTH=smoothPriceAt;
const V71_BASE_QUOTE=quote;
const V71_BASE_KOSPI=gameKospiQuote;

// 장기 국면은 20~90게임일 동안 지속되며, 다음 국면과 길이는 미리 목표값을 두지 않고 결정론적 난수로 정한다.
// 장기 기대값은 아주 약한 우상향이지만, 수개월~수년 침체/하락 경로도 충분히 가능하다.
const V71_MACRO_STATES=[
  {name:'crash',    p:.06, drift:-.00180},
  {name:'bear',     p:.16, drift:-.00075},
  {name:'softBear', p:.12, drift:-.00025},
  {name:'side',     p:.20, drift: 0},
  {name:'bull',     p:.31, drift: .00055},
  {name:'boom',     p:.15, drift: .00115}
];
const V71_SEGMENTS=[];
function v71EnsureSegments(day){
  if(day<=V71_ANCHOR_DAY)return;
  let start=V71_SEGMENTS.length?V71_SEGMENTS.at(-1).end+1:V71_ANCHOR_DAY+1;
  let idx=V71_SEGMENTS.length;
  while(start<=day){
    const dur=20+Math.floor(v9Unit('v71-macro-duration',idx)*71); // 20~90일
    const u=v9Unit('v71-macro-state',idx);
    let acc=0,state=V71_MACRO_STATES.at(-1);
    for(const x of V71_MACRO_STATES){acc+=x.p;if(u<acc){state=x;break}}
    // 같은 국면이 연속으로 뽑혀도 허용: 실제로 긴 강세/침체가 자연스럽게 생길 수 있다.
    V71_SEGMENTS.push({index:idx,start,end:start+dur-1,name:state.name,drift:state.drift,duration:dur});
    start+=dur;idx++;
  }
}
function v71RegimeAt(day){
  if(day<=V71_ANCHOR_DAY)return {name:'anchor',drift:0,start:V71_ANCHOR_DAY,end:V71_ANCHOR_DAY,duration:1};
  v71EnsureSegments(day);
  // 최근 세그먼트부터 확인하면 일반적인 현재가 호출은 거의 O(1).
  for(let i=V71_SEGMENTS.length-1;i>=0;i--){const s=V71_SEGMENTS[i];if(day>=s.start&&day<=s.end)return s}
  return V71_SEGMENTS[0];
}

// 누적 로그팩터. 과거를 잘라내거나 1로 되돌리는 로직이 없다.
const V71_MACRO_LOG_CACHE=new Map([[V71_ANCHOR_DAY,0]]);
let V71_MACRO_LAST_DAY=V71_ANCHOR_DAY,V71_MACRO_LAST_LOG=0;
function v71MacroLog(day){
  day=Math.floor(day);
  if(day<=V71_ANCHOR_DAY)return 0; // 패치 이전 역사/패치 당일 가격은 그대로
  const hit=V71_MACRO_LOG_CACHE.get(day);if(hit!==undefined)return hit;
  if(day<V71_MACRO_LAST_DAY){
    let log=0;
    for(let d=V71_ANCHOR_DAY+1;d<=day;d++){
      const reg=v71RegimeAt(d);
      log+=reg.drift+v9Normal('v71-macro-noise',d)*.00220;
    }
    V71_MACRO_LOG_CACHE.set(day,log);return log;
  }
  for(let d=V71_MACRO_LAST_DAY+1;d<=day;d++){
    const reg=v71RegimeAt(d);
    V71_MACRO_LAST_LOG+=reg.drift+v9Normal('v71-macro-noise',d)*.00220;
    V71_MACRO_LOG_CACHE.set(d,V71_MACRO_LAST_LOG);
  }
  V71_MACRO_LAST_DAY=day;
  return V71_MACRO_LAST_LOG;
}
function v71MacroFactorForDay(day){return Math.exp(v71MacroLog(day))}
function v71DayFromMs(ms){return v68SessionPosition(ms).day}
function v71AssetMacroFactor(s,day){
  const log=v71MacroLog(day);
  if(!s?.isETF)return Math.exp(log);
  // ETF는 시장 공통분을 대략적인 노출도만큼 반영. 인버스/레버리지는 leverage 부호/배수를 따른다.
  const lev=Number.isFinite(+s.leverage)?+s.leverage:Math.max(0,1-(+s.bondWeight||0));
  return Math.exp(log*lev);
}

// 화면/차트/전일종가가 모두 같은 장기시장 팩터를 보도록 최종 가격 라우터에 적용한다.
fastVisualPriceAt=function v71LongMarketVisual(s,ms=Date.now()){
  const base=Math.max(1,Number(V71_BASE_VISUAL(s,ms))||1);
  const f=ms<V71_TRANSITION_MS?1:v71AssetMacroFactor(s,v71DayFromMs(ms));
  const px=base*f;
  return s?.isETF?Math.max(5,Math.round(px/5)*5):v65RoundPrice(px);
};
smoothPriceAt=fastVisualPriceAt;

// quote는 매매/평가금액/랭킹에도 쓰이므로 동일 가격을 사용한다.
quote=function v71LongMarketQuote(s){
  const q=V71_BASE_QUOTE(s)||{};
  if(!s)return q;
  const now=Date.now(),day=v71DayFromMs(now),f=now<V71_TRANSITION_MS?1:v71AssetMacroFactor(s,day);
  const price=s?.isETF?Math.max(5,Math.round((+q.price||1)*f/5)*5):v65RoundPrice((+q.price||1)*f);
  const open=s?.isETF?Math.max(5,Math.round((+q.open||1)*f/5)*5):v65RoundPrice((+q.open||1)*f);
  const prevMs=v67SessionPrevCloseMs(now);
  const prevClose=Math.max(1,fastVisualPriceAt(s,prevMs));
  const change=(price-prevClose)/prevClose*100;
  return {...q,price,open,prevClose,change};
};
rawQuote=quote;

// KOSPI: 패치 순간의 현재 지수값과 현재 구성종목 시장가치를 동시에 앵커로 고정.
// 이후에는 실제 구성종목의 앵커 대비 가중 가격변화만 반영한다. 3000 복귀/1.85배 표시증폭/상하한 없음.
const V71_KOSPI_ANCHOR_LEVEL=Math.max(1,Number(V71_BASE_KOSPI(V71_TRANSITION_MS)?.level)||GAME_KOSPI_BASE);
const V71_KOSPI_ANCHOR_PRICE=new Map();
for(const s of STOCKS){
  if(s.isETF)continue;
  V71_KOSPI_ANCHOR_PRICE.set(s.code,Math.max(1,Number(V71_BASE_VISUAL(s,V71_TRANSITION_MS))||1));
}
function v71KospiMarketRatio(ms){
  let weighted=0,totalW=0;
  for(const s of STOCKS){
    if(s.isETF)continue;
    const w=kospiWeight(s);if(!(w>0))continue;
    const anchor=V71_KOSPI_ANCHOR_PRICE.get(s.code)||1;
    const px=Math.max(1,fastVisualPriceAt(s,ms));
    weighted+=w*(px/anchor);totalW+=w;
  }
  return weighted/Math.max(.000001,totalW);
}
function v71SessionOpenMs(ms){
  const p=v68SessionPosition(ms);return p.open;
}
gameKospiQuote=function v71MarketValueKospi(ms=Date.now()){
  if(ms<V71_TRANSITION_MS)return V71_BASE_KOSPI(ms);
  const level=V71_KOSPI_ANCHOR_LEVEL*v71KospiMarketRatio(ms);
  const openMs=v71SessionOpenMs(ms);
  const open=V71_KOSPI_ANCHOR_LEVEL*v71KospiMarketRatio(openMs);
  return {level,open,change:(level/open-1)*100};
};

// 검증용: 실제 배포 경로와 같은 macro/regime 함수를 사용해 장기 경로를 빠르게 검사한다.
// baseMarketNoise는 수백 종목 평균 후 남는 완만한 시장 공통 성분을 보수적으로 근사한다.
function v71Simulation(days=3650,scenario=0){
  let log=0,min=1,max=1,peak=1,maxDD=0,curState='',stateChanges=0;
  const samples=[];
  let segStart=0,segEnd=-1,segDrift=0,segName='';
  const nextSeg=(d)=>{
    const idx=Math.floor(d/1e6)+scenario*100003+stateChanges;
    const dur=20+Math.floor(v9Unit('v71-sim-duration',idx)*71);

    for(const x of V71_MACRO_STATES){acc+=x.p;if(u<acc){st=x;break}}
    segStart=d;segEnd=d+dur-1;segDrift=st.drift;segName=st.name;stateChanges++;
  };
  nextSeg(1);
  for(let d=1;d<=days;d++){
    if(d>segEnd)nextSeg(d);
    const noise=v9Normal('v71-sim-macro',scenario,d)*.00220;
    const baseMarketNoise=v9Normal('v71-sim-base',scenario,d)*.00115;
    log+=segDrift+noise+baseMarketNoise;
    const f=Math.exp(log);min=Math.min(min,f);max=Math.max(max,f);peak=Math.max(peak,f);maxDD=Math.max(maxDD,1-f/peak);
    if(d===1||d===30||d===90||d===180||d===365||d===730||d===1825||d===3650||d===days)samples.push({day:d,factor:f,index:V71_KOSPI_ANCHOR_LEVEL*f,state:segName});
  }
  return {days,scenario,anchor:V71_KOSPI_ANCHOR_LEVEL,final:V71_KOSPI_ANCHOR_LEVEL*Math.exp(log),min:V71_KOSPI_ANCHOR_LEVEL*min,max:V71_KOSPI_ANCHOR_LEVEL*max,maxDrawdownPct:maxDD*100,stateChanges,samples};
}

<script>
/* ============ V72 — 장기시장 시간축: 현실 3일 = 게임 1년 ============
   - 실제 08:00~23:30 장/전일종가/등락률 초기화 주기는 그대로 유지한다.
   - 장기 macro 역사만 현실 72시간에 365게임일 진행한다.
   - 장기 국면은 60~240게임일(현실 약 12시간~47시간) 유지한다.
   - 게임일 사이 macro 값을 보간하여 11~12분마다 가격이 계단식으로 튀지 않게 한다.
   - KOSPI는 V71과 동일하게 구성종목 시장가치 결과로 계산하며 상하한/3000 회귀가 없다.
*/
const V72_REAL_MS_PER_GAME_YEAR=3*24*60*60*1000;
const V72_GAME_DAYS_PER_YEAR=365;
const V72_GAME_DAYS_PER_REAL_MS=V72_GAME_DAYS_PER_YEAR/V72_REAL_MS_PER_GAME_YEAR;

const V72_STATES=V71_MACRO_STATES.map(x=>({...x}));
const V72_SEGMENTS=[];
function v72EnsureSegments(day){
  day=Math.floor(day);
  if(day<=V71_ANCHOR_DAY)return;
  let start=V72_SEGMENTS.length?V72_SEGMENTS.at(-1).end+1:V71_ANCHOR_DAY+1;
  let idx=V72_SEGMENTS.length;
  while(start<=day){
    const dur=60+Math.floor(v9Unit('v72-macro-duration',idx)*181); // 60~240 게임일 ≈ 현실 12~47시간
    const u=v9Unit('v72-macro-state',idx);
    let acc=0,state=V72_STATES.at(-1);
    for(const x of V72_STATES){acc+=x.p;if(u<acc){state=x;break}}
    V72_SEGMENTS.push({index:idx,start,end:start+dur-1,name:state.name,drift:state.drift,duration:dur});
    start+=dur;idx++;
  }
}
function v72RegimeAt(day){
  day=Math.floor(day);
  if(day<=V71_ANCHOR_DAY)return {name:'anchor',drift:0,start:V71_ANCHOR_DAY,end:V71_ANCHOR_DAY,duration:1};
  v72EnsureSegments(day);
  for(let i=V72_SEGMENTS.length-1;i>=0;i--){const s=V72_SEGMENTS[i];if(day>=s.start&&day<=s.end)return s}
  return V72_SEGMENTS[0];
}
const V72_LOG_CACHE=new Map([[V71_ANCHOR_DAY,0]]);
let V72_LAST_DAY=V71_ANCHOR_DAY,V72_LAST_LOG=0;
function v72MacroLogDay(day){
  day=Math.floor(day);
  if(day<=V71_ANCHOR_DAY)return 0;
  const hit=V72_LOG_CACHE.get(day);if(hit!==undefined)return hit;
  // V73: 0일부터 전체 재계산하지 않고, 캐시에 있는 가장 가까운 날부터 이어서 계산한다.
  let startDay=V71_ANCHOR_DAY,startLog=0;
  for(let d=Math.min(day-1,V72_LAST_DAY);d>V71_ANCHOR_DAY;d--){
    const c=V72_LOG_CACHE.get(d);
    if(c!==undefined){startDay=d;startLog=c;break;}
  }
  let log=startLog;
  for(let d=startDay+1;d<=day;d++){
    const reg=v72RegimeAt(d);
    log+=reg.drift+v9Normal('v72-macro-noise',d)*.00220;
    V72_LOG_CACHE.set(d,log);
  }
  if(day>V72_LAST_DAY){V72_LAST_DAY=day;V72_LAST_LOG=log;}
  return log;
}
function v72GameDayFloat(ms=Date.now()){
  if(ms<=V71_TRANSITION_MS)return V71_ANCHOR_DAY;
  return V71_ANCHOR_DAY+(ms-V71_TRANSITION_MS)*V72_GAME_DAYS_PER_REAL_MS;
}
function v72MacroLogAtMs(ms=Date.now()){
  if(ms<=V71_TRANSITION_MS)return 0;
  const x=v72GameDayFloat(ms),d=Math.floor(x),f=x-d;
  const a=v72MacroLogDay(d),b=v72MacroLogDay(d+1);
  return a+(b-a)*(f*f*(3-2*f));
}
function v72AssetFactorAtMs(s,ms=Date.now()){
  const log=v72MacroLogAtMs(ms);
  if(!s?.isETF)return Math.exp(log);
  const lev=Number.isFinite(+s.leverage)?+s.leverage:Math.max(0,1-(+s.bondWeight||0));
  return Math.exp(log*lev);
}

// V71이 보관한 '장기 macro 적용 전' 가격을 사용해 이중 적용을 막는다.
// 참고: 개별 종목에는 상한을 두지 않는다. 기준가 자체가 이미 99,999원을 넘는
// 종목이 다수 존재하므로(예: SK하이닉스 1,681,000원대) 고정 상한을 걸면 게임
// 시작 시점부터 정상 가격이 잘려나간다. 상한은 KOSPI 지수에만 적용한다.
const V73_PRICE_CAP=99999;
fastVisualPriceAt=function v72LongMarketVisual(s,ms=Date.now()){
  const base=Math.max(1,Number(V71_BASE_VISUAL(s,ms))||1);
  const f=ms<V71_TRANSITION_MS?1:v72AssetFactorAtMs(s,ms);
  const px=base*f;
  return s?.isETF?Math.max(5,Math.round(px/5)*5):v65RoundPrice(px);
};
smoothPriceAt=fastVisualPriceAt;
quote=function v72LongMarketQuote(s){
  const q=V71_BASE_QUOTE(s)||{};if(!s)return q;
  const now=Date.now(),f=now<V71_TRANSITION_MS?1:v72AssetFactorAtMs(s,now);
  const price=s?.isETF?Math.max(5,Math.round((+q.price||1)*f/5)*5):v65RoundPrice((+q.price||1)*f);
  const open=s?.isETF?Math.max(5,Math.round((+q.open||1)*f/5)*5):v65RoundPrice((+q.open||1)*f);
  const prevMs=v67SessionPrevCloseMs(now),prevClose=Math.max(1,fastVisualPriceAt(s,prevMs));
  return {...q,price,open,prevClose,change:(price-prevClose)/prevClose*100};
};
rawQuote=quote;

// 실제 장의 시가 기준은 그대로. KOSPI 숫자만 현재 구성종목 가치 결과를 따라간다.
gameKospiQuote=function v72MarketValueKospi(ms=Date.now()){
  if(ms<V71_TRANSITION_MS)return V71_BASE_KOSPI(ms);
  const level=Math.min(V73_PRICE_CAP,V71_KOSPI_ANCHOR_LEVEL*v71KospiMarketRatio(ms));
  const openMs=v71SessionOpenMs(ms),open=Math.min(V73_PRICE_CAP,V71_KOSPI_ANCHOR_LEVEL*v71KospiMarketRatio(openMs));
  return {level,open,change:(level/open-1)*100};
};
